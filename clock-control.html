<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clock Controller | Hoop Hub PH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:#fff;
    padding:14px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#ff6b00;
}

.controller-title{
    font-size:14px;
    letter-spacing:.6px;
}

.container{
    width:min(900px,96%);
    margin:20px auto;
}

.panel{
    background:#fff;
    border-radius:10px;
    padding:16px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.game-loader{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.game-loader input{
    width:110px;
    padding:9px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

.game-loader input:focus{
    outline:2px solid rgba(255,107,0,.25);
    border-color:#ff6b00;
}

.game-loader button{
    padding:9px 14px;
    border:0;
    border-radius:5px;
    background:#ff6b00;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.game-loader button:hover{
    background:#e65f00;
}

.game-loader button:disabled{
    background:#bbb;
    cursor:wait;
}

#statusMessage{
    margin-top:12px;
    padding:9px;
    border-radius:5px;
    background:#f3f3f3;
    color:#555;
    font-size:12px;
}

#statusMessage.success{
    background:#e8f5e9;
    color:#2e7d32;
}

#statusMessage.error{
    background:#ffebee;
    color:#c62828;
}

.controller-content{
    display:none;
    margin-top:18px;
}

.game-title{
    text-align:center;
    font-size:17px;
    margin-bottom:14px;
}

.scoreboard{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    align-items:center;
    gap:18px;
    padding:18px;
    border:1px solid #e6e6e6;
    border-radius:10px;
    background:#fafafa;
    text-align:center;
}

.team{
    min-width:0;
}

.team-name{
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    font-weight:900;
    line-height:1.15;
    text-transform:uppercase;
    overflow-wrap:anywhere;
}

.team-label{
    margin-top:5px;
    color:#777;
    font-size:10px;
    font-weight:900;
    letter-spacing:.7px;
}

.team-score{
    margin-top:8px;
    color:#ff6b00;
    font-size:64px;
    font-weight:900;
    line-height:1;
}

.vs{
    color:#777;
    font-size:22px;
    font-weight:900;
}

.game-info{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:14px;
}

.info-card{
    padding:13px;
    border:1px solid #e5e5e5;
    border-radius:8px;
    background:#fff;
    text-align:center;
}

.info-label{
    color:#777;
    font-size:9px;
    font-weight:900;
    letter-spacing:.8px;
}

.info-value{
    margin-top:5px;
    color:#222;
    font-size:17px;
    font-weight:900;
    text-transform:uppercase;
}

.info-value.live{
    color:#16803c;
}

.info-value.halftime{
    color:#d96516;
}

.info-value.final{
    color:#c62828;
}

.next-section{
    margin-top:16px;
    padding:14px;
    border:1px dashed #ccc;
    border-radius:8px;
    background:#fafafa;
    color:#777;
    font-size:12px;
    font-weight:bold;
    text-align:center;
}

@media(max-width:600px){

    header{
        padding:12px 4%;
    }

    .logo{
        font-size:17px;
    }

    .controller-title{
        font-size:11px;
    }

    .scoreboard{
        grid-template-columns:1fr;
        gap:10px;
    }

    .vs{
        font-size:15px;
    }

    .team-name{
        min-height:auto;
        font-size:16px;
    }

    .team-score{
        font-size:52px;
    }

    .game-info{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>

    <a class="logo" href="index.html">
        HOOP <span>HUB PH</span>
    </a>

    <strong class="controller-title">
        CLOCK CONTROLLER
    </strong>

</header>

<div class="container">

    <div class="panel">

        <div class="game-loader">

            <label for="gameIdInput">
                <strong>Game ID:</strong>
            </label>

            <input
                id="gameIdInput"
                type="number"
                min="1"
                inputmode="numeric"
                placeholder="Enter ID"
            >

            <button
                id="loadGameButton"
                type="button"
            >
                LOAD GAME
            </button>

        </div>

        <div id="statusMessage">
            Enter a Game ID to begin.
        </div>

        <div
            id="controllerContent"
            class="controller-content"
        >

            <h2
                id="gameTitle"
                class="game-title"
            >
                Game
            </h2>

            <div class="scoreboard">

                <div class="team">

                    <div
                        id="homeTeamName"
                        class="team-name"
                    >
                        Home Team
                    </div>

                    <div class="team-label">
                        HOME
                    </div>

                    <div
                        id="homeScore"
                        class="team-score"
                    >
                        0
                    </div>

                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team">

                    <div
                        id="awayTeamName"
                        class="team-name"
                    >
                        Away Team
                    </div>

                    <div class="team-label">
                        AWAY
                    </div>

                    <div
                        id="awayScore"
                        class="team-score"
                    >
                        0
                    </div>

                </div>

            </div>

            <div class="game-info">

                <div class="info-card">

                    <div class="info-label">
                        CURRENT PERIOD
                    </div>

                    <div
                        id="gamePeriod"
                        class="info-value"
                    >
                        —
                    </div>

                </div>

                <div class="info-card">

                    <div class="info-label">
                        GAME STATUS
                    </div>

                    <div
                        id="gameStatus"
                        class="info-value"
                    >
                        —
                    </div>

                </div>

            </div>

            <div class="next-section">
                Game-clock, shot-clock, quarter and game-status controls will be added in the next step.
            </div>

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

let currentGame = null;

const gameIdInput =
    document.getElementById("gameIdInput");

const loadGameButton =
    document.getElementById("loadGameButton");

const statusMessage =
    document.getElementById("statusMessage");

const controllerContent =
    document.getElementById("controllerContent");

const gameTitle =
    document.getElementById("gameTitle");

const homeTeamName =
    document.getElementById("homeTeamName");

const awayTeamName =
    document.getElementById("awayTeamName");

const homeScore =
    document.getElementById("homeScore");

const awayScore =
    document.getElementById("awayScore");

const gamePeriod =
    document.getElementById("gamePeriod");

const gameStatus =
    document.getElementById("gameStatus");


function showStatus(
    message,
    type = ""
){

    statusMessage.textContent = message;

    statusMessage.classList.remove(
        "success",
        "error"
    );

    if(type){
        statusMessage.classList.add(type);
    }
}


function safeText(
    value,
    fallback = "—"
){

    const text =
        String(value ?? "").trim();

    return text || fallback;
}


function getHomeTeamName(game){

    return safeText(
        game.home_team ||
        game.home_team_name,
        "Home Team"
    );
}


function getAwayTeamName(game){

    return safeText(
        game.away_team ||
        game.away_team_name,
        "Away Team"
    );
}


function formatPeriod(period){

    const value =
        safeText(period, "Not Set");

    const normalized =
        value.toLowerCase()
            .replace(/\s+/g, "")
            .replace(/_/g, "");

    const periodLabels = {

        "1":"1st Quarter",
        "q1":"1st Quarter",
        "1q":"1st Quarter",
        "1st":"1st Quarter",
        "1stquarter":"1st Quarter",

        "2":"2nd Quarter",
        "q2":"2nd Quarter",
        "2q":"2nd Quarter",
        "2nd":"2nd Quarter",
        "2ndquarter":"2nd Quarter",

        "3":"3rd Quarter",
        "q3":"3rd Quarter",
        "3q":"3rd Quarter",
        "3rd":"3rd Quarter",
        "3rdquarter":"3rd Quarter",

        "4":"4th Quarter",
        "q4":"4th Quarter",
        "4q":"4th Quarter",
        "4th":"4th Quarter",
        "4thquarter":"4th Quarter",

        "halftime":"Halftime",
        "half":"Halftime",

        "ot":"Overtime",
        "overtime":"Overtime"
    };

    return periodLabels[normalized] || value;
}


function applyStatusClass(status){

    gameStatus.classList.remove(
        "live",
        "halftime",
        "final"
    );

    const normalized =
        String(status || "")
            .trim()
            .toLowerCase();

    if(
        normalized === "live" ||
        normalized === "in progress" ||
        normalized === "in_progress"
    ){
        gameStatus.classList.add("live");
    }

    if(
        normalized === "halftime" ||
        normalized === "half"
    ){
        gameStatus.classList.add("halftime");
    }

    if(
        normalized === "final" ||
        normalized === "finalized" ||
        normalized === "completed"
    ){
        gameStatus.classList.add("final");
    }
}


function renderGameInformation(){

    if(!currentGame){
        return;
    }

    gameTitle.textContent =
        "Game #" + currentGame.id;

    homeTeamName.textContent =
        getHomeTeamName(currentGame);

    awayTeamName.textContent =
        getAwayTeamName(currentGame);

    homeScore.textContent =
        Number(currentGame.home_score || 0);

    awayScore.textContent =
        Number(currentGame.away_score || 0);

    gamePeriod.textContent =
        formatPeriod(currentGame.period);

    const status =
        safeText(
            currentGame.status,
            "Not Set"
        );

    gameStatus.textContent =
        status;

    applyStatusClass(status);
}


async function loadGame(){

    const gameId =
        Number(gameIdInput.value);

    if(
        !Number.isInteger(gameId) ||
        gameId <= 0
    ){

        showStatus(
            "Enter a valid Game ID.",
            "error"
        );

        return;
    }

    loadGameButton.disabled = true;

    loadGameButton.textContent =
        "LOADING...";

    try{

        const { data, error } =
            await supabaseClient
                .from("games")
                .select("*")
                .eq("id", gameId)
                .single();

        if(error){
            throw error;
        }

        currentGame = data;

        renderGameInformation();

        controllerContent.style.display =
            "block";

        showStatus(
            `Game ${currentGame.id} loaded successfully.`,
            "success"
        );

    }
    catch(error){

        console.error(
            "Unable to load game:",
            error
        );

        currentGame = null;

        controllerContent.style.display =
            "none";

        showStatus(
            "Unable to load the game: " +
            (
                error?.message ||
                "Unknown error"
            ),
            "error"
        );

    }
    finally{

        loadGameButton.disabled = false;

        loadGameButton.textContent =
            "LOAD GAME";
    }
}


loadGameButton.addEventListener(
    "click",
    loadGame
);


gameIdInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            loadGame();
        }
    }
);

</script>

</body>

</html>
