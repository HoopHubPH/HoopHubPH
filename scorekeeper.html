<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scorekeeper | Hoop Hub PH</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================
   BODY
========================================= */

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}


/* =========================================
   HEADER
========================================= */

header {
    background: #111;
    color: white;

    padding: 10px 2%;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    text-decoration: none;

    font-size: 18px;
    font-weight: bold;
}

.logo span {
    color: #ff6b00;
}

nav a {
    color: white;
    text-decoration: none;

    margin-left: 12px;

    font-size: 12px;
    font-weight: bold;
}

nav a:hover {
    color: #ff6b00;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {

    width: 100%;
    max-width: 100%;

    margin: 10px auto;

    padding: 0 10px;
}


/* =========================================
   GAME SELECTOR
========================================= */

.game-selector {

    background: white;

    padding: 10px 15px;

    border-radius: 6px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.06);

    margin-bottom: 10px;

    display: flex;

    align-items: center;

    gap: 10px;
}

.game-selector h2 {

    font-size: 14px;

    white-space: nowrap;
}

.game-selector input {

    width: 100px;

    padding: 5px 8px;

    border: 1px solid #ddd;

    border-radius: 4px;

    font-size: 13px;
}

.load-button {

    background: #ff6b00;

    color: white;

    border: none;

    padding: 6px 12px;

    border-radius: 4px;

    font-weight: bold;

    cursor: pointer;

    font-size: 12px;
}

.load-button:hover {

    background: #111;
}


/* =========================================
   STATUS
========================================= */

#statusMessage {

    text-align: center;

    padding: 7px;

    background: #e8f5e9;

    color: #2e7d32;

    border-radius: 5px;

    margin-bottom: 10px;

    display: none;

    font-size: 12px;
}


/* =========================================
   SCOREBOARD
========================================= */

.scoreboard {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 10px;
}

.team-control {

    background: white;

    padding: 10px;

    border-radius: 6px;

    text-align: center;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.06);
}

.team-control h2 {

    font-size: 16px;

    margin-bottom: 2px;
}

.score {

    font-size: 34px;

    font-weight: bold;

    color: #ff6b00;

    margin-bottom: 5px;
}

.button-row {

    display: flex;

    justify-content: center;

    gap: 4px;
}

.score-button {

    background: #111;

    color: white;

    border: none;

    padding: 5px 9px;

    border-radius: 4px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;
}

.score-button:hover {

    background: #ff6b00;
}


/* =========================================
   PLAYER STATS BOX
========================================= */

.controls {

    background: white;

    padding: 10px;

    border-radius: 6px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.06);

    margin-bottom: 10px;

    overflow: hidden;
}

.controls > h2 {

    font-size: 16px;

    text-align: center;

    margin-bottom: 8px;
}


/* =========================================
   HOME / AWAY COLUMNS
========================================= */

.stats-controls {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.stat-control {

    background: #fafafa;

    border: 1px solid #ddd;

    border-radius: 6px;

    overflow-x: auto;

    overflow-y: auto;

    max-height: 70vh;
}


/* =========================================
   TEAM TITLE
========================================= */

.stat-control > h2 {

    text-align: center;

    font-size: 13px;

    margin: 0;

    padding: 7px;

    background: #fafafa;

    border-bottom: 2px solid #ff6b00;

    position: sticky;

    top: 0;

    z-index: 10;
}


/* =========================================
   STATS TABLE
========================================= */

.stats-table {

    width: 100%;

    min-width: 1050px;

    border-collapse: collapse;

    table-layout: fixed;
}


/* =========================================
   TABLE HEADER
========================================= */

.stats-table thead th {

    background: #111;

    color: white;

    padding: 5px 2px;

    font-size: 8px;

    text-align: center;

    white-space: nowrap;

    position: sticky;

    top: 0;

    z-index: 5;
}


/* Orange header accent */

.stats-table thead th:first-child {

    border-left: 3px solid #ff6b00;
}


/* =========================================
   PLAYER ROW
========================================= */

.player-row {

    background: white;

    border-bottom: 1px solid #ddd;
}

.player-row:hover {

    background: #fff8f5;
}


/* =========================================
   TABLE CELLS
========================================= */

.stats-table td {

    padding: 3px 2px;

    text-align: center;

    vertical-align: middle;

    font-size: 10px;

    border-right: 1px solid #eee;
}


/* =========================================
   JERSEY
========================================= */

.jersey-cell {

    width: 35px;

    font-weight: bold;
}

.jersey-number {

    display: inline-block;

    background: #111;

    color: white;

    padding: 3px 5px;

    border-radius: 3px;

    font-size: 9px;
}


/* =========================================
   PLAYER NAME
========================================= */

.player-cell {

    width: 150px;

    text-align: left !important;

    font-weight: bold;

    padding-left: 6px !important;
}

.player-name {

    display: block;

    font-size: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.player-position {

    display: block;

    color: #777;

    font-size: 8px;

    font-weight: normal;
}


/* =========================================
   STAT CELL
========================================= */

.stat-cell {

    width: 55px;
}


/* =========================================
   STAT VALUE
========================================= */

.stat-value {

    font-size: 11px;

    font-weight: bold;

    color: #ff6b00;

    margin-bottom: 2px;
}


/* =========================================
   PLUS MINUS BUTTONS
========================================= */

.stat-buttons {

    display: flex;

    justify-content: center;

    gap: 2px;
}

.stat-btn {

    width: 18px;

    height: 16px;

    border: none;

    border-radius: 3px;

    background: #111;

    color: white;

    font-size: 10px;

    font-weight: bold;

    cursor: pointer;

    padding: 0;

    line-height: 16px;
}

.stat-btn:hover {

    background: #ff6b00;
}

.stat-btn.minus {

    background: #888;
}

.stat-btn.minus:hover {

    background: #333;
}


/* =========================================
   SHOOTING CELL
========================================= */

.shooting-cell {

    width: 75px;
}

.shooting-value {

    font-size: 10px;

    font-weight: bold;

    color: #222;

    margin-bottom: 2px;
}

.shooting-percent {

    font-size: 8px;

    color: #ff6b00;

    font-weight: bold;

    margin-top: 2px;
}


/* =========================================
   SHOOTING BUTTONS
========================================= */

.shooting-buttons {

    display: flex;

    justify-content: center;

    gap: 2px;

    margin-bottom: 2px;
}

.shooting-btn {

    height: 16px;

    min-width: 22px;

    border: none;

    border-radius: 3px;

    background: #111;

    color: white;

    font-size: 8px;

    font-weight: bold;

    cursor: pointer;

    padding: 0 3px;
}

.shooting-btn:hover {

    background: #ff6b00;
}

.shooting-btn.attempt {

    background: #ff6b00;
}

.shooting-btn.minus {

    background: #888;
}

.shooting-btn.minus:hover {

    background: #333;
}


/* =========================================
   PLUS MINUS PLAYER +/- CELL
========================================= */

.plus-minus-cell {

    width: 55px;
}

.plus-minus-value {

    font-size: 11px;

    font-weight: bold;

    color: #ff6b00;

    margin-bottom: 2px;
}


/* =========================================
   NO PLAYERS
========================================= */

.no-players {

    text-align: center;

    color: #777;

    padding: 15px;

    font-size: 11px;
}


/* =========================================
   GAME FOOTER
========================================= */

.game-footer-controls {

    display: flex;

    gap: 10px;

    justify-content: space-around;

    background: white;

    padding: 8px;

    border-radius: 6px;

    font-size: 11px;
}

.control-button {

    background: #ff6b00;

    color: white;

    border: none;

    padding: 5px 9px;

    border-radius: 4px;

    font-weight: bold;

    cursor: pointer;

    font-size: 10px;
}

.control-button:hover {

    background: #111;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    header {

        flex-direction: column;

        gap: 8px;
    }

    nav a {

        margin: 0 5px;

        font-size: 10px;
    }

    .scoreboard {

        grid-template-columns: 1fr 1fr;
    }

    .stats-controls {

        grid-template-columns: 1fr;
    }

    .stat-control {

        max-height: 500px;
    }

    .game-footer-controls {

        flex-direction: column;

        align-items: center;
    }

}

</style>

</head>

<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   CURRENT GAME
========================================= */

let currentGame = null;


/* =========================================
   PLAYER DATA
========================================= */

let playerStatsMap = {};

let playerDataMap = {};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str) {

if (!str)
return "";

return String(str)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
   CALCULATE PERCENTAGE
========================================= */

function calculatePercentage(
made,
attempted
) {

if (
!attempted ||
attempted === 0
) {

return "0%";

}

return Math.round(
(made / attempted) * 100
) + "%";

}


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(
message
) {

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.style.display =
"block";

setTimeout(

() => {

el.style.display =
"none";

},

3000

);

}


/* =========================================
   LOAD GAME
========================================= */

async function loadGame() {

const gameId =
Number(
document.getElementById(
"gameId"
).value
);


if (!gameId) {

showStatus(
"Please enter a valid Game ID."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.select("*")

.eq(
"id",
gameId
)

.single();


if (error) {

console.error(error);

showStatus(
"Error loading game: " +
error.message
);

return;

}


currentGame =
data;


document.getElementById(
"homeTeam"
).textContent =
data.home_team ||
"Home Team";


document.getElementById(
"awayTeam"
).textContent =
data.away_team ||
"Away Team";


playerStatsMap = {};

playerDataMap = {};


refreshDisplay();


await loadTeamPlayers();


showStatus(
"Game loaded successfully."
);

}


/* =========================================
   REFRESH SCORE
========================================= */

function refreshDisplay() {

if (!currentGame)
return;


document.getElementById(
"homeScore"
).textContent =
currentGame.home_score ?? 0;


document.getElementById(
"awayScore"
).textContent =
currentGame.away_score ?? 0;

}


/* =========================================
   UPDATE SCORE
========================================= */

async function updateScore(
team,
amount
) {

if (!currentGame) {

showStatus(
"Please load a game first."
);

return;

}


const column =
team === "home"
? "home_score"
: "away_score";


const newScore = Math.max(

0,

Number(
currentGame[column] || 0
) + amount

);


const {

data,

error

} = await supabaseClient

.from("games")

.update({

[column]:
newScore

})

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

console.error(error);

showStatus(
"Error updating score: " +
error.message
);

return;

}


currentGame =
data;


refreshDisplay();

}


/* =========================================
   UPDATE GAME
========================================= */

async function updateGame(
changes
) {

if (!currentGame) {

showStatus(
"Load a game first."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.update(changes)

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

console.error(error);

showStatus(
"Error updating game."
);

return;

}


currentGame =
data;


refreshDisplay();


showStatus(
"Game updated."
);

}


/* =========================================
   LOAD TEAMS
========================================= */

async function loadTeamPlayers() {

if (!currentGame)
return;


const homeName =
String(
currentGame.home_team || ""
).trim();


const awayName =
String(
currentGame.away_team || ""
).trim();


/* HOME */

const {

data: homeTeam,

error: homeError

} = await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
homeName
)

.maybeSingle();


if (homeError) {

console.error(
"Home team error:",
homeError
);

}


if (homeTeam) {

document.getElementById(
"homePlayersTitle"
).textContent =
homeTeam.name +
" Players";


await loadPlayersForTeam(

homeTeam.id,

"homePlayersList"

);

}

else {

document.getElementById(
"homePlayersList"
).innerHTML =

`<div class="no-players">

Team not found:
${escapeHTML(homeName)}

</div>`;

}


/* AWAY */

const {

data: awayTeam,

error: awayError

} = await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
awayName
)

.maybeSingle();


if (awayError) {

console.error(
"Away team error:",
awayError
);

}


if (awayTeam) {

document.getElementById(
"awayPlayersTitle"
).textContent =
awayTeam.name +
" Players";


await loadPlayersForTeam(

awayTeam.id,

"awayPlayersList"

);

}

else {

document.getElementById(
"awayPlayersList"
).innerHTML =

`<div class="no-players">

Team not found:
${escapeHTML(awayName)}

</div>`;

}

}


/* =========================================
   LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(

teamId,

containerId

) {

const container =
document.getElementById(
containerId
);


container.innerHTML =

`<div class="no-players">

Loading players...

</div>`;


const {

data,

error

} = await supabaseClient

.from("players")

.select("*")

.eq(
"team_id",
teamId
)

.order(

"jersey_number",

{

ascending:
true

}

);


if (error) {

console.error(error);

container.innerHTML =

`<div class="no-players">

Unable to load players.

</div>`;

return;

}


if (
!data ||
data.length === 0
) {

container.innerHTML =

`<div class="no-players">

No players assigned.

</div>`;

return;

}


container.innerHTML = "";


const table =
createStatsTable();


container.appendChild(
table
);


const tbody =
table.querySelector(
"tbody"
);


for (
const player
of data
) {

playerDataMap[
player.id
] =
player;


await createPlayerRow(

player,

tbody

);

}

}


/* =========================================
   CREATE TABLE
========================================= */

function createStatsTable() {

const table =
document.createElement(
"table"
);

table.className =
"stats-table";


table.innerHTML = `

<thead>

<tr>

<th>#</th>

<th>PLAYER</th>

<th>MIN</th>

<th>PTS</th>

<th>OREB</th>

<th>DREB</th>

<th>AST</th>

<th>STL</th>

<th>BLK</th>

<th>TO</th>

<th>PF</th>

<th>2PT</th>

<th>3PT</th>

<th>FT</th>

<th>+/-</th>

</tr>

</thead>

<tbody></tbody>

`;


return table;

}


/* =========================================
   DEFAULT STATS
========================================= */

function getDefaultStats() {

return {

minutes_played: 0,

points: 0,

offensive_rebounds: 0,

defensive_rebounds: 0,

assists: 0,

steals: 0,

blocks: 0,

turnovers: 0,

fouls: 0,

two_pt_made: 0,

two_pt_attempted: 0,

three_pt_made: 0,

three_pt_attempted: 0,

ft_made: 0,

ft_attempted: 0,

plus_minus: 0

};

}


/* =========================================
   GET PLAYER GAME STATS
========================================= */

async function getPlayerGameStats(
playerId
) {

const defaults =
getDefaultStats();


if (!currentGame)
return defaults;


const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.select("*")

.eq(
"game_id",
currentGame.id
)

.eq(
"player_id",
playerId
)

.maybeSingle();


if (error) {

console.error(
"Stats loading error:",
error
);

}


playerStatsMap[
playerId
] = {

...defaults,

...(data || {})

};


return playerStatsMap[
playerId
];

}


/* =========================================
   UPDATE PLAYER STAT
========================================= */

async function updatePlayerStat(

playerId,

statKey,

amount

) {

if (!currentGame) {

showStatus(
"Please load a game first."
);

return;

}


let stats =
await getPlayerGameStats(
playerId
);


let currentValue =
Number(
stats[statKey] || 0
);


let newValue =

Math.max(

0,

currentValue +
amount

);


/* Prevent made shots from
   exceeding attempts */

if (
statKey === "two_pt_made" &&
newValue >
Number(
stats.two_pt_attempted || 0
)
) {

newValue =
Number(
stats.two_pt_attempted || 0
);

}


if (
statKey === "three_pt_made" &&
newValue >
Number(
stats.three_pt_attempted || 0
)
) {

newValue =
Number(
stats.three_pt_attempted || 0
);

}


if (
statKey === "ft_made" &&
newValue >
Number(
stats.ft_attempted || 0
)
) {

newValue =
Number(
stats.ft_attempted || 0
);

}


/* Prevent attempts
   below made shots */

if (
statKey === "two_pt_attempted" &&
newValue <
Number(
stats.two_pt_made || 0
)
) {

newValue =
Number(
stats.two_pt_made || 0
);

}


if (
statKey === "three_pt_attempted" &&
newValue <
Number(
stats.three_pt_made || 0
)
) {

newValue =
Number(
stats.three_pt_made || 0
);

}


if (
statKey === "ft_attempted" &&
newValue <
Number(
stats.ft_made || 0
)
) {

newValue =
Number(
stats.ft_made || 0
);

}


/* =========================================
   SPECIAL POINTS LOGIC
========================================= */

/*
   When made shots change,
   automatically update POINTS.

   2PT = 2 points
   3PT = 3 points
   FT = 1 point
*/

let newPoints =
Number(
stats.points || 0
);


if (
statKey === "two_pt_made"
) {

newPoints =
Math.max(

0,

newPoints +
(amount * 2)

);

}


if (
statKey === "three_pt_made"
) {

newPoints =
Math.max(

0,

newPoints +
(amount * 3)

);

}


if (
statKey === "ft_made"
) {

newPoints =
Math.max(

0,

newPoints +
amount

);

}


/* =========================================
   BUILD UPDATE
========================================= */

const updateObj = {

player_id:
playerId,

game_id:
currentGame.id

};


updateObj[
statKey
] =
newValue;


/* Update points automatically
   when shooting stats change */

if (

statKey ===
"two_pt_made" ||

statKey ===
"three_pt_made" ||

statKey ===
"ft_made"

) {

updateObj.points =
newPoints;

}


/* =========================================
   SAVE
========================================= */

const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.upsert(

updateObj,

{

onConflict:
"player_id,game_id"

}

)

.select()

.single();


if (error) {

console.error(
"Player stats update error:",
error
);

showStatus(

"Unable to update player stats: " +
error.message

);

return;

}


/* =========================================
   UPDATE LOCAL DATA
========================================= */

playerStatsMap[
playerId
] = {

...stats,

...data

};


/* =========================================
   REFRESH ROW
========================================= */

const player =
playerDataMap[
playerId
];


if (!player)
return;


const oldRow =
document.getElementById(

`player-row-${playerId}`

);


if (oldRow) {

const parent =
oldRow.parentElement;

oldRow.remove();

await createPlayerRow(

player,

parent

);

}

}

   CREATE STAT CONTROL
========================================= */

label,

value,

playerId,

statKey

) {

return `

<div class="stat-value">

${value || 0}

</div>

<div class="stat-buttons">

<button

class="stat-btn"

onclick="updatePlayerStat(

'${playerId}',

'${statKey}',

1

)">

+

</button>

<button

class="stat-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'${statKey}',

-1

)">

−

</button>

</div>

`;

}


/* =========================================

========================================= */

made,

attempted,

playerId,

madeKey,

attemptedKey

) {

return `

${made || 0}/${attempted || 0}

</div>


<div class="shooting-buttons">

<button

class="shooting-btn"

onclick="updatePlayerStat(

'${playerId}',

'${madeKey}',

1

)">

M+

</button>


<button

class="shooting-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'${madeKey}',

-1

)">

M−

</button>

</div>


<div class="shooting-buttons">

<button

class="shooting-btn attempt"

onclick="updatePlayerStat(

'${playerId}',

'${attemptedKey}',

1

)">

A+

</button>


<button

class="shooting-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'${attemptedKey}',

-1

)">

A−

</button>

</div>


<div class="shooting-percent">

${calculatePercentage(

made,

attempted

)}

</div>

`;

loadGame();
