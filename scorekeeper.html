async function getPlayerGameStats(
playerId
){

const defaults = {

points:0,

minutes_played:0,

offensive_rebounds:0,

defensive_rebounds:0,

rebounds:0,

assists:0,

steals:0,

blocks:0,

turnovers:0,

fouls:0,

two_pt_made:0,

two_pt_attempted:0,

three_pt_made:0,

three_pt_attempted:0,

ft_made:0,

ft_attempted:0,

plus_minus:0,

on_court:false

};


if(
playerStatsMap[playerId]
){

return playerStatsMap[playerId];

}


if(!currentGame)
return defaults;


const {
data,
error
} = await supabaseClient
.from("player_game_stats")
.select("*")
.eq(
"game_id",
currentGame.id
)
.eq(
"player_id",
playerId
)
.maybeSingle();


if(error){

console.error(
"Stats error:",
error
);

}


playerStatsMap[playerId] = {

...defaults,

...(data || {})

};


return playerStatsMap[playerId];

}


/* ================================
   SAVE PLAYER STAT
================================ */

async function saveStatDirect(
playerId,
statKey,
value
){

if(!currentGame)
return;


const stats =
await getPlayerGameStats(
playerId
);


const updateObj = {

player_id:
playerId,

game_id:
currentGame.id

};


/*
ON COURT
*/

if(
statKey === "on_court"
){

updateObj[
statKey
] =
Boolean(value);

}


/*
MINUTES PLAYED

Supabase column is INTEGER.

Only whole seconds are saved.
*/

else if(
statKey === "minutes_played"
){

updateObj[
statKey
] =
Math.max(
0,
Math.floor(
Number(value || 0)
)
);

}


/*
ALL OTHER PLAYER STATS

Save as whole numbers.
*/

else{

updateObj[
statKey
] =
Math.max(
0,
Math.floor(
Number(value || 0)
)
);

}


/*
AUTOMATICALLY CALCULATE TOTAL REBOUNDS
*/

if(

statKey ===
"offensive_rebounds"

||

statKey ===
"defensive_rebounds"

){

const oreb =

statKey ===
"offensive_rebounds"

?

Number(value)

:

Number(
stats.offensive_rebounds || 0
);


const dreb =

statKey ===
"defensive_rebounds"

?

Number(value)

:

Number(
stats.defensive_rebounds || 0
);


updateObj.rebounds =

Math.max(
0,
Math.floor(
oreb + dreb
)
);

}


/*
SAVE TO SUPABASE
*/

const {
data,
error
} = await supabaseClient
.from("player_game_stats")
.upsert(
updateObj,
{
onConflict:
"player_id,game_id"
}
)
.select()
.single();


if(error){

console.error(
"Player stats save error:",
error
);

showStatus(
"Unable to save player stats: "+
error.message
);

return;

}


/*
UPDATE LOCAL PLAYER STATS
*/

playerStatsMap[playerId] = {

...stats,

...data

};

}

/* ================================
   MINUTES FORMAT
================================ */

function formatMinutes(
seconds
){

const totalSeconds =
Math.max(
0,
Math.floor(
Number(seconds || 0)
)
);


const minutes =
Math.floor(
totalSeconds / 60
);


const secs =
totalSeconds % 60;


return (

minutes

+

":"

+

String(secs)
.padStart(
2,
"0"
)

);

}


/* =====================================================
   PLAYER MINUTES SYNCHRONIZATION
   =====================================================

   FIXED:

   Supabase minutes_played is INTEGER.

   We never send decimal values such as 0.245.

   Fractional elapsed seconds are stored locally
   per player and converted into whole seconds
   only when a complete second has accumulated.

===================================================== */

async function syncPlayerMinutes(){

if(!currentGame)
return;


if(!clockRunning)
return;


if(
!playerMinutesLastSync
){

playerMinutesLastSync =
Date.now();

return;

}


const now =
Date.now();


const elapsedSeconds =

Math.max(

0,

(
now -
playerMinutesLastSync
) / 1000

);


playerMinutesLastSync =
now;


if(
elapsedSeconds <= 0
)
return;


const activePlayers =

Object.keys(
playerOnCourt
).filter(

playerId =>

playerOnCourt[playerId] === true

);


if(
!activePlayers.length
)
return;


for(
const playerId of activePlayers
){

const stats =
await getPlayerGameStats(
playerId
);


const oldMinutes =

Number(
stats.minutes_played || 0
);


/*
Keep fractional seconds locally.

Example:

0.245
+
0.250
=
0.495

No database update yet.

Then:

0.495
+
0.600
=
1.095

Save 1 second to Supabase.

Keep 0.095 locally.
*/

const previousFraction =

Number(
playerMinutesFractionMap[playerId] || 0
);


const totalElapsed =

previousFraction +
elapsedSeconds;


const wholeSeconds =

Math.floor(
totalElapsed
);


const remainingFraction =

totalElapsed -
wholeSeconds;


playerMinutesFractionMap[playerId] =

remainingFraction;


/*
Only save to Supabase when at least
one complete second has accumulated.
*/

if(
wholeSeconds > 0
){

const newMinutes =

oldMinutes +
wholeSeconds;


await saveStatDirect(

playerId,

"minutes_played",

newMinutes

);

}


await refreshPlayerRow(
playerId
);

}

}


/* =====================================================
   RESET MINUTE SYNC
===================================================== */

function resetPlayerMinuteSync(){

playerMinutesLastSync =
Date.now();

}


/* ================================
   SUBSTITUTIONS
================================ */

async function toggleSubstitution(
playerId
){

if(!currentGame)
return;


const team =
playerTeamMap[playerId];


const currentlyOn =
playerOnCourt[playerId] === true;


/*
Save all minutes accumulated before
changing the player's court status.
*/

if(
clockRunning
){

await syncPlayerMinutes();

}


if(currentlyOn){

playerOnCourt[playerId] =
false;


await saveStatDirect(
playerId,
"on_court",
false
);


if(
playerCourtOrder[team]
){

playerCourtOrder[team] =

playerCourtOrder[team].filter(
id => id !== playerId
);

}


await refreshPlayerRow(
playerId
);


resetPlayerMinuteSync();


showStatus(
"Player SUB OUT."
);


return;

}


const activePlayers =

Object.keys(
playerOnCourt
).filter(

id =>

playerOnCourt[id] === true

&&

playerTeamMap[id] === team

).length;


if(
activePlayers >= 5
){

showStatus(
"Maximum 5 players are on court. Sub out a player first."
);

return;

}


playerOnCourt[playerId] =
true;


await saveStatDirect(
playerId,
"on_court",
true
);


if(
!playerCourtOrder[team]
){

playerCourtOrder[team] = [];

}


playerCourtOrder[team].push(
playerId
);


await refreshPlayerRow(
playerId
);


/*
Player starts accumulating minutes
from this exact moment.
*/

resetPlayerMinuteSync();


showStatus(
"Player SUB IN."
);

}

async function saveClockState(){

const updateData = {

clock_seconds:
Math.max(
0,
Math.floor(
Number(clockSeconds || 0)
)
),

clock_running:
clockRunning,

clock_end_time:
clockRunning && clockEndTime
?
new Date(
clockEndTime
).toISOString()
:
null

};


const {
data,
error
} = await supabaseClient
.from("games")
.update(updateData)
.eq(
"id",
currentGame.id
)
.select("*")
.single();


if(error){

console.error(
"Clock save error:",
error
);

return;

}


if(data){

currentGame =
data;

}

}


/* ================================
   LOAD CLOCK
================================ */

async function loadPersistedClock(){

if(!currentGame)
return;


const {
data,
error
} = await supabaseClient
.from("games")
.select(
"clock_seconds,clock_running,clock_end_time"
)
.eq(
"id",
currentGame.id
)
.single();


if(error){

console.error(
"Clock load error:",
error
);

clockSeconds =
600;

clockRunning =
false;

clockEndTime =
null;

updateClockDisplay();

resetPlayerMinuteSync();

return;

}


if(
data.clock_seconds === null
||
data.clock_seconds === undefined
){

clockSeconds =
600;

clockRunning =
false;

clockEndTime =
null;

updateClockDisplay();

resetPlayerMinuteSync();

return;

}


clockSeconds =
Math.max(
0,
Number(
data.clock_seconds
)
);


clockRunning =
data.clock_running === true;


clockEndTime =
data.clock_end_time
?
new Date(
data.clock_end_time
).getTime()
:
null;


if(
clockRunning &&
clockEndTime
){

clockSeconds =
Math.max(

0,

Math.ceil(

(
clockEndTime -
Date.now()
) / 1000

)

);

}


if(
clockSeconds <= 0
){

clockSeconds =
0;

clockRunning =
false;

clockEndTime =
null;

updateClockDisplay();

await saveClockState();

resetPlayerMinuteSync();

return;

}


updateClockDisplay();


/*
Reset the player minute timer AFTER
the persisted clock has been restored.
*/

resetPlayerMinuteSync();


if(
clockRunning
){

startClockInternal();

}

}

   START CLOCK
================================ */

async function startClock(){

if(
clockRunning
)
return;


if(!currentGame){

showStatus(

);

return;

}


if(
clockSeconds <= 0
){

showStatus(

);

return;

}


/*
Reset player minute synchronization
BEFORE starting the clock.
*/

resetPlayerMinuteSync();


clockEndTime =

Date.now()

+

(
clockSeconds *
1000
);


clockRunning =
true;


await saveClockState();


startClockInternal();

}


/* ================================
   INTERNAL CLOCK
================================ */

function startClockInternal(){

if(
clockInterval
){

clearInterval(
clockInterval
);

}


resetPlayerMinuteSync();


clockInterval =

setInterval(

async()=>{

if(
!clockRunning ||
!clockEndTime
){

clearInterval(
clockInterval
);

clockInterval =
null;

return;

}


/*
FIRST:
Synchronize player minutes.
*/

await syncPlayerMinutes();


/*
SECOND:
Calculate remaining game time.
*/

clockSeconds =

Math.max(

0,

Math.ceil(

(
clockEndTime -
Date.now()
) / 1000

)

);


updateClockDisplay();


/*
CLOCK FINISHED
*/

if(
clockSeconds <= 0
){

/*
Give players their final seconds
before stopping the clock.
*/

await syncPlayerMinutes();


clockSeconds =
0;

clockRunning =
false;

clockEndTime =
null;

clearInterval(
clockInterval
);

clockInterval =
null;

updateClockDisplay();

await saveClockState();

resetPlayerMinuteSync();

return;

}

},

250

);

}


/* ================================
   PAUSE CLOCK
================================ */

async function pauseClock(){

if(!currentGame)
return;


if(
!clockRunning
)
return;


/*
Save all player minutes accumulated
since the last synchronization.
*/

await syncPlayerMinutes();


if(
clockEndTime
){

clockSeconds =

Math.max(

0,

Math.ceil(

(
clockEndTime -
Date.now()
) / 1000

)

);

}


clockRunning =
false;


clockEndTime =
null;


if(
clockInterval
){

clearInterval(
clockInterval
);

null;

}

resetPlayerMinuteSync();


await saveClockState();

}


/* ================================
   RESET CLOCK
================================ */

async function resetClock(){

if(!currentGame)
return;


/*
If the clock is running,
save all player minutes first.
*/

if(
clockRunning
){

await syncPlayerMinutes();

}


clockRunning =
false;


clockEndTime =
null;


if(
clockInterval
){

clearInterval(
clockInterval
);

clockInterval =
null;

}


clockSeconds =
600;


updateClockDisplay();


resetPlayerMinuteSync();


await saveClockState();

}
