<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scorekeeper | Hoop Hub PH</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================
   BASE
========================================= */

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
    font-size: 13px;
}


/* =========================================
   HEADER
========================================= */

header {
    background: #111;
    color: white;

    padding: 8px 1.5%;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 17px;
    font-weight: bold;
    color: white;
    text-decoration: none;
}

.logo span {
    color: #ff6b00;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 12px;
    font-size: 11px;
    font-weight: bold;
}

nav a:hover {
    color: #ff6b00;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    width: 100%;
    max-width: 100%;
    padding: 8px;
    margin: 0 auto;
}


/* =========================================
   GAME SELECTOR
========================================= */

.game-selector {
    background: white;

    padding: 8px 10px;

    border-radius: 5px;

    box-shadow: 0 1px 5px rgba(0,0,0,0.06);

    margin-bottom: 8px;

    display: flex;
    align-items: center;

    gap: 7px;
}

.game-selector h2 {
    font-size: 13px;
    white-space: nowrap;
}

.game-selector input {
    width: 80px;

    padding: 5px 7px;

    border: 1px solid #ddd;

    border-radius: 4px;

    font-size: 12px;
}

.load-button {
    background: #ff6b00;
    color: white;

    border: none;

    padding: 5px 10px;

    border-radius: 4px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;
}

.load-button:hover {
    background: #111;
}


/* =========================================
   STATUS
========================================= */

#statusMessage {
    display: none;

    text-align: center;

    padding: 6px;

    margin-bottom: 8px;

    border-radius: 4px;

    background: #e8f5e9;

    color: #2e7d32;

    font-size: 11px;
}


/* =========================================
   SCOREBOARD
========================================= */

.scoreboard {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-bottom: 8px;
}

.team-control {
    background: white;

    padding: 8px;

    border-radius: 5px;

    text-align: center;

    box-shadow: 0 1px 5px rgba(0,0,0,0.06);
}

.team-control h2 {
    font-size: 15px;

    margin-bottom: 2px;
}

.score {
    font-size: 30px;

    font-weight: bold;

    color: #ff6b00;

    margin-bottom: 4px;
}

.button-row {
    display: flex;

    justify-content: center;

    gap: 3px;
}

.score-button {
    background: #111;

    color: white;

    border: none;

    padding: 4px 8px;

    border-radius: 3px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;
}

.score-button:hover {
    background: #ff6b00;
}


/* =========================================
   PLAYER STATS OUTER BOX
========================================= */

.controls {
    background: white;

    padding: 7px;

    border-radius: 5px;

    box-shadow: 0 1px 5px rgba(0,0,0,0.06);

    margin-bottom: 8px;
}

.controls > h2 {
    text-align: center;

    font-size: 14px;

    margin-bottom: 6px;
}


/* =========================================
   HOME / AWAY
========================================= */

.stats-controls {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.stat-control {
    background: #fafafa;

    border: 1px solid #ddd;

    border-radius: 5px;

    overflow: hidden;
}

.team-title {
    text-align: center;

    background: #111;

    color: white;

    padding: 5px;

    font-size: 12px;

    font-weight: bold;
}


/* =========================================
   TABLE WRAPPER
========================================= */

.table-wrapper {
    width: 100%;

    overflow: hidden;
}


/* =========================================
   PLAYER TABLE
========================================= */

.player-table {
    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;

    font-size: 10px;
}


/* =========================================
   TABLE HEADER
========================================= */

.player-table thead th {
    background: #ff6b00;

    color: white;

    font-size: 8px;

    font-weight: bold;

    padding: 4px 1px;

    text-align: center;

    white-space: nowrap;
}


/* =========================================
   COLUMN WIDTHS
========================================= */

.player-table th:nth-child(1),
.player-table td:nth-child(1) {
    width: 4%;
}

.player-table th:nth-child(2),
.player-table td:nth-child(2) {
    width: 17%;
    text-align: left;
}

.player-table th:nth-child(3),
.player-table td:nth-child(3) {
    width: 6%;
}

.player-table th:nth-child(4),
.player-table td:nth-child(4) {
    width: 6%;
}

.player-table th:nth-child(5),
.player-table td:nth-child(5),
.player-table th:nth-child(6),
.player-table td:nth-child(6),
.player-table th:nth-child(7),
.player-table td:nth-child(7),
.player-table th:nth-child(8),
.player-table td:nth-child(8),
.player-table th:nth-child(9),
.player-table td:nth-child(9),
.player-table th:nth-child(10),
.player-table td:nth-child(10),
.player-table th:nth-child(11),
.player-table td:nth-child(11) {
    width: 5%;
}

.player-table th:nth-child(12),
.player-table td:nth-child(12),
.player-table th:nth-child(13),
.player-table td:nth-child(13),
.player-table th:nth-child(14),
.player-table td:nth-child(14) {
    width: 7%;
}

.player-table th:nth-child(15),
.player-table td:nth-child(15) {
    width: 6%;
}


/* =========================================
   PLAYER ROW
========================================= */

.player-table tbody tr {
    background: white;

    border-bottom: 1px solid #eee;
}

.player-table tbody tr:hover {
    background: #fff8f5;
}

.player-table td {
    padding: 3px 1px;

    text-align: center;

    vertical-align: middle;

    overflow: hidden;
}


/* =========================================
   PLAYER NUMBER
========================================= */

.jersey-number {
    font-weight: bold;

    font-size: 10px;

    color: #ff6b00;
}


/* =========================================
   PLAYER NAME
========================================= */

.player-name-cell {
    text-align: left !important;

    font-weight: bold;

    font-size: 9px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.player-position {
    display: block;

    font-size: 7px;

    color: #777;

    font-weight: normal;
}


/* =========================================
   STAT VALUE
========================================= */

.stat-value {
    font-size: 10px;

    font-weight: bold;

    color: #222;

    line-height: 1.1;
}


/* =========================================
   BUTTONS UNDER STAT
========================================= */

.stat-action-buttons {
    display: flex;

    justify-content: center;

    gap: 1px;

    margin-top: 2px;
}

.stat-action-buttons button {
    width: 14px;

    height: 13px;

    padding: 0;

    border: none;

    border-radius: 2px;

    font-size: 9px;

    line-height: 13px;

    cursor: pointer;

    color: white;

    font-weight: bold;
}

.btn-plus {
    background: #111;
}

.btn-minus {
    background: #999;
}

.btn-plus:hover {
    background: #ff6b00;
}

.btn-minus:hover {
    background: #555;
}


/* =========================================
   SHOOTING STATS
========================================= */

.shooting-value {
    font-size: 9px;

    font-weight: bold;

    white-space: nowrap;
}

.shooting-pct {
    display: block;

    font-size: 7px;

    color: #ff6b00;

    font-weight: bold;
}


/* =========================================
   SHOOTING BUTTONS
========================================= */

.shooting-buttons {
    display: flex;

    justify-content: center;

    gap: 1px;

    margin-top: 2px;
}

.shooting-buttons button {
    width: 13px;

    height: 13px;

    padding: 0;

    border: none;

    border-radius: 2px;

    font-size: 7px;

    font-weight: bold;

    cursor: pointer;

    color: white;
}

.make-plus {
    background: #111;
}

.make-minus {
    background: #888;
}

.attempt-plus {
    background: #ff6b00;
}

.attempt-minus {
    background: #c75a10;
}


/* =========================================
   PLUS MINUS
========================================= */

.plus-minus-value {
    font-size: 10px;

    font-weight: bold;

    color: #111;
}

.plus-minus-positive {
    color: #16803c;
}

.plus-minus-negative {
    color: #d32f2f;
}


/* =========================================
   ON COURT STATUS
========================================= */

.court-status {
    display: inline-block;

    padding: 2px 3px;

    border-radius: 2px;

    font-size: 7px;

    font-weight: bold;

    margin-top: 2px;
}

.on-court {
    background: #dff5e5;

    color: #16803c;
}

.off-court {
    background: #eee;

    color: #777;
}


/* =========================================
   COURT BUTTON
========================================= */

.court-button {
    border: none;

    padding: 2px 4px;

    border-radius: 2px;

    font-size: 7px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 2px;
}

.court-button.enter {
    background: #16803c;

    color: white;
}

.court-button.leave {
    background: #d32f2f;

    color: white;
}


/* =========================================
   NO PLAYERS
========================================= */

.no-players {
    text-align: center;

    color: #777;

    padding: 12px;

    font-size: 11px;
}


/* =========================================
   FOOTER CONTROLS
========================================= */

.game-footer-controls {
    display: flex;

    justify-content: space-between;

    gap: 8px;

    background: white;

    padding: 7px;

    border-radius: 5px;

    font-size: 10px;
}

.control-button {
    background: #ff6b00;

    color: white;

    border: none;

    padding: 4px 7px;

    border-radius: 3px;

    font-size: 9px;

    font-weight: bold;

    cursor: pointer;
}

.control-button:hover {
    background: #111;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 900px) {

    body {
        font-size: 11px;
    }

    .container {
        padding: 4px;
    }

    .stats-controls {
        grid-template-columns: 1fr;
    }

    .player-table {
        font-size: 9px;
    }

    .player-table thead th {
        font-size: 7px;
    }

    .player-name-cell {
        font-size: 8px;
    }

    .player-position {
        font-size: 6px;
    }

    .stat-value {
        font-size: 9px;
    }

    .stat-action-buttons button {
        width: 13px;
        height: 12px;
        font-size: 8px;
    }

}

@media (max-width: 600px) {

    header {
        padding: 7px;
    }

    .logo {
        font-size: 14px;
    }

    nav a {
        font-size: 9px;
        margin-left: 5px;
    }

    .scoreboard {
        gap: 4px;
    }

    .team-control {
        padding: 5px;
    }

    .score {
        font-size: 25px;
    }

    .score-button {
        padding: 3px 5px;
        font-size: 9px;
    }

    .player-table {
        font-size: 8px;
    }

    .player-table thead th {
        font-size: 6px;
        padding: 3px 0;
    }

    .player-name-cell {
        font-size: 7px;
    }

    .player-position {
        display: none;
    }

    .stat-value {
        font-size: 8px;
    }

    .shooting-value {
        font-size: 7px;
    }

    .shooting-pct {
        font-size: 6px;
    }

    .stat-action-buttons button {
        width: 11px;
        height: 11px;
        font-size: 7px;
    }

}


/* =========================================
   HIDE UNUSED TABLE ELEMENTS ON VERY SMALL
========================================= */

@media (max-width: 450px) {

    .player-table th:nth-child(8),
    .player-table td:nth-child(8) {
        display: none;
    }

    .player-table th:nth-child(9),
    .player-table td:nth-child(9) {
        display: none;
    }

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   GLOBAL DATA
========================================= */

let currentGame = null;

let playerStatsMap = {};

let playerDataMap = {};

let playerTeamMap = {};


/*
   Stores the team score when a player
   enters the court.
*/

let onCourtStartMap = {};


/* =========================================
   DEFAULT STATS
========================================= */

const DEFAULT_STATS = {

    points: 0,

    minutes_played: 0,

    offensive_rebounds: 0,

    defensive_rebounds: 0,

    assists: 0,

    steals: 0,

    blocks: 0,

    turnovers: 0,

    fouls: 0,

    two_pt_made: 0,

    two_pt_attempted: 0,

    three_pt_made: 0,

    three_pt_attempted: 0,

    ft_made: 0,

    ft_attempted: 0,

    plus_minus: 0

};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str) {

    if (!str) return "";

    return String(str)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================
   PERCENTAGE
========================================= */

function calculatePercentage(
    made,
    attempted
) {

    if (!attempted || attempted === 0) {

        return "0%";

    }

    return Math.round(
        (Number(made) / Number(attempted)) * 100
    ) + "%";

}


/* =========================================
   STATUS
========================================= */

function showStatus(message) {

    const el =
        document.getElementById(
            "statusMessage"
        );

    el.textContent =
        message;

    el.style.display =
        "block";

    clearTimeout(
        window.statusTimer
    );

    window.statusTimer =
        setTimeout(

            () => {

                el.style.display =
                    "none";

            },

            2500

        );

}


/* =========================================
   LOAD GAME
========================================= */

async function loadGame() {

    const gameId =
        Number(
            document.getElementById(
                "gameId"
            ).value
        );


    if (!gameId) {

        showStatus(
            "Please enter a valid Game ID."
        );

        return;

    }


    const {

        data,

        error

    } = await supabaseClient

        .from("games")

        .select("*")

        .eq(
            "id",
            gameId
        )

        .single();


    if (error) {

        console.error(error);

        showStatus(
            "Error loading game: " +
            error.message
        );

        return;

    }


    currentGame =
        data;


    playerStatsMap =
        {};

    playerDataMap =
        {};

    playerTeamMap =
        {};

    onCourtStartMap =
        {};


    document.getElementById(
        "homeTeam"
    ).textContent =
        data.home_team ||
        "Home Team";


    document.getElementById(
        "awayTeam"
    ).textContent =
        data.away_team ||
        "Away Team";


    refreshDisplay();


    await loadTeamPlayers();


    showStatus(
        "Game loaded successfully."
    );

}


/* =========================================
   REFRESH SCORE
========================================= */

function refreshDisplay() {

    if (!currentGame)
        return;


    document.getElementById(
        "homeScore"
    ).textContent =
        currentGame.home_score ?? 0;


    document.getElementById(
        "awayScore"
    ).textContent =
        currentGame.away_score ?? 0;

}


/* =========================================
   UPDATE TEAM SCORE
========================================= */

async function updateScore(
    team,
    amount
) {

    if (!currentGame) {

        showStatus(
            "Please load a game first."
        );

        return;

    }


    const column =
        team === "home"
            ? "home_score"
            : "away_score";


    const newScore =

        Math.max(

            0,

            Number(
                currentGame[column] || 0
            ) + amount

        );


    const {

        data,

        error

    } = await supabaseClient

        .from("games")

        .update({

            [column]:
                newScore

        })

        .eq(
            "id",
            currentGame.id
        )

        .select()

        .single();


    if (error) {

        console.error(error);

        showStatus(
            "Unable to update score."
        );

        return;

    }


    currentGame =
        data;


    refreshDisplay();


    /*
       IMPORTANT:

       We DO NOT rebuild player rows here.

       This prevents players from jumping
       or changing position.
    */

}


/* =========================================
   UPDATE GAME
========================================= */

async function updateGame(
    changes
) {

    if (!currentGame) {

        showStatus(
            "Load a game first."
        );

        return;

    }


    const {

        data,

        error

    } = await supabaseClient

        .from("games")

        .update(changes)

        .eq(
            "id",
            currentGame.id
        )

        .select()

        .single();


    if (error) {

        console.error(error);

        showStatus(
            "Error updating game."
        );

        return;

    }


    currentGame =
        data;


    refreshDisplay();


    showStatus(
        "Game updated."
    );

}


/* =========================================
   LOAD TEAMS
========================================= */

async function loadTeamPlayers() {

    if (!currentGame)
        return;


    const homeName =
        String(
            currentGame.home_team || ""
        ).trim();


    const awayName =
        String(
            currentGame.away_team || ""
        ).trim();


    const {

        data: homeTeam,

        error: homeError

    } = await supabaseClient

        .from("teams")

        .select(
            "id,name"
        )

        .ilike(
            "name",
            homeName
        )

        .maybeSingle();


    if (homeError) {

        console.error(
            "Home team error:",
            homeError
        );

    }


    if (homeTeam) {

        document.getElementById(
            "homePlayersTitle"
        ).textContent =
            homeTeam.name;


        await loadPlayersForTeam(

            homeTeam.id,

            "homePlayersList",

            "home"

        );

    }


    const {

        data: awayTeam,

        error: awayError

    } = await supabaseClient

        .from("teams")

        .select(
            "id,name"
        )

        .ilike(
            "name",
            awayName
        )

        .maybeSingle();


    if (awayError) {

        console.error(
            "Away team error:",
            awayError
        );

    }


    if (awayTeam) {

        document.getElementById(
            "awayPlayersTitle"
        ).textContent =
            awayTeam.name;


        await loadPlayersForTeam(

            awayTeam.id,

            "awayPlayersList",

            "away"

        );

    }

}


/* =========================================
   LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(

    teamId,

    containerId,

    teamSide

) {

    const container =
        document.getElementById(
            containerId
        );


    container.innerHTML =

        `<div class="no-players">
            Loading players...
        </div>`;


    const {

        data,

        error

    } = await supabaseClient

        .from("players")

        .select("*")

        .eq(
            "team_id",
            teamId
        )

        .order(

            "jersey_number",

            {

                ascending:
                    true

            }

        );


    if (error) {

        console.error(error);

        container.innerHTML =

            `<div class="no-players">
                Unable to load players.
            </div>`;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML =

            `<div class="no-players">
                No players assigned.
            </div>`;

        return;

    }


    data.forEach(

        player => {

            playerDataMap[
                player.id
            ] =
                player;

            playerTeamMap[
                player.id
            ] =
                teamSide;

        }

    );


    /*
       Build table ONCE.

       After this point we update
       individual cells only.
    */

    container.innerHTML =
        createPlayerTableHTML(

            data,

            teamSide

        );


    /*
       Load stats into existing rows.
    */

    for (
        const player
        of data
    ) {

        const stats =
            await getPlayerGameStats(
                player.id
            );


        updatePlayerRowUI(

            player.id,

            stats

        );

    }

}

/* =========================================
   GET PLAYER STATS
========================================= */

async function getPlayerGameStats(

    playerId

) {

    if (!currentGame)
        return {

            ...DEFAULT_STATS,

            player_id:
                playerId

        };


    const {

        data,

        error

    } = await supabaseClient

        .from(
            "player_game_stats"
        )

        .select("*")

        .eq(
            "game_id",
            currentGame.id
        )

        .eq(
            "player_id",
            playerId
        )

        .maybeSingle();


    if (error) {

        console.error(
            "Stats loading error:",
            error
        );

    }


    const stats = {

        ...DEFAULT_STATS,

        ...(data || {})

    };


    playerStatsMap[
        playerId
    ] =
        stats;


    return stats;

}


/* =========================================
   UPDATE NORMAL STAT
========================================= */

async function updatePlayerStat(

    playerId,

    statKey,

    amount

) {

    if (!currentGame) {

        showStatus(
            "Please load a game first."
        );

        return;

    }


    const stats =

        playerStatsMap[
            playerId
        ] ||

        await getPlayerGameStats(
            playerId
        );


    const currentValue =

        Number(

            stats[
                statKey
            ] || 0

        );


    const newValue =

        Math.max(

            0,

            currentValue +
            amount

        );


    /*
       Only update the selected field.

       REB is calculated automatically
       from OREB + DREB.
    */

    const updateObj = {

        player_id:
            playerId,

        game_id:
            currentGame.id

    };


    updateObj[
        statKey
    ] =
        newValue;


    const {

        data,

        error

    } = await supabaseClient

        .from(
            "player_game_stats"
        )

        .upsert(

            updateObj,

            {

                onConflict:
                    "player_id,game_id"

            }

        )

        .select()

        .single();


    if (error) {

        console.error(error);

        showStatus(

            "Unable to update stats: " +

            error.message

        );

        return;

    }


    playerStatsMap[
        playerId
    ] = {

        ...stats,

        ...data

    };


    /*
       UPDATE ONLY THIS PLAYER'S ROW.

       We do NOT remove the row.
       We do NOT recreate the row.
       This fixes the jumping problem.
    */

    updatePlayerRowUI(

        playerId,

        playerStatsMap[
            playerId
        ]

    );

}


/* =========================================
   UPDATE SHOOTING STATS
========================================= */

async function updateShootingStat(

    playerId,

    madeKey,

    attemptedKey,

    madeAmount = 0,

    attemptedAmount = 0

) {

    if (!currentGame)
        return;


    const stats =

        playerStatsMap[
            playerId
        ] ||

        await getPlayerGameStats(
            playerId
        );


    let made =

        Number(

            stats[
                madeKey
            ] || 0

        );


    let attempted =

        Number(

            stats[
                attemptedKey
            ] || 0

        );


    /*
       MADE +1 automatically adds
       an attempt too.

       Example:

       4/8

       M+ becomes

       5/9
    */

    if (
        madeAmount > 0
    ) {

        made +=
            madeAmount;

        attempted +=
            madeAmount;

    }


    /*
       MADE -1

       Remove one made shot.

       Also remove one attempt
       so the shooting numbers remain
       logically consistent.
    */

    if (
        madeAmount < 0 &&
        made > 0
    ) {

        made =
            Math.max(
                0,
                made - 1
            );

        attempted =
            Math.max(
                made,
                attempted - 1
            );

    }


    /*
       ATTEMPT BUTTON
    */

    if (
        attemptedAmount !== 0
    ) {

        attempted =

            Math.max(

                made,

                attempted +
                attemptedAmount

            );

    }


    const updateObj = {

        player_id:
            playerId,

        game_id:
            currentGame.id

    };


    updateObj[
        madeKey
    ] =
        made;


    updateObj[
        attemptedKey
    ] =
        attempted;


    const {

        data,

        error

    } = await supabaseClient

        .from(
            "player_game_stats"
        )

        .upsert(

            updateObj,

            {

                onConflict:
                    "player_id,game_id"

            }

        )

        .select()

        .single();


    if (error) {

        console.error(error);

        showStatus(
            "Unable to update shooting stats: " +
            error.message
        );

        return;

    }


    playerStatsMap[
        playerId
    ] = {

        ...stats,

        ...data

    };


    updatePlayerRowUI(

        playerId,

        playerStatsMap[
            playerId
        ]

    );

}


/* =========================================
   UPDATE PLAYER ROW ONLY
========================================= */

function updatePlayerRowUI(

    playerId,

    stats

) {

    /*
       This is the key fix.

       We find the existing row
       and change only the values.

       The row itself is NEVER removed.
    */


    const row =

        document.getElementById(

            `player-row-${playerId}`

        );


    if (!row)
        return;


    const setValue = (

        key,

        value

    ) => {

        const el =

            document.getElementById(

                `stat-${playerId}-${key}`

            );


        if (el) {

            el.textContent =
                value ?? 0;

        }

    };


    /*
       BASIC STATS
    */

    setValue(

        "minutes_played",

        stats.minutes_played

    );


    setValue(

        "points",

        stats.points

    );


    setValue(

        "offensive_rebounds",

        stats.offensive_rebounds

    );


    setValue(

        "defensive_rebounds",

        stats.defensive_rebounds

    );


    /*
       REB AUTOMATICALLY CALCULATED
    */

    const totalRebounds =

        Number(
            stats.offensive_rebounds || 0
        )

        +

        Number(
            stats.defensive_rebounds || 0
        );


    setValue(

        "rebounds",

        totalRebounds

    );


    setValue(

        "assists",

        stats.assists

    );


    setValue(

        "steals",

        stats.steals

    );


    setValue(

        "blocks",

        stats.blocks

    );


    setValue(

        "turnovers",

        stats.turnovers

    );


    setValue(

        "fouls",

        stats.fouls

    );


    /*
       2PT
    */

    const twoPtMade =

        Number(
            stats.two_pt_made || 0
        );


    const twoPtAttempted =

        Number(
            stats.two_pt_attempted || 0
        );


    const twoPtValue =

        document.getElementById(

            `stat-${playerId}-2pt`

        );


    const twoPtPct =

        document.getElementById(

            `pct-${playerId}-2pt`

        );


    if (twoPtValue) {

        twoPtValue.textContent =

            twoPtMade +

            "/" +

            twoPtAttempted;

    }


    if (twoPtPct) {

        twoPtPct.textContent =

            calculatePercentage(

                twoPtMade,

                twoPtAttempted

            );

    }


    /*
       3PT
    */

    const threePtMade =

        Number(
            stats.three_pt_made || 0
        );


    const threePtAttempted =

        Number(
            stats.three_pt_attempted || 0
        );


    const threePtValue =

        document.getElementById(

            `stat-${playerId}-3pt`

        );


    const threePtPct =

        document.getElementById(

            `pct-${playerId}-3pt`

        );


    if (threePtValue) {

        threePtValue.textContent =

            threePtMade +

            "/" +

            threePtAttempted;

    }


    if (threePtPct) {

        threePtPct.textContent =

            calculatePercentage(

                threePtMade,

                threePtAttempted

            );

    }


    /*
       FT
    */

    const ftMade =

        Number(
            stats.ft_made || 0
        );


    const ftAttempted =

        Number(
            stats.ft_attempted || 0
        );


    const ftValue =

        document.getElementById(

            `stat-${playerId}-ft`

        );


    const ftPct =

        document.getElementById(

            `pct-${playerId}-ft`

        );


    if (ftValue) {

        ftValue.textContent =

            ftMade +

            "/" +

            ftAttempted;

    }


    if (ftPct) {

        ftPct.textContent =

            calculatePercentage(

                ftMade,

                ftAttempted

            );

    }


    /*
       PLUS / MINUS

       READ ONLY
    */

    const plusMinus =

        Number(

            stats.plus_minus || 0

        );


    const plusMinusEl =

        document.getElementById(

            `stat-${playerId}-plus_minus`

        );


    if (plusMinusEl) {

        plusMinusEl.textContent =

            plusMinus > 0

                ? "+" + plusMinus

                : plusMinus;

        plusMinusEl.className =

            "plus-minus-value " +

            (

                plusMinus > 0

                    ? "plus-minus-positive"

                    : plusMinus < 0

                        ? "plus-minus-negative"

                        : ""

            );

    }

}


/* =========================================
   ON COURT / OFF COURT
========================================= */

async function toggleCourt(

    playerId

) {

    if (!currentGame)
        return;


    const statusEl =

        document.getElementById(

            `court-status-${playerId}`

        );


    const button =

        document.getElementById(

            `court-button-${playerId}`

        );


    const isCurrentlyOnCourt =

        statusEl.classList.contains(
            "on-court"
        );


    const teamSide =

        playerTeamMap[
            playerId
        ];


    if (
        !isCurrentlyOnCourt
    ) {

        /*
           PLAYER ENTERS COURT

           Record current score.
        */

        onCourtStartMap[
            playerId
        ] = {

            teamScore:

                teamSide === "home"

                    ? Number(
                        currentGame.home_score || 0
                    )

                    : Number(
                        currentGame.away_score || 0
                    ),

            opponentScore:

                teamSide === "home"

                    ? Number(
                        currentGame.away_score || 0
                    )

                    : Number(
                        currentGame.home_score || 0
                    )

        };


        statusEl.textContent =
            "ON";

        statusEl.className =
            "court-status on-court";


        button.textContent =
            "OFF COURT";

        button.className =
            "court-button leave";


        showStatus(
            "Player entered the court."
        );


        return;

    }


    /*
       PLAYER LEAVES COURT
    */

    const start =

        onCourtStartMap[
            playerId
        ];


    if (!start) {

        statusEl.textContent =
            "OFF";

        statusEl.className =
            "court-status off-court";

        button.textContent =
            "ON COURT";

        button.className =
            "court-button enter";

        return;

    }


    const currentTeamScore =

        teamSide === "home"

            ? Number(
                currentGame.home_score || 0
            )

            : Number(
                currentGame.away_score || 0
            );


    const currentOpponentScore =

        teamSide === "home"

            ? Number(
                currentGame.away_score || 0
            )

            : Number(
                currentGame.home_score || 0
            );


    const teamDifference =

        currentTeamScore -

        start.teamScore;


    const opponentDifference =

        currentOpponentScore -

        start.opponentScore;


    const shiftPlusMinus =

        teamDifference -

        opponentDifference;


    const stats =

        playerStatsMap[
            playerId
        ] ||

        await getPlayerGameStats(
            playerId
        );


    const newPlusMinus =

        Number(
            stats.plus_minus || 0
        )

        +

        shiftPlusMinus;


    const updateObj = {

        player_id:
            playerId,

        game_id:
            currentGame.id,

        plus_minus:
            newPlusMinus

    };


    const {

        data,

        error

    } = await supabaseClient

        .from(
            "player_game_stats"
        )

        .upsert(

            updateObj,

            {

                onConflict:
                    "player_id,game_id"

            }

        )

        .select()

        .single();


    if (error) {

        console.error(error);

        showStatus(
            "Unable to update +/-: " +
            error.message
        );

        return;

    }


    playerStatsMap[
        playerId
    ] = {

        ...stats,

        ...data

    };


    updatePlayerRowUI(

        playerId,

        playerStatsMap[
            playerId
        ]

    );


    delete onCourtStartMap[
        playerId
    ];


    statusEl.textContent =
        "OFF";

    statusEl.className =
        "court-status off-court";


    button.textContent =
        "ON COURT";

    button.className =
        "court-button enter";


    showStatus(

        "Player +/- updated: " +

        (

            shiftPlusMinus >= 0

                ? "+"

                : ""

        ) +

        shiftPlusMinus

    );

}
