<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
GLOBAL VARIABLES
========================================= */

let currentGame = null;

let playerStatsMap = {};

let playerDataMap = {};

let playerTeamMap = {};

let playerOnCourt = {};

let clockSeconds = 600;

let clockInterval = null;

let clockRunning = false;


/* =========================================
ESCAPE HTML
========================================= */

function escapeHTML(str){

if(!str) return "";

return String(str)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
PERCENTAGE
========================================= */

function calculatePercentage(
made,
attempted
){

if(!attempted || attempted <= 0)
return "0%";

return Math.round(
(Number(made)/Number(attempted))*100
)+"%";

}


/* =========================================
STATUS
========================================= */

function showStatus(message){

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.style.display =
"block";

setTimeout(()=>{

el.style.display =
"none";

},3000);

}


/* =========================================
LOAD GAME
========================================= */

async function loadGame(){

const gameId =
Number(
document.getElementById(
"gameId"
).value
);

if(!gameId){

showStatus(
"Enter a valid Game ID."
);

return;

}

const {

data,

error

} = await supabaseClient

.from("games")

.select("*")

.eq("id",gameId)

.single();

if(error){

console.error(error);

showStatus(
"Error loading game: "+
error.message
);

return;

}

currentGame =
data;

document.getElementById(
"homeTeam"
).textContent =
data.home_team ||
"Home Team";

document.getElementById(
"awayTeam"
).textContent =
data.away_team ||
"Away Team";

document.getElementById(
"homeScore"
).textContent =
data.home_score || 0;

document.getElementById(
"awayScore"
).textContent =
data.away_score || 0;


/*
=========================================
RESTORE CLOCK FROM SUPABASE
=========================================
*/

clockSeconds =
Number(
data.clock_seconds ?? 600
);

clockRunning =
Boolean(
data.clock_running ?? false
);

updateClockDisplay();


/*
=========================================
RESET LOCAL MAPS
=========================================
*/

playerStatsMap = {};

playerDataMap = {};

playerTeamMap = {};

playerOnCourt = {};


/*
=========================================
LOAD PLAYERS

The on_court status is now restored
from Supabase instead of resetting.
=========================================
*/

await loadTeamPlayers();


/*
=========================================
IF CLOCK WAS RUNNING BEFORE REFRESH
RESUME IT
=========================================
*/

if(clockRunning){

startClock();

}


showStatus(
"Game loaded successfully."
);

}


/* =========================================
UPDATE SCORE
========================================= */

async function updateScore(
team,
amount
){

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

const column =
team === "home"
? "home_score"
: "away_score";

const oldScore =
Number(
currentGame[column] || 0
);

const newScore =
Math.max(
0,
oldScore + amount
);

const {

data,
error

} = await supabaseClient

.from("games")

.update({

[column]:
newScore

})

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(error);

showStatus(
"Unable to update score."
);

return;

}

currentGame =
data;

document.getElementById(
team+"Score"
).textContent =
newScore;


/*
UPDATE INDIVIDUAL +/- FOR
PLAYERS CURRENTLY ON COURT
*/

if(amount !== 0){

for(
const playerId in playerOnCourt
){

if(!playerOnCourt[playerId])
continue;

if(
playerTeamMap[playerId] !== team
)
continue;

const stats =
await getPlayerGameStats(
playerId
);

const currentPlusMinus =
Number(
stats.plus_minus || 0
);

await saveStatDirect(

playerId,

"plus_minus",

currentPlusMinus + amount

);

}

}

}


/* =========================================
UPDATE GAME
========================================= */

async function updateGame(
changes
){

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

const {

data,
error

} = await supabaseClient

.from("games")

.update(changes)

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(error);

showStatus(
"Unable to update game."
);

return;

}

currentGame =
data;

showStatus(
"Game updated."
);

}


/* =========================================
LOAD TEAMS
========================================= */

async function loadTeamPlayers(){

const homeName =
String(
currentGame.home_team || ""
).trim();

const awayName =
String(
currentGame.away_team || ""
).trim();


const {

data:homeTeam

} = await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
homeName
)

.maybeSingle();


const {

data:awayTeam

} = await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
awayName
)

.maybeSingle();


if(homeTeam){

document.getElementById(
"homePlayersTitle"
).textContent =
homeTeam.name;

await loadPlayersForTeam(
homeTeam.id,
"homePlayersList",
"home"
);

}


if(awayTeam){

document.getElementById(
"awayPlayersTitle"
).textContent =
awayTeam.name;

await loadPlayersForTeam(
awayTeam.id,
"awayPlayersList",
"away"
);

}

}


/* =========================================
LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(

teamId,

containerId,

team

){

const container =
document.getElementById(
containerId
);

container.innerHTML =
"";

const {

data,
error

} = await supabaseClient

.from("players")

.select("*")

.eq(
"team_id",
teamId
)

.order(
"jersey_number",
{
ascending:true
}
);

if(error){

console.error(error);

container.innerHTML =
"<div class='no-players'>Unable to load players.</div>";

return;

}

if(!data || !data.length){

container.innerHTML =
"<div class='no-players'>No players assigned.</div>";

return;

}


const table =
document.createElement(
"table"
);

table.className =
"player-table";


table.innerHTML = `

<thead>

<tr>

<th class="col-number">#</th>

<th class="col-player">PLAYER</th>

<th class="col-min">MIN</th>

<th class="col-stat">PTS</th>

<th class="col-stat">OREB</th>

<th class="col-stat">DREB</th>

<th class="col-stat">REB</th>

<th class="col-stat">AST</th>

<th class="col-stat">STL</th>

<th class="col-stat">BLK</th>

<th class="col-stat">TO</th>

<th class="col-stat">PF</th>

<th class="col-shot">2PT</th>

<th class="col-shot">3PT</th>

<th class="col-shot">FT</th>

<th class="col-plusminus">+/-</th>

</tr>

</thead>

<tbody></tbody>

`;


container.appendChild(
table
);

const tbody =
table.querySelector(
"tbody"
);


for(
const player of data
){

playerDataMap[player.id] =
player;

playerTeamMap[player.id] =
team;


/*
=========================================
GET SAVED PLAYER GAME STATS
=========================================
*/

const savedStats =
await getPlayerGameStats(
player.id
);


/*
=========================================
RESTORE ON COURT STATUS
FROM SUPABASE
=========================================
*/

playerOnCourt[player.id] =
Boolean(
savedStats.on_court
);


const row =
document.createElement(
"tr"
);

row.id =
"player-row-"+player.id;

tbody.appendChild(row);

await renderPlayerRow(
player,
row
);

}

}


/* =========================================
GET PLAYER STATS
========================================= */

async function getPlayerGameStats(
playerId
){

const defaults = {

points:0,

minutes_played:0,

offensive_rebounds:0,

defensive_rebounds:0,

rebounds:0,

assists:0,

steals:0,

blocks:0,

turnovers:0,

fouls:0,

two_pt_made:0,

two_pt_attempted:0,

three_pt_made:0,

three_pt_attempted:0,

ft_made:0,

ft_attempted:0,

plus_minus:0,

on_court:false

};

if(
playerStatsMap[playerId]
){

return playerStatsMap[playerId];

}


if(!currentGame)
return defaults;


const {

data,
error

} = await supabaseClient

.from(
"player_game_stats"
)

.select("*")

.eq(
"game_id",
currentGame.id
)

.eq(
"player_id",
playerId
)

.maybeSingle();


if(error){

console.error(
"Stats error:",
error
);

}


playerStatsMap[playerId] = {

...defaults,

...(data || {})

};

return playerStatsMap[playerId];

}


/* =========================================
SAVE ONE STAT
========================================= */

async function saveStatDirect(

playerId,

statKey,

value

){

if(!currentGame)
return;

const stats =
await getPlayerGameStats(
playerId
);

const updateObj = {

player_id:
playerId,

game_id:
currentGame.id

};

updateObj[statKey] =
Math.max(
0,
Number(value || 0)
);


/*
REB IS AUTOMATIC
*/

if(
statKey ===
"offensive_rebounds"
||
statKey ===
"defensive_rebounds"
){

const oreb =
statKey ===
"offensive_rebounds"
? Number(value)
: Number(
stats.offensive_rebounds || 0
);

const dreb =
statKey ===
"defensive_rebounds"
? Number(value)
: Number(
stats.defensive_rebounds || 0
);

updateObj.rebounds =
Math.max(
0,
oreb + dreb
);

}


const {

data,
error

} = await supabaseClient

.from(
"player_game_stats"
)

.upsert(

updateObj,

{

onConflict:
"player_id,game_id"

}

)

.select()
.single();


if(error){

console.error(
error
);

showStatus(
"Unable to save player stats: "+
error.message
);

return;

}


playerStatsMap[playerId] = {

...stats,

...data

};

}


/* =========================================
UPDATE STAT
========================================= */

async function updatePlayerStat(

playerId,

statKey,

amount

){

const stats =
await getPlayerGameStats(
playerId
);

const currentValue =
Number(
stats[statKey] || 0
);

const newValue =
Math.max(
0,
currentValue + amount
);


if(statKey === "points"){
return;
}

if(statKey === "minutes_played"){
return;
}

if(statKey === "plus_minus"){
return;
}


if(
statKey === "two_pt_made"
||
statKey === "three_pt_made"
||
statKey === "ft_made"
){

const pointsToAdd =
statKey === "two_pt_made"
? 2
: statKey === "three_pt_made"
? 3
: 1;

const newPoints =
Math.max(
0,
Number(stats.points || 0)
+
(amount * pointsToAdd)
);


await saveStatDirect(
playerId,
statKey,
newValue
);

await saveStatDirect(
playerId,
"points",
newPoints
);


/*
UPDATE TEAM SCORE.
THIS ALSO UPDATES THE INDIVIDUAL
+/- OF THE ON-COURT PLAYERS.
*/

const team =
playerTeamMap[playerId];

await updateScore(
team,
amount * pointsToAdd
);

await refreshPlayerRow(
playerId
);

return;

}


await saveStatDirect(

playerId,

statKey,

newValue

);

await refreshPlayerRow(
playerId
);

/* =========================================

========================================= */

function formatMinutes(
seconds
){

const totalSeconds =
Number(seconds || 0);

const minutes =
Math.floor(
totalSeconds / 60
);

const secs =
totalSeconds % 60;

return (

minutes+

":"+

String(secs)
.padStart(2,"0")

);

}


/* =========================================
SUBSTITUTION
========================================= */

async function toggleSubstitution(
playerId
){

if(!currentGame)
return;

const team =
playerTeamMap[playerId];

const currentlyOn =
playerOnCourt[playerId];


/*
SUB OUT
*/

if(currentlyOn){

playerOnCourt[playerId] =
false;


/*
SAVE SUB OUT STATUS TO SUPABASE
*/

await saveStatDirect(
playerId,
"on_court",
false
);

await refreshPlayerRow(
playerId
);

showStatus(
"Player SUB OUT."
);

return;

}


/*
COUNT PLAYERS ON COURT
*/

const activePlayers =
Object.keys(
playerOnCourt
).filter(

id =>

playerOnCourt[id] === true
&&
playerTeamMap[id] === team

).length;


/*
MAX 5
*/

if(activePlayers >= 5){

showStatus(
"Maximum 5 players can be on court."
);

return;

}


/*
SUB IN
*/

playerOnCourt[playerId] =
true;


/*
SAVE SUB IN STATUS TO SUPABASE
*/

await saveStatDirect(
playerId,
"on_court",
true
);

await refreshPlayerRow(
playerId
);

showStatus(
"Player SUB IN."
);

}

);

).textContent =

/* =========================================
SAVE CLOCK TO SUPABASE
========================================= */

async function saveClockState(){

if(!currentGame)
return;

const {

data,
error

} = await supabaseClient

.from("games")

.update({

clock_seconds:
clockSeconds,

clock_running:
clockRunning

})

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(
"Clock save error:",
error
);

return;

}

currentGame =
data;

}


/* =========================================
START CLOCK
========================================= */

function startClock(){

if(clockRunning)
return;

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

clockRunning =
true;


/*
SAVE RUNNING STATUS
*/

saveClockState();


clockInterval =
setInterval(

async()=>{

if(clockSeconds <= 0){

pauseClock();

return;

}


clockSeconds--;

updateClockDisplay();


/*
SAVE CURRENT CLOCK EVERY SECOND
*/

await saveClockState();


/*
=========================================
MINUTES ONLY FOR PLAYERS ON COURT
=========================================
*/

for(
const playerId in playerOnCourt
){

if(
playerOnCourt[playerId]
){

const stats =
await getPlayerGameStats(
playerId
);

const newMinutes =
Number(
stats.minutes_played || 0
)+1;

await saveStatDirect(

playerId,

"minutes_played",

newMinutes

);

}

}

},

1000

);

}


/* =========================================
PAUSE CLOCK
========================================= */

async function pauseClock(){

clockRunning =
false;

if(clockInterval){

clearInterval(
clockInterval
);

clockInterval =
null;

}

await saveClockState();

}


/* =========================================
RESET CLOCK
========================================= */

async function resetClock(){

pauseClock();

clockSeconds =
600;

updateClockDisplay();

await saveClockState();

}


/* =========================================
SET PERIOD
========================================= */

async function setPeriod(
period
){

if(!currentGame)
return;

await updateGame({
period:period
});

resetClock();

}


/* =========================================
AUTO LOAD
========================================= */

loadGame();
