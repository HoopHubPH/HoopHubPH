<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scorekeeper | Hoop Hub PH</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================
   BASE
========================================= */

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}


/* =========================================
   HEADER
========================================= */

header {
    background: #111;
    color: white;
    padding: 10px 2%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: white;
    text-decoration: none;
}

.logo span {
    color: #ff6b00;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 15px;
    font-weight: bold;
    font-size: 13px;
}

nav a:hover {
    color: #ff6b00;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    width: 100%;
    max-width: 100%;
    margin: 12px auto;
    padding: 0 10px;
}


/* =========================================
   GAME SELECTOR
========================================= */

.game-selector {
    background: white;
    padding: 10px 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 12px;

    display: flex;
    align-items: center;
    gap: 10px;
}

.game-selector h2 {
    font-size: 15px;
}

.game-selector input {
    width: 100px;
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.load-button {
    background: #ff6b00;
    color: white;
    border: none;
    padding: 7px 15px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
}

.load-button:hover {
    background: #111;
}


/* =========================================
   STATUS
========================================= */

#statusMessage {
    text-align: center;
    padding: 7px;
    background: #e8f5e9;
    color: #2e7d32;
    border-radius: 5px;
    margin-bottom: 12px;
    display: none;
    font-size: 12px;
}


/* =========================================
   SCOREBOARD
========================================= */

.scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
}

.team-control {
    background: white;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.team-control h2 {
    font-size: 17px;
    margin-bottom: 3px;
}

.score {
    font-size: 40px;
    font-weight: bold;
    color: #ff6b00;
    margin-bottom: 7px;
}

.button-row {
    display: flex;
    justify-content: center;
    gap: 5px;
}

.score-button {
    background: #111;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.score-button:hover {
    background: #ff6b00;
}


/* =========================================
   PLAYER STATS SECTION
========================================= */

.controls {
    background: white;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 12px;
}

.controls > h2 {
    font-size: 17px;
    text-align: center;
    margin-bottom: 8px;
}


/* =========================================
   TWO TEAM COLUMNS
========================================= */

.stats-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat-control {
    background: #fafafa;
    border: 1px solid #ddd;
    padding: 7px;
    border-radius: 7px;

    max-height: 70vh;
    overflow-y: auto;
}

.stat-control > h2 {
    text-align: center;
    font-size: 14px;
    margin-bottom: 7px;

    position: sticky;
    top: 0;

    background: #fafafa;
    padding: 5px;

    z-index: 5;

    border-bottom: 2px solid #ff6b00;
}


/* =========================================
   PLAYER CARD
========================================= */

.player-card {
    background: white;
    border: 1px solid #ddd;
    padding: 6px;
    margin-bottom: 6px;
    border-radius: 6px;
}


/* =========================================
   PLAYER HEADER
========================================= */

.player-card-header {
    display: grid;
    grid-template-columns: 35px 1fr;
    gap: 6px;
    align-items: center;

    padding-bottom: 5px;
    margin-bottom: 5px;

    border-bottom: 1px solid #eee;
}

.player-number {
    background: #111;
    color: white;

    padding: 4px 3px;

    border-radius: 4px;

    font-size: 12px;
    font-weight: bold;

    text-align: center;
}

.player-name {
    font-size: 13px;
    font-weight: bold;
}

.player-info {
    font-size: 10px;
    color: #777;
}


/* =========================================
   STAT TABLE
========================================= */

.player-stat-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.player-stat-table th {
    font-size: 8px;
    color: #555;

    padding: 3px 1px;

    background: #f1f1f1;

    border: 1px solid #e5e5e5;
}

.player-stat-table td {
    text-align: center;

    padding: 2px 1px;

    border: 1px solid #eee;

    font-size: 11px;
}


/* =========================================
   STAT VALUE
========================================= */

.stat-value {
    font-size: 12px;
    font-weight: bold;
    color: #ff6b00;
}


/* =========================================
   STAT BUTTONS
========================================= */

.stat-button-row {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin-top: 2px;
}

.stat-btn {
    width: 19px;
    height: 17px;

    border: none;
    border-radius: 3px;

    background: #111;
    color: white;

    font-size: 11px;
    font-weight: bold;

    cursor: pointer;

    padding: 0;
}

.stat-btn:hover {
    background: #ff6b00;
}

.stat-btn.minus {
    background: #888;
}

.stat-btn.minus:hover {
    background: #333;
}


/* =========================================
   SHOOTING STATS
========================================= */

.shooting-row {
    display: grid;

    grid-template-columns:
    1fr
    1fr
    1fr;

    gap: 3px;

    margin-top: 5px;
}

.shooting-box {
    background: #fff8f5;

    border: 1px solid #ffe2d4;

    border-radius: 4px;

    text-align: center;

    padding: 3px;
}

.shooting-title {
    font-size: 9px;
    font-weight: bold;
}

.shooting-value {
    font-size: 11px;
    font-weight: bold;

    margin: 2px;
}

.shooting-percent {
    font-size: 9px;
    color: #ff6b00;
    font-weight: bold;
}


/* =========================================
   SUBSTITUTION
========================================= */

.substitution-row {
    display: flex;
    gap: 4px;
    margin-top: 5px;
}

.sub-button {
    flex: 1;

    border: none;
    border-radius: 4px;

    padding: 5px;

    font-size: 10px;
    font-weight: bold;

    cursor: pointer;

    background: #111;
    color: white;
}

.sub-button:hover {
    background: #ff6b00;
}

.sub-button.active {
    background: #ff6b00;
}


/* =========================================
   PLUS MINUS
========================================= */

.plus-minus {
    font-size: 14px;
    font-weight: bold;
}

.plus {
    color: #2e7d32;
}

.minus-value {
    color: #d32f2f;
}

.zero {
    color: #555;
}


/* =========================================
   NO PLAYERS
========================================= */

.no-players {
    text-align: center;
    color: #777;
    padding: 15px;
    font-size: 12px;
}


/* =========================================
   GAME FOOTER
========================================= */

.game-footer-controls {
    display: flex;
    gap: 10px;
    justify-content: space-around;

    background: white;

    padding: 10px;

    border-radius: 8px;

    margin-bottom: 15px;
}

.control-button {
    background: #ff6b00;
    color: white;

    border: none;

    padding: 6px 10px;

    border-radius: 4px;

    font-weight: bold;

    cursor: pointer;

    font-size: 11px;
}

.control-button:hover {
    background: #111;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 900px) {

    .stats-controls {
        grid-template-columns: 1fr;
    }

    .stat-control {
        max-height: none;
    }

}

@media (max-width: 600px) {

    header {
        flex-direction: column;
        gap: 8px;
    }

    nav a {
        margin: 0 5px;
        font-size: 11px;
    }

    .game-selector {
        flex-wrap: wrap;
    }

    .scoreboard {
        grid-template-columns: 1fr 1fr;
    }

    .player-stat-table th {
        font-size: 7px;
    }

    .player-stat-table td {
        font-size: 9px;
    }

    .stat-btn {
        width: 17px;
        height: 16px;
        font-size: 10px;
    }

}

</style>

</head>


<body>


<header>

<a href="index.html" class="logo">
HOOP <span>HUB PH</span>
</a>

<nav>

<a href="index.html">Home</a>

<a href="live-game.html">
Live Game
</a>

</nav>

</header>


<div class="container">


<!-- =========================================

========================================= -->

<div class="game-selector">

<h2>Game ID:</h2>

<input
type="number"
id="gameId"
value="1"
placeholder="Game ID"
>

<button
class="load-button"
onclick="loadGame()">

LOAD

</button>

<!-- =========================================

Home Team

class="score"
id="homeScore">

0

<div class="button-row">

class="score-button"
onclick="updateScore('home',1)">

<button

onclick="updateScore('home',2)">

</button>

<button
class="score-button"
onclick="updateScore('home',3)">

<button
class="score-button"
onclick="updateScore('home',-1)">

-1

<h2 id="awayTeam">

</h2>

class="score"
id="awayScore">

0

</div>

<div class="button-row">

<button
class="score-button"
onclick="updateScore('away',1)">

+1

</button>

<button
class="score-button"
onclick="updateScore('away',2)">

+2

</button>

<button
class="score-button"
onclick="updateScore('away',3)">

+3

</button>

<button
class="score-button"
onclick="updateScore('away',-1)">

-1

</button>

</div>

</div>

</div>


<!-- =========================================
     PLAYER STATS
========================================= -->

<div class="controls">

<h2>
PLAYER STATS
</h2>

<!-- HOME -->

<div class="stat-control">

<h2 id="homePlayersTitle">
Home Players
</h2>

<div id="homePlayersList">

<div class="no-players">

Load a game to see players.

</div>

<div class="stat-control">

</h2>

Load a game to see players.

</div>

</div>

</div>


</div>

</div>

========================================= -->

<div class="game-footer-controls">

class="control-button"
onclick="updateGame({status:'Live'})">

LIVE

</button>

class="control-button"

FINAL

class="control-button"

</button>

onclick="updateGame({period:'2nd Quarter'})">

2Q

</button>

class="control-button"
onclick="updateGame({period:'3rd Quarter'})">

3Q

</button>

class="control-button"
onclick="updateGame({period:'4th Quarter'})">

4Q

</button>

</div>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   GLOBAL VARIABLES
========================================= */

let currentGame = null;

let playerStatsMap = {};

let playerObjects = {};

let playerOnCourt = {};

let playerEntryScore = {};

let playerEntryTime = {};


/* =========================================
   DEFAULT STATS
========================================= */

function defaultStats() {

return {

points: 0,

minutes_played: 0,

offensive_rebounds: 0,

defensive_rebounds: 0,

assists: 0,

steals: 0,

blocks: 0,

turnovers: 0,

fouls: 0,

two_pt_made: 0,

two_pt_attempted: 0,

three_pt_made: 0,

three_pt_attempted: 0,

ft_made: 0,

ft_attempted: 0,

plus_minus: 0

};

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str) {

if (!str) return "";

return String(str)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
   PERCENTAGE
========================================= */

function calculatePercentage(
made,
attempted
) {

if (!attempted || attempted === 0) {

return "0%";

}

return Math.round(
(made / attempted) * 100
) + "%";

}


/* =========================================
   STATUS
========================================= */

function showStatus(message) {

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.style.display =
"block";

setTimeout(

() => {

el.style.display =
"none";

},

3000

);

}


/* =========================================
   LOAD GAME
========================================= */

async function loadGame() {

const gameId =
Number(
document.getElementById(
"gameId"
).value
);


if (!gameId) {

showStatus(
"Please enter a valid Game ID."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.select("*")

.eq(
"id",
gameId
)

.single();


if (error) {

console.error(error);

showStatus(
"Error loading game: " +
error.message
);

return;

}


currentGame =
data;


document.getElementById(
"homeTeam"
).textContent =
data.home_team ||
"Home Team";


document.getElementById(
"awayTeam"
).textContent =
data.away_team ||
"Away Team";


playerStatsMap = {};

playerObjects = {};

playerOnCourt = {};

playerEntryScore = {};

playerEntryTime = {};


refreshDisplay();

await loadTeamPlayers();

showStatus(
"Game loaded successfully."
);

}


/* =========================================
   REFRESH SCOREBOARD
========================================= */

function refreshDisplay() {

if (!currentGame) return;


document.getElementById(
"homeScore"
).textContent =
currentGame.home_score || 0;


document.getElementById(
"awayScore"
).textContent =
currentGame.away_score || 0;

}


/* =========================================
   UPDATE TEAM SCORE
========================================= */

async function updateScore(
team,
amount
) {

if (!currentGame) {

showStatus(
"Load a game first."
);

return;

}


const column =
team === "home"
? "home_score"
: "away_score";


let newScore =

Math.max(

0,

Number(
currentGame[column] || 0
) + amount

);


const {

data,

error

} = await supabaseClient

.from("games")

.update({

[column]:
newScore

})

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

console.error(error);

showStatus(
"Error updating score: " +
error.message
);

return;

}


currentGame =
data;


refreshDisplay();

}


/* =========================================
   UPDATE GAME
========================================= */

async function updateGame(
changes
) {

if (!currentGame) {

showStatus(
"Load game first."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.update(changes)

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

showStatus(
"Error: " +
error.message
);

return;

}


currentGame =
data;

refreshDisplay();

showStatus(
"Game updated."
);

}


/* =========================================
   LOAD TEAMS
========================================= */

async function loadTeamPlayers() {

if (!currentGame) return;


const homeName =
String(
currentGame.home_team ||
""
).trim();


const awayName =
String(
currentGame.away_team ||
""
).trim();


const {

data: homeTeam

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.ilike(
"name",
homeName
)

.maybeSingle();


const {

data: awayTeam

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.ilike(
"name",
awayName
)

.maybeSingle();


if (homeTeam) {

document.getElementById(
"homePlayersTitle"
).textContent =
homeTeam.name;


await loadPlayersForTeam(

homeTeam.id,

"homePlayersList"

);

}

else {

document.getElementById(
"homePlayersList"
).innerHTML =

`<div class="no-players">

Team not found:
${escapeHTML(homeName)}

</div>`;

}


if (awayTeam) {

document.getElementById(
"awayPlayersTitle"
).textContent =
awayTeam.name;


await loadPlayersForTeam(

awayTeam.id,

"awayPlayersList"

);

}

else {

document.getElementById(
"awayPlayersList"
).innerHTML =

`<div class="no-players">

Team not found:
${escapeHTML(awayName)}

</div>`;

}

}


/* =========================================
   LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(

teamId,

containerId

) {


const container =
document.getElementById(
containerId
);


container.innerHTML =

`<div class="no-players">

Loading players...

</div>`;


const {

data,

error

} = await supabaseClient

.from("players")

.select("*")

.eq(
"team_id",
teamId
)

.order(

"jersey_number",

{

ascending:
true

}

);


if (error) {

console.error(error);

container.innerHTML =

`<div class="no-players">

Error loading players.

</div>`;

return;

}


if (!data || data.length === 0) {

container.innerHTML =

`<div class="no-players">

No players assigned.

</div>`;

return;

}


container.innerHTML = "";


for (
const player of data
) {

playerObjects[player.id] =
player;

await createPlayerCard(

player,

container

);

}

}


/* =========================================
   GET PLAYER GAME STATS
========================================= */

async function getPlayerGameStats(

playerId

) {


const defaults =
defaultStats();


if (!currentGame) {

return defaults;

}


const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.select("*")

.eq(
"game_id",
currentGame.id
)

.eq(
"player_id",
playerId
)

.maybeSingle();


if (error) {

console.error(
"Stats loading error:",
error
);

}


const stats = {

...defaults,

...(data || {})

};


playerStatsMap[playerId] =
stats;


return stats;

}


/* =========================================
   SAVE PLAYER STATS
========================================= */

async function savePlayerStats(

playerId,

stats

) {


if (!currentGame) return;


const dataToSave = {

player_id:
playerId,

game_id:
currentGame.id,

points:
stats.points || 0,

minutes_played:
stats.minutes_played || 0,

offensive_rebounds:
stats.offensive_rebounds || 0,

defensive_rebounds:
stats.defensive_rebounds || 0,

assists:
stats.assists || 0,

steals:
stats.steals || 0,

blocks:
stats.blocks || 0,

turnovers:
stats.turnovers || 0,

fouls:
stats.fouls || 0,

two_pt_made:
stats.two_pt_made || 0,

two_pt_attempted:
stats.two_pt_attempted || 0,

three_pt_made:
stats.three_pt_made || 0,

three_pt_attempted:
stats.three_pt_attempted || 0,

ft_made:
stats.ft_made || 0,

ft_attempted:
stats.ft_attempted || 0,

plus_minus:
stats.plus_minus || 0

};


const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.upsert(

dataToSave,

{

onConflict:
"player_id,game_id"

}

)

.select()

.single();


if (error) {

console.error(
"Saving player stats error:",
error
);

showStatus(
"Unable to save player stats: " +
error.message
);

return null;

}


playerStatsMap[playerId] =
data;


return data;

}


/* =========================================
   UPDATE PLAYER STAT
========================================= */

async function updatePlayerStat(

playerId,

statKey,

amount

) {


if (!currentGame) {

showStatus(
"Load a game first."
);

return;

}


let stats =

playerStatsMap[playerId];


if (!stats) {

stats =
await getPlayerGameStats(
playerId
);

}


let oldValue =

Number(
stats[statKey] || 0
);


let newValue =

Math.max(

0,

oldValue + amount

);


/* =========================================
   SHOOTING MADE
========================================= */

if (
statKey === "two_pt_made"
) {


if (
amount > 0
) {

stats.two_pt_attempted += 1;

stats.points += 2;

await updateTeamScoreDirect(

getPlayerTeam(
playerId
),

2

);

}

else if (
amount < 0 &&
oldValue > 0
) {

stats.points =
Math.max(

0,

stats.points - 2

);

if (
stats.two_pt_attempted > 0
) {

stats.two_pt_attempted -= 1;

}

await updateTeamScoreDirect(

getPlayerTeam(
playerId
),

-2

);

}

}


if (
statKey === "three_pt_made"
) {


if (
amount > 0
) {

stats.three_pt_attempted += 1;

stats.points += 3;

await updateTeamScoreDirect(

getPlayerTeam(
playerId
),

3

);

}

else if (
amount < 0 &&
oldValue > 0
) {

stats.points =
Math.max(

0,

stats.points - 3

);

if (
stats.three_pt_attempted > 0
) {

stats.three_pt_attempted -= 1;

}

await updateTeamScoreDirect(

getPlayerTeam(
playerId
),

-3

);

}

}


if (
statKey === "ft_made"
) {


if (
amount > 0
) {

stats.ft_attempted += 1;

stats.points += 1;

await updateTeamScoreDirect(

getPlayerTeam(
playerId
),

1

);

}

else if (
amount < 0 &&
oldValue > 0
) {

stats.points =
Math.max(

0,

stats.points - 1

);

if (
stats.ft_attempted > 0
) {

stats.ft_attempted -= 1;

}

await updateTeamScoreDirect(

getPlayerTeam(
playerId
),

-1

);

}

}


/* =========================================
   NORMAL STAT
========================================= */

stats[statKey] =
newValue;


const saved =
await savePlayerStats(

playerId,

stats

);


if (saved) {

await refreshPlayerCard(
playerId
);

refreshDisplay();

}

}


/* =========================================
   UPDATE ATTEMPT
========================================= */

async function updateAttempt(

playerId,

statKey,

amount

) {


if (!currentGame) return;


let stats =
playerStatsMap[playerId];


if (!stats) {

stats =
await getPlayerGameStats(
playerId
);

}


let current =
Number(
stats[statKey] || 0
);


let newValue =

Math.max(

0,

current + amount

);


/* Do not allow attempts below makes */

if (
statKey === "two_pt_attempted" &&
newValue < stats.two_pt_made
) {

newValue =
stats.two_pt_made;

}


if (
statKey === "three_pt_attempted" &&
newValue < stats.three_pt_made
) {

newValue =
stats.three_pt_made;

}


if (
statKey === "ft_attempted" &&
newValue < stats.ft_made
) {

newValue =
stats.ft_made;

}


stats[statKey] =
newValue;


await savePlayerStats(

playerId,

stats

);


await refreshPlayerCard(
playerId
);

}


/* =========================================
   GET PLAYER TEAM
========================================= */

function getPlayerTeam(

playerId

) {


const player =
playerObjects[playerId];


if (!player) {

return null;

}


const homeTeamName =
String(
currentGame.home_team ||
""
).trim();


const playerTeamId =
player.team_id;


/*

We compare the player's team ID
with the loaded team.

*/

return playerTeamId;

}


/* =========================================
   UPDATE TEAM SCORE DIRECTLY
========================================= */

async function updateTeamScoreDirect(

teamId,

amount

) {


if (!currentGame) return;


const homeName =
String(
currentGame.home_team ||
""
).trim();


const awayName =
String(
currentGame.away_team ||
""
).trim();


const {

data: team

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.eq(
"id",
teamId
)

.maybeSingle();


if (!team) return;


let column;


if (
team.name === homeName
) {

column =
"home_score";

}

else if (
team.name === awayName
) {

column =
"away_score";

}

else {

return;

}


const newScore =

Math.max(

0,

Number(
currentGame[column] || 0
) + amount

);


const {

data,

error

} = await supabaseClient

.from("games")

.update({

[column]:
newScore

})

.eq(
"id",
currentGame.id
)

.select()

.single();


if (!error && data) {

currentGame =
data;

refreshDisplay();

}

}


/* =========================================
   SUB IN
========================================= */

async function subIn(

playerId

) {


if (!currentGame) return;


if (
playerOnCourt[playerId]
) {

showStatus(
"Player is already on court."
);

return;

}


const team =
getPlayerTeam(
playerId
);


let teamScore;


const homeTeam =
await getTeamByName(
currentGame.home_team
);


if (
homeTeam &&
team === homeTeam.id
) {

teamScore =
Number(
currentGame.home_score || 0
);

}

else {

teamScore =
Number(
currentGame.away_score || 0
);

}


const opponentScore =

team === homeTeam?.id

?

Number(
currentGame.away_score || 0
)

:

Number(
currentGame.home_score || 0
);


playerOnCourt[playerId] =
true;


playerEntryScore[playerId] =

teamScore -
opponentScore;


playerEntryTime[playerId] =
Date.now();


await refreshPlayerCard(
playerId
);


showStatus(
"Player subbed in."
);

}


/* =========================================
   SUB OUT
========================================= */

async function subOut(

playerId

) {


if (
!playerOnCourt[playerId]
) {

showStatus(
"Player is not on court."
);

return;

}


const team =
getPlayerTeam(
playerId
);


const homeTeam =
await getTeamByName(
currentGame.home_team
);


let currentDifference;


if (
team === homeTeam?.id
) {

currentDifference =

Number(
currentGame.home_score || 0
) -

Number(
currentGame.away_score || 0
);

}

else {

currentDifference =

Number(
currentGame.away_score || 0
) -

Number(
currentGame.home_score || 0
);

}


const entryDifference =

Number(
playerEntryScore[playerId] || 0
);


const differential =

currentDifference -
entryDifference;


const stats =
playerStatsMap[playerId] ||

await getPlayerGameStats(
playerId
);


stats.plus_minus =

Number(
stats.plus_minus || 0
) +

differential;


stats.minutes_played =

Number(
stats.minutes_played || 0
) +

Math.max(

0,

Math.round(

(

Date.now() -

playerEntryTime[playerId]

) / 60000

)

);


await savePlayerStats(

playerId,

stats

);


playerOnCourt[playerId] =
false;


delete playerEntryScore[playerId];

delete playerEntryTime[playerId];


await refreshPlayerCard(
playerId
);


showStatus(
"Player subbed out."
);

}


/* =========================================
   FIND TEAM
========================================= */

async function getTeamByName(

name

) {


if (!name) return null;


const {

data

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.ilike(
"name",
String(name).trim()
)

.maybeSingle();


return data;

}


/* =========================================
   REFRESH PLAYER CARD
========================================= */

async function refreshPlayerCard(

playerId

) {


const player =
playerObjects[playerId];


if (!player) return;


const oldCard =
document.getElementById(

"player-card-" +
playerId

);


if (!oldCard) return;


const parent =
oldCard.parentElement;


const newCard =
await buildPlayerCard(
player
);


oldCard.replaceWith(
newCard
);

}

<div class="substitution-row">
