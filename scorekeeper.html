<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scorekeeper | Hoop Hub PH</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#222;
}

/* HEADER */

header{
    background:#111;
    color:white;
    padding:10px 2%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:18px;
    font-weight:bold;
    color:white;
    text-decoration:none;
}

.logo span{
    color:#ff6b00;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:12px;
    font-weight:bold;
    font-size:12px;
}

nav a:hover{
    color:#ff6b00;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:100%;
    margin:10px auto;
    padding:0 10px;
}

/* GAME SELECTOR */

.game-selector{
    background:white;
    padding:10px 15px;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

.game-selector h2{
    font-size:14px;
}

.game-selector input{
    width:100px;
    padding:5px 8px;
    border:1px solid #ddd;
    border-radius:4px;
}

.load-button{
    background:#ff6b00;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:4px;
    font-weight:bold;
    cursor:pointer;
}

/* STATUS */

#statusMessage{
    text-align:center;
    padding:7px;
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:5px;
    margin-bottom:10px;
    display:none;
    font-size:12px;
}

/* SCOREBOARD */

.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
}

.team-control{
    background:white;
    padding:10px;
    border-radius:6px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.team-control h2{
    font-size:16px;
}

.score{
    font-size:34px;
    font-weight:bold;
    color:#ff6b00;
    margin:5px 0;
}

.button-row{
    display:flex;
    justify-content:center;
    gap:4px;
}

.score-button{
    background:#111;
    color:white;
    border:none;
    padding:5px 9px;
    border-radius:4px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.score-button:hover{
    background:#ff6b00;
}

/* PLAYER STATS */

.controls{
    background:white;
    padding:10px;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.06);
    margin-bottom:10px;
}

.controls>h2{
    font-size:16px;
    text-align:center;
    margin-bottom:8px;
}

.stats-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat-control{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:6px;
    padding:7px;
    overflow-x:auto;
}

.stat-control>h2{
    text-align:center;
    font-size:13px;
    margin-bottom:7px;
    padding:4px 0;
    border-bottom:2px solid #ff6b00;
}

/* TABLE */

.stats-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    min-width:760px;
}

.stats-table th{
    background:#111;
    color:white;
    font-size:9px;
    padding:5px 2px;
    text-align:center;
    white-space:nowrap;
}

.stats-table th:first-child{
    width:28px;
}

.stats-table th:nth-child(2){
    width:125px;
    text-align:left;
}

.stats-table td{
    background:white;
    border-bottom:1px solid #ddd;
    padding:4px 2px;
    text-align:center;
    vertical-align:middle;
}

.stats-table td:nth-child(2){
    text-align:left;
}

.player-number{
    font-weight:bold;
    font-size:11px;
}

.player-name{
    font-size:10px;
    font-weight:bold;
    display:block;
}

.player-position{
    font-size:8px;
    color:#777;
}

/* STAT VALUE */

.stat-value{
    font-size:11px;
    font-weight:bold;
    color:#ff6b00;
    margin-bottom:3px;
}

/* BUTTONS */

.stat-buttons{
    display:flex;
    justify-content:center;
    gap:2px;
}

.stat-btn{
    width:18px;
    height:17px;
    border:none;
    border-radius:3px;
    background:#111;
    color:white;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.stat-btn:hover{
    background:#ff6b00;
}

.stat-btn.minus{
    background:#888;
}

.stat-btn.minus:hover{
    background:#333;
}

/* SHOOTING */

.shooting-value{
    font-size:10px;
    font-weight:bold;
    color:#ff6b00;
}

.shooting-buttons{
    display:flex;
    justify-content:center;
    gap:2px;
    margin-top:2px;
}

.shooting-buttons button{
    width:17px;
    height:16px;
    border:none;
    border-radius:3px;
    font-size:8px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

.make-btn{
    background:#111;
}

.attempt-btn{
    background:#ff6b00;
}

.minus-btn{
    background:#888;
}

.shooting-pct{
    font-size:8px;
    color:#555;
    margin-top:2px;
}

/* PLUS MINUS */

.plus-minus{
    font-size:11px;
    font-weight:bold;
}

.plus{
    color:#16803c;
}

.minus-value{
    color:#d32f2f;
}

.zero{
    color:#555;
}

/* ON COURT */

.court-button{
    border:none;
    border-radius:3px;
    padding:4px 5px;
    font-size:8px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#777;
}

.court-button.active{
    background:#16803c;
}

.court-button:hover{
    background:#ff6b00;
}

/* NO PLAYERS */

.no-players{
    text-align:center;
    color:#777;
    padding:10px;
    font-size:11px;
}

/* FOOTER */

.game-footer-controls{
    display:flex;
    gap:10px;
    justify-content:space-around;
    background:white;
    padding:8px;
    border-radius:6px;
    font-size:11px;
}

.control-button{
    background:#ff6b00;
    color:white;
    border:none;
    padding:5px 9px;
    border-radius:4px;
    font-weight:bold;
    cursor:pointer;
    font-size:10px;
}

.control-button:hover{
    background:#111;
}

/* MOBILE */

@media(max-width:768px){

    .scoreboard{
        grid-template-columns:1fr 1fr;
    }

    .stats-controls{
        grid-template-columns:1fr;
    }

    .stat-control{
        overflow-x:auto;
    }

    .game-footer-controls{
        flex-direction:column;
        align-items:center;
    }

}

</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
HOOP <span>HUB PH</span>
</a>

<nav>
<a href="index.html">Home</a>
<a href="live-game.html">Live Game</a>
</nav>

</header>

<div class="container">

<div class="game-selector">

<h2>Game ID:</h2>

<input
type="number"
id="gameId"
value="1"
>

<button
class="load-button"
onclick="loadGame()">

LOAD

</div>

<div id="statusMessage"></div>

<!-- SCOREBOARD -->

<div class="scoreboard">

<h2 id="homeTeam">
Home Team
</h2>

class="score"
id="homeScore">

0

</div>

<div class="button-row">

<button
class="score-button"
onclick="updateScore('home',1)">
+1
</button>

<button
class="score-button"
onclick="updateScore('home',2)">

</button>

<button
class="score-button"
onclick="updateScore('home',3)">

<button
class="score-button"
onclick="updateScore('home',-1)">

class="score"
id="awayScore">

0

</div>

<div class="button-row">

<button
class="score-button"
onclick="updateScore('away',1)">
+1
</button>

<button
class="score-button"
onclick="updateScore('away',2)">
+2
</button>

<button

onclick="updateScore('away',3)">

</button>

</div>

<div class="controls">

</h2>

<div class="game-footer-controls">

onclick="updateGame({status:'Live'})">

FINAL

onclick="updateGame({period:'2nd Quarter'})">
2Q
</button>

<button
class="control-button"
onclick="updateGame({period:'3rd Quarter'})">
3Q
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
GAME DATA
========================================= */

let currentGame = null;

let playerStatsMap = {};

let playerDataMap = {};

let playerOnCourt = {};


/* =========================================
ESCAPE HTML
========================================= */

function escapeHTML(str){

if(!str) return "";

return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
PERCENTAGE
========================================= */

function calculatePercentage(
made,
attempted
){

if(!attempted || attempted === 0)
return "0%";

return Math.round(
(made / attempted) * 100
) + "%";

}


/* =========================================
STATUS
========================================= */

function showStatus(message){

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.style.display =
"block";

setTimeout(
()=>{
el.style.display="none";
},
3000
);

}


/* =========================================
LOAD GAME
========================================= */

async function loadGame(){

const gameId =
Number(
document.getElementById(
"gameId"
).value
);

if(!gameId){

showStatus(
"Please enter a valid Game ID."
);

return;

}

const {
data,
error
} = await supabaseClient

.from("games")

.select("*")

.eq("id",gameId)

.single();

if(error){

console.error(error);

showStatus(
"Error loading game: " +
error.message
);

return;

}

currentGame =
data;

playerStatsMap = {};

playerDataMap = {};

playerOnCourt = {};

document.getElementById(
"homeTeam"
).textContent =
data.home_team ||
"Home Team";

document.getElementById(
"awayTeam"
).textContent =
data.away_team ||
"Away Team";

refreshDisplay();

await loadTeamPlayers();

showStatus(
"Game loaded successfully."
);

}


/* =========================================
REFRESH SCORE
========================================= */

function refreshDisplay(){

if(!currentGame)
return;

document.getElementById(
"homeScore"
).textContent =
currentGame.home_score ?? 0;

document.getElementById(
"awayScore"
).textContent =
currentGame.away_score ?? 0;

}


/* =========================================
UPDATE SCORE
========================================= */

async function updateScore(
team,
amount
){

if(!currentGame){

showStatus(
"Please load a game first."
);

return;

}

const column =
team === "home"
? "home_score"
: "away_score";

const oldHome =
Number(currentGame.home_score || 0);

const oldAway =
Number(currentGame.away_score || 0);

let newScore =
Math.max(
0,
Number(currentGame[column] || 0)
+
amount
);

const {
data,
error
} = await supabaseClient

.from("games")

.update({
[column]:newScore
})

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(error);

showStatus(
"Error updating score."
);

return;

}

currentGame =
data;

refreshDisplay();

/* UPDATE ACTIVE PLAYER +/- */

await updateActivePlayersPlusMinus(
oldHome,
oldAway,
Number(currentGame.home_score || 0),
Number(currentGame.away_score || 0)
);

}


/* =========================================
UPDATE ACTIVE PLAYERS +/- 
========================================= */

async function updateActivePlayersPlusMinus(
oldHome,
oldAway,
newHome,
newAway
){

if(!currentGame)
return;

const oldDiff =
oldHome - oldAway;

const newDiff =
newHome - newAway;

const scoreChange =
newDiff - oldDiff;

if(scoreChange === 0)
return;

for(
const playerId in playerOnCourt
){

if(!playerOnCourt[playerId])
continue;

const player =
playerDataMap[playerId];

if(!player)
continue;

const stats =
await getPlayerGameStats(
playerId
);

const newPlusMinus =
Number(
stats.plus_minus || 0
)
+
scoreChange;

await saveStatDirect(
playerId,
"plus_minus",
newPlusMinus
);

}

}


/* =========================================
UPDATE GAME
========================================= */

async function updateGame(changes){

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

const {
data,
error
} = await supabaseClient

.from("games")

.update(changes)

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(error);

showStatus(
"Error updating game."
);

return;

}

currentGame =
data;

showStatus(
"Game updated."
);

}


/* =========================================
LOAD TEAMS
========================================= */

async function loadTeamPlayers(){

if(!currentGame)
return;

const homeName =
String(
currentGame.home_team || ""
).trim();

const awayName =
String(
currentGame.away_team || ""
).trim();


const {
data:homeTeam
} =
await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
homeName
)

.maybeSingle();


if(homeTeam){

document.getElementById(
"homePlayersTitle"
).textContent =
homeTeam.name +
" Players";

await loadPlayersForTeam(
homeTeam.id,
"homePlayersList"
);

}


const {
data:awayTeam
} =
await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
awayName
)

.maybeSingle();


if(awayTeam){

document.getElementById(
"awayPlayersTitle"
).textContent =
awayTeam.name +
" Players";

await loadPlayersForTeam(
awayTeam.id,
"awayPlayersList"
);

}

}


/* =========================================
LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(
teamId,
containerId
){

const container =
document.getElementById(
containerId
);

container.innerHTML =
`<div class="no-players">
Loading players...
</div>`;

const {
data,
error
} =
await supabaseClient

.from("players")

.select("*")

.eq(
"team_id",
teamId
)

.order(
"jersey_number",
{
ascending:true
}
);

if(error){

console.error(error);

container.innerHTML =
`<div class="no-players">
Unable to load players.
</div>`;

return;

}

if(!data ||
data.length === 0){

container.innerHTML =
`<div class="no-players">
No players assigned.
</div>`;

return;

}


/* TABLE */

container.innerHTML = `

<table class="stats-table">

<thead>

<tr>

<th>#</th>

<th>PLAYER</th>

<th>MIN</th>

<th>PTS</th>

<th>OREB</th>

<th>DREB</th>

<th>AST</th>

<th>STL</th>

<th>BLK</th>

<th>TO</th>

<th>PF</th>

<th>2PT</th>

<th>3PT</th>

<th>FT</th>

<th>+/-</th>

</tr>

</thead>

<tbody id="${containerId}-tbody">

</tbody>

</table>

`;

const tbody =
document.getElementById(
containerId + "-tbody"
);

for(
const player of data
){

playerDataMap[
player.id
] =
player;

await createPlayerRow(
player,
tbody
);

}

}


/* =========================================
GET PLAYER STATS
========================================= */

async function getPlayerGameStats(
playerId
){

const defaults = {

minutes_played:0,

points:0,

offensive_rebounds:0,

defensive_rebounds:0,

assists:0,

steals:0,

blocks:0,

turnovers:0,

fouls:0,

two_pt_made:0,

two_pt_attempted:0,

three_pt_made:0,

three_pt_attempted:0,

ft_made:0,

ft_attempted:0,

plus_minus:0

};

if(!currentGame)
return defaults;

if(playerStatsMap[playerId])
return playerStatsMap[playerId];

const {
data,
error
} =
await supabaseClient

.from(
"player_game_stats"
)

.select("*")

.eq(
"game_id",
currentGame.id
)

.eq(
"player_id",
playerId
)

.maybeSingle();

if(error){

console.error(
"Stats loading error:",
error
);

}

playerStatsMap[playerId] =
data ||
{

...defaults,

player_id:
playerId,

game_id:
currentGame.id

};

return playerStatsMap[playerId];

}


/* =========================================
SAVE STAT
========================================= */

async function saveStatDirect(
playerId,
statKey,
value
){

const updateObj = {

player_id:
playerId,

game_id:
currentGame.id

};

updateObj[statKey] =
Math.max(0,Number(value || 0));

const {
data,
error
} =
await supabaseClient

.from(
"player_game_stats"
)

.upsert(

updateObj,

{
onConflict:
"player_id,game_id"
}

)

.select()
.single();

if(error){

console.error(
"Save stat error:",
error
);

return false;

}

playerStatsMap[playerId] =
{

...playerStatsMap[playerId],

...data

};

return true;

}


/* =========================================
UPDATE PLAYER STAT
========================================= */

async function updatePlayerStat(
playerId,
statKey,
amount
){

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

const stats =
await getPlayerGameStats(
playerId
);

const currentValue =
Number(
stats[statKey] || 0
);

const newValue =
Math.max(
0,
currentValue + amount
);

/* Prevent made from exceeding attempts */

if(
(statKey === "two_pt_made" &&
newValue >
Number(stats.two_pt_attempted || 0))
||
(statKey === "three_pt_made" &&
newValue >
Number(stats.three_pt_attempted || 0))
||
(statKey === "ft_made" &&
newValue >
Number(stats.ft_attempted || 0))
){

showStatus(
"Made shots cannot exceed attempts."
);

return;

}

const success =
await saveStatDirect(
playerId,
statKey,
newValue
);

if(success){

await refreshPlayerRow(
playerId
);

}

}


/* =========================================
REFRESH PLAYER ROW
========================================= */

async function refreshPlayerRow(
playerId
){

const row =
document.getElementById(
"player-row-" +
playerId
);

if(!row)
return;

const parent =
row.parentElement;

row.remove();

const player =
playerDataMap[playerId];

await createPlayerRow(
player,
parent
);

}


/* =========================================
CREATE PLAYER ROW
========================================= */

async function createPlayerRow(
player,
tbody
){

const s =
await getPlayerGameStats(
player.id
);

const row =
document.createElement("tr");

row.id =
"player-row-" +
player.id;


/* ON COURT STATUS */

const isOnCourt =
playerOnCourt[player.id] === true;


/* STAT BOX */

function statBox(
key,
value
){

return `

<div class="stat-value">
${value || 0}
</div>

<div class="stat-buttons">

<button
class="stat-btn"
onclick="updatePlayerStat(
'${player.id}',
'${key}',
1
)">
+
</button>

<button
class="stat-btn minus"
onclick="updatePlayerStat(
'${player.id}',
'${key}',
-1
)">
−
</button>

</div>

`;

}


/* SHOOTING BOX */

function shootingBox(
madeKey,
attemptKey,
made,
attempted
){

return `

<div class="shooting-value">

${made || 0}/${attempted || 0}

</div>

<div class="shooting-buttons">

<button
class="make-btn"
onclick="updatePlayerStat(
'${player.id}',
'${madeKey}',
1
)">
M+
</button>

<button
class="minus-btn"
onclick="updatePlayerStat(
'${player.id}',
'${madeKey}',
-1
)">
M−
</button>

<button
class="attempt-btn"
onclick="updatePlayerStat(
'${player.id}',
'${attemptKey}',
1
)">
A+
</button>

<button

/* =========================================
TOGGLE PLAYER ON COURT
========================================= */

async function togglePlayerCourt(
playerId
){

if(!currentGame)
return;

const isCurrentlyOn =
playerOnCourt[playerId] === true;

if(!isCurrentlyOn){

/* PLAYER ENTERS */

playerOnCourt[playerId] =
true;

showStatus(
"Player is now ON COURT."
);

}else{

/* PLAYER LEAVES */

playerOnCourt[playerId] =
false;

showStatus(
"Player SUBBED OUT."
);

}

await refreshPlayerRow(
playerId
);

}
