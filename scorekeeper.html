<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scorekeeper | Hoop Hub PH</title>

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================
   BODY
========================================= */

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}


/* =========================================
   HEADER
========================================= */

header {
    background: #111;
    color: white;
    padding: 10px 2%;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 18px;
    font-weight: bold;
    color: white;
    text-decoration: none;
}

.logo span {
    color: #ff6b00;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 12px;
    font-weight: bold;
    font-size: 12px;
}

nav a:hover {
    color: #ff6b00;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    width: 100%;
    max-width: 100%;
    margin: 10px auto;
    padding: 0 10px;
}


/* =========================================
   GAME SELECTOR
========================================= */

.game-selector {
    background: white;
    padding: 10px 15px;
    border-radius: 6px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.06);

    margin-bottom: 10px;

    display: flex;
    align-items: center;
    gap: 10px;
}

.game-selector h2 {
    font-size: 14px;
    white-space: nowrap;
}

.game-selector input {
    width: 100px;

    padding: 5px 8px;

    border: 1px solid #ddd;
    border-radius: 4px;

    font-size: 13px;
}

.load-button {
    background: #ff6b00;
    color: white;

    border: none;

    padding: 6px 12px;

    border-radius: 4px;

    font-weight: bold;

    cursor: pointer;

    font-size: 12px;
}

.load-button:hover {
    background: #111;
}


/* =========================================
   STATUS MESSAGE
========================================= */

#statusMessage {
    text-align: center;

    padding: 7px;

    background: #e8f5e9;

    color: #2e7d32;

    border-radius: 5px;

    margin-bottom: 10px;

    display: none;

    font-size: 12px;
}


/* =========================================
   SCOREBOARD
========================================= */

.scoreboard {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 10px;
}

.team-control {
    background: white;

    padding: 10px;

    border-radius: 6px;

    text-align: center;

    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.team-control h2 {
    font-size: 16px;

    margin-bottom: 2px;
}

.score {
    font-size: 34px;

    font-weight: bold;

    color: #ff6b00;

    margin-bottom: 5px;
}

.button-row {
    display: flex;

    justify-content: center;

    gap: 4px;
}

.score-button {
    background: #111;

    color: white;

    border: none;

    padding: 5px 9px;

    border-radius: 4px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;
}

.score-button:hover {
    background: #ff6b00;
}


/* =========================================
   PLAYER STATS MAIN BOX
========================================= */

.controls {
    background: white;

    padding: 10px;

    border-radius: 6px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.06);

    margin-bottom: 10px;
}

.controls > h2 {
    font-size: 16px;

    text-align: center;

    margin-bottom: 8px;
}


/* =========================================
   HOME / AWAY TEAM BOXES
========================================= */

.stats-controls {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.stat-control {
    background: #fafafa;

    border: 1px solid #ddd;

    padding: 7px;

    border-radius: 6px;

    overflow: hidden;
}

.stat-control > h2 {
    text-align: center;

    font-size: 13px;

    margin-bottom: 7px;

    background: #fafafa;

    padding: 5px 0;

    border-bottom: 2px solid #ff6b00;
}


/* =========================================
   TABLE SCROLL CONTAINER
========================================= */

.table-wrapper {
    width: 100%;

    overflow-x: auto;

    overflow-y: visible;

    -webkit-overflow-scrolling: touch;
}


/* =========================================
   PLAYER TABLE
========================================= */

.player-table {
    width: 100%;

    min-width: 1100px;

    border-collapse: collapse;

    table-layout: fixed;

    font-size: 10px;
}


/* =========================================
   TABLE HEADER
========================================= */

.player-table thead th {
    background: #111;

    color: white;

    font-weight: bold;

    text-align: center;

    padding: 5px 2px;

    border-right: 1px solid #444;

    white-space: nowrap;

    position: sticky;

    top: 0;

    z-index: 2;
}


/* =========================================
   PLAYER ROW
========================================= */

.player-table tbody tr {
    background: white;

    border-bottom: 1px solid #ddd;
}

.player-table tbody tr:hover {
    background: #fff8f5;
}


/* =========================================
   TABLE CELLS
========================================= */

.player-table td {
    text-align: center;

    padding: 4px 2px;

    border-right: 1px solid #eee;

    vertical-align: middle;
}


/* =========================================
   COLUMN WIDTHS
========================================= */

.col-number {
    width: 35px;
}

.col-player {
    width: 130px;

    text-align: left !important;

    padding-left: 6px !important;
}

.col-stat {
    width: 58px;
}

.col-shooting {
    width: 80px;
}

.col-plus-minus {
    width: 65px;
}


/* =========================================
   PLAYER NAME
========================================= */

.player-name-cell {
    font-weight: bold;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.player-position {
    display: block;

    font-size: 8px;

    color: #777;

    font-weight: normal;
}


/* =========================================
   JERSEY NUMBER
========================================= */

.jersey-number {
    background: #111;

    color: white;

    border-radius: 3px;

    padding: 3px 5px;

    font-weight: bold;

    display: inline-block;

    min-width: 24px;
}


/* =========================================
   STAT VALUE
========================================= */

.stat-value {
    font-size: 12px;

    font-weight: bold;

    color: #ff6b00;

    display: block;

    margin-bottom: 3px;
}


/* =========================================
   STAT BUTTONS
========================================= */

.stat-buttons {
    display: flex;

    justify-content: center;

    gap: 2px;
}

.stat-btn {
    width: 20px;

    height: 18px;

    border: none;

    border-radius: 3px;

    background: #111;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 10px;

    line-height: 18px;

    padding: 0;
}

.stat-btn:hover {
    background: #ff6b00;
}

.stat-btn.minus {
    background: #888;
}

.stat-btn.minus:hover {
    background: #333;
}


/* =========================================
   REBOUND TOTAL
========================================= */

.rebound-total {
    color: #555;

    font-size: 10px;

    font-weight: bold;

    display: block;

    margin-top: 2px;
}


/* =========================================
   SHOOTING STAT
========================================= */

.shooting-value {
    font-size: 11px;

    font-weight: bold;

    color: #222;

    margin-bottom: 3px;

    white-space: nowrap;
}

.shooting-label {
    font-size: 8px;

    color: #ff6b00;

    font-weight: bold;

    margin-bottom: 3px;
}

.shooting-buttons {
    display: flex;

    justify-content: center;

    gap: 2px;

    margin-bottom: 2px;
}

.shooting-btn {
    width: 20px;

    height: 18px;

    border: none;

    border-radius: 3px;

    background: #111;

    color: white;

    font-size: 9px;

    font-weight: bold;

    cursor: pointer;

    padding: 0;
}

.shooting-btn:hover {
    background: #ff6b00;
}

.shooting-btn.attempt {
    background: #ff6b00;
}

.shooting-btn.attempt:hover {
    background: #111;
}

.shooting-btn.minus {
    background: #888;
}


/* =========================================
   SHOOTING PERCENTAGE
========================================= */

.shooting-percentage {
    font-size: 8px;

    color: #ff6b00;

    font-weight: bold;
}


/* =========================================
   PLUS / MINUS
========================================= */

.plus-minus-value {
    font-size: 12px;

    font-weight: bold;

    color: #ff6b00;

    margin-bottom: 3px;
}


/* =========================================
   NO PLAYERS
========================================= */

.no-players {
    text-align: center;

    color: #777;

    padding: 15px;

    font-size: 11px;
}


/* =========================================
   GAME FOOTER
========================================= */

.game-footer-controls {
    display: flex;

    gap: 10px;

    justify-content: space-around;

    background: white;

    padding: 8px;

    border-radius: 6px;

    font-size: 11px;
}

.control-button {
    background: #ff6b00;

    color: white;

    border: none;

    padding: 5px 9px;

    border-radius: 4px;

    font-weight: bold;

    cursor: pointer;

    font-size: 10px;
}

.control-button:hover {
    background: #111;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    header {
        flex-direction: column;

        gap: 8px;
    }

    nav a {
        margin: 0 5px;

        font-size: 10px;
    }

    .scoreboard {
        grid-template-columns: 1fr 1fr;
    }

    .stats-controls {
        grid-template-columns: 1fr;
    }

    .stat-control {
        width: 100%;
    }

    .player-table {
        min-width: 1100px;
    }

    .game-footer-controls {
        flex-direction: column;

        align-items: center;
    }

}

</style>

</head>

<!-- =========================================

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   GLOBAL DATA
========================================= */

let currentGame = null;

let playerStatsMap = {};

let playerDataMap = {};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str) {

if (str === null || str === undefined) {
return "";
}

return String(str)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
   PERCENTAGE
========================================= */

function calculatePercentage(
made,
attempted
) {

made = Number(made || 0);

attempted = Number(attempted || 0);

if (attempted === 0) {
return "0%";
}

return Math.round(
(made / attempted) * 100
) + "%";

}


/* =========================================
   STATUS
========================================= */

function showStatus(message) {

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.style.display =
"block";

setTimeout(() => {

el.style.display =
"none";

}, 3000);

}


/* =========================================
   LOAD GAME
========================================= */

async function loadGame() {

const gameId =
Number(
document.getElementById(
"gameId"
).value
);


if (!gameId) {

showStatus(
"Please enter a valid Game ID."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.select("*")

.eq(
"id",
gameId
)

.single();


if (error) {

console.error(
"Game loading error:",
error
);

showStatus(
"Error loading game: " +
error.message
);

return;

}


currentGame =
data;


document.getElementById(
"homeTeam"
).textContent =
data.home_team ||
"Home Team";


document.getElementById(
"awayTeam"
).textContent =
data.away_team ||
"Away Team";


playerStatsMap = {};

playerDataMap = {};


refreshDisplay();


await loadTeamPlayers();


showStatus(
"Game loaded successfully."
);

}


/* =========================================
   REFRESH SCORE
========================================= */

function refreshDisplay() {

if (!currentGame)
return;


document.getElementById(
"homeScore"
).textContent =
currentGame.home_score ?? 0;


document.getElementById(
"awayScore"
).textContent =
currentGame.away_score ?? 0;

}


/* =========================================
   UPDATE SCORE
========================================= */

async function updateScore(
team,
amount
) {

if (!currentGame) {

showStatus(
"Please load a game first."
);

return;

}


const column =
team === "home"
? "home_score"
: "away_score";


const newScore = Math.max(

0,

Number(
currentGame[column] || 0
) + amount

);


const {

data,

error

} = await supabaseClient

.from("games")

.update({

[column]:
newScore

})

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

console.error(
"Score update error:",
error
);

showStatus(
"Unable to update score: " +
error.message
);

return;

}


currentGame =
data;


refreshDisplay();

}


/* =========================================
   UPDATE GAME
========================================= */

async function updateGame(
changes
) {

if (!currentGame) {

showStatus(
"Load a game first."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.update(changes)

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

console.error(
"Game update error:",
error
);

showStatus(
"Unable to update game."
);

return;

}


currentGame =
data;


refreshDisplay();


showStatus(
"Game updated."
);

}


/* =========================================
   LOAD TEAMS
========================================= */

async function loadTeamPlayers() {

if (!currentGame)
return;


const homeName =
String(
currentGame.home_team || ""
).trim();


const awayName =
String(
currentGame.away_team || ""
).trim();


/* =========================================
   HOME TEAM
========================================= */

const {

data: homeTeam,

error: homeError

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.ilike(
"name",
homeName
)

.maybeSingle();


if (homeError) {

console.error(
"Home team error:",
homeError
);

}


if (homeTeam) {

document.getElementById(
"homePlayersTitle"
).textContent =
homeTeam.name +
" Players";


await loadPlayersForTeam(

homeTeam.id,

"homePlayersList"

);

}

else {

document.getElementById(
"homePlayersList"
).innerHTML =

`<div class="no-players">
Team not found: ${escapeHTML(homeName)}
</div>`;

}


/* =========================================
   AWAY TEAM
========================================= */

const {

data: awayTeam,

error: awayError

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.ilike(
"name",
awayName
)

.maybeSingle();


if (awayError) {

console.error(
"Away team error:",
awayError
);

}


if (awayTeam) {

document.getElementById(
"awayPlayersTitle"
).textContent =
awayTeam.name +
" Players";


await loadPlayersForTeam(

awayTeam.id,

"awayPlayersList"

);

}

else {

document.getElementById(
"awayPlayersList"
).innerHTML =

`<div class="no-players">
Team not found: ${escapeHTML(awayName)}
</div>`;

}

}


/* =========================================
   LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(

teamId,

containerId

) {

const container =
document.getElementById(
containerId
);


container.innerHTML =

`<div class="no-players">
Loading players...
</div>`;


const {

data,

error

} = await supabaseClient

.from("players")

.select("*")

.eq(
"team_id",
teamId
)

.order(

"jersey_number",

{

ascending:
true

}

);


if (error) {

console.error(
"Player loading error:",
error
);

container.innerHTML =

`<div class="no-players">
Unable to load players.
</div>`;

return;

}


if (!data ||
data.length === 0) {

container.innerHTML =

`<div class="no-players">
No players assigned.
</div>`;

return;

}


container.innerHTML = "";


for (
const player
of data
) {

playerDataMap[
player.id
] =
player;

}


await createPlayerTable(

data,

container

);

}


/* =========================================
   GET PLAYER GAME STATS
========================================= */

async function getPlayerGameStats(
playerId
) {

const defaults = {

minutes_played: 0,

points: 0,

offensive_rebounds: 0,

defensive_rebounds: 0,

assists: 0,

steals: 0,

blocks: 0,

turnovers: 0,

fouls: 0,

two_pt_made: 0,

two_pt_attempted: 0,

three_pt_made: 0,

three_pt_attempted: 0,

ft_made: 0,

ft_attempted: 0,

plus_minus: 0

};


if (!currentGame) {

return {

...defaults,

player_id:
playerId

};

}


const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.select("*")

.eq(
"game_id",
currentGame.id
)

.eq(
"player_id",
playerId
)

.maybeSingle();


if (error) {

console.error(
"Stats loading error:",
error
);

}


const stats = {

...defaults,

...(data || {}),

player_id:
playerId,

game_id:
currentGame.id

};


playerStatsMap[
playerId
] =
stats;


return stats;

}


/* =========================================
   UPDATE PLAYER STAT
========================================= */

async function updatePlayerStat(

playerId,

statKey,

amount

) {

if (!currentGame) {

showStatus(
"Please load a game first."
);

return;

}


const stats =
await getPlayerGameStats(
playerId
);


let currentValue =
Number(
stats[statKey] || 0
);


let newValue =
currentValue +
amount;


/*
   Prevent negative values for normal stats.

   +/- is allowed to be negative.
*/

if (
statKey !== "plus_minus"
) {

newValue =
Math.max(
0,
newValue
);

}


/*
   Prevent made shots from being
   greater than attempted shots.

   This applies only when decreasing attempts.
*/

if (
statKey === "two_pt_attempted" &&
newValue <
Number(stats.two_pt_made || 0)
) {

showStatus(
"2PT attempts cannot be lower than 2PT made."
);

return;

}


if (
statKey === "three_pt_attempted" &&
newValue <
Number(stats.three_pt_made || 0)
) {

showStatus(
"3PT attempts cannot be lower than 3PT made."
);

return;

}


if (
statKey === "ft_attempted" &&
newValue <
Number(stats.ft_made || 0)
) {

showStatus(
"FT attempts cannot be lower than FT made."
);

return;

}


/*
   Keep plus/minus as a
   positive or negative value.
*/

const updateObj = {

player_id:
playerId,

game_id:
currentGame.id

};


updateObj[
statKey
] =
newValue;


/*
   UPSERT

   This automatically creates the row
   if it does not exist.

   Otherwise it updates the existing row.
*/

const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.upsert(

updateObj,

{

onConflict:
"player_id,game_id"

}

)

.select()

.single();


if (error) {

console.error(
"Player stats update error:",
error
);

showStatus(
"Unable to update stats: " +
error.message
);

return;

}


/*
   Update local stats
*/

playerStatsMap[
playerId
] = {

...stats,

...data

};


/*
   Refresh only the player's row
*/

await refreshPlayerRow(
playerId
);

}


/* =========================================
   REFRESH PLAYER ROW
========================================= */

async function refreshPlayerRow(
playerId
) {

const player =
playerDataMap[
playerId
];


if (!player)
return;


const oldRow =
document.getElementById(
`player-row-${playerId}`
);


if (!oldRow)
return;


const parent =
oldRow.parentElement;


const newRow =
await createPlayerRow(
player
);


oldRow.replaceWith(
newRow
);

}

/* =========================================
   CREATE PLAYER ROW
========================================= */

async function createPlayerRow(
player
) {

const s =
await getPlayerGameStats(
player.id
);


const row =
document.createElement(
"tr"
);


row.id =
`player-row-${player.id}`;


/*
   TOTAL REBOUNDS
*/

const totalRebounds =

Number(
s.offensive_rebounds || 0
)

+

Number(
s.defensive_rebounds || 0
);


/*
   PLAYER NAME
*/

const playerName =

`${escapeHTML(
player.first_name || ""
)} ${escapeHTML(
player.last_name || ""
)}`;


/*
   CREATE ROW
*/

row.innerHTML = `


<!-- JERSEY -->

<td>

<span class="jersey-number">

${escapeHTML(
String(
player.jersey_number || ""
)
)}

</span>

</td>



<!-- PLAYER -->

<td class="col-player">

<div class="player-name-cell">

${playerName}

</div>

<span class="player-position">

${escapeHTML(
player.position || "N/A"
)}

</span>

</td>



<!-- MINUTES -->

<td>

${createNormalStat(

s.minutes_played,

player.id,

"minutes_played"

)}

</td>



<!-- POINTS -->

<td>

${createNormalStat(

s.points,

player.id,

"points"

)}

</td>



<!-- OFFENSIVE REBOUND -->

<td>

${createNormalStat(

s.offensive_rebounds,

player.id,

"offensive_rebounds"

)}

</td>



<!-- DEFENSIVE REBOUND -->

<td>

${createNormalStat(

s.defensive_rebounds,

player.id,

"defensive_rebounds"

)}

</td>



<!-- TOTAL REBOUND -->

<td>

<span class="stat-value">

${totalRebounds}

</span>

<span class="rebound-total">

OREB+DREB

</span>

</td>



<!-- ASSISTS -->

<td>

${createNormalStat(

s.assists,

player.id,

"assists"

)}

</td>



<!-- STEALS -->

<td>

${createNormalStat(

s.steals,

player.id,

"steals"

)}

</td>



<!-- BLOCKS -->

<td>

${createNormalStat(

s.blocks,

player.id,

"blocks"

)}

</td>



<!-- TURNOVERS -->

<td>

${createNormalStat(

s.turnovers,

player.id,

"turnovers"

)}

</td>



<!-- FOULS -->

<td>

${createNormalStat(

s.fouls,

player.id,

"fouls"

)}

</td>

${createShootingStat(

s.two_pt_made,

s.two_pt_attempted,

player.id,

"two_pt_made",

"two_pt_attempted"

)}

</td>

<td>

${createShootingStat(

s.three_pt_made,

s.three_pt_attempted,

player.id,

"three_pt_made",

"three_pt_attempted"

)}

</td>



<!-- FT -->

<td>

${createShootingStat(

s.ft_attempted,

player.id,

"ft_made",

"ft_attempted"

)}

</td>



<!-- PLUS MINUS -->

<td>

${createPlusMinusStat(

s.plus_minus,

)}

</td>


`;


return row;

}


/* =========================================
   NORMAL STAT CONTROL
========================================= */

function createNormalStat(

value,

playerId,

statKey

) {

return `

<span class="stat-value">

${Number(value || 0)}

</span>


<div class="stat-buttons">

<button

class="stat-btn"

onclick="updatePlayerStat(

'${playerId}',

'${statKey}',

1

)"

>

+

</button>


<button

class="stat-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'${statKey}',

-1

)"

>

−

</button>

</div>

`;

}


/* =========================================
   SHOOTING STAT CONTROL
========================================= */

function createShootingStat(

made,

attempted,

playerId,

madeKey,

attemptedKey

) {

made =
Number(made || 0);

attempted =
Number(attempted || 0);


return `

<div class="shooting-value">

${made}/${attempted}

</div>


<div class="shooting-label">

${calculatePercentage(
made,
attempted
)}

</div>


<div class="shooting-buttons">


<!-- MADE + -->

<button

class="shooting-btn"

onclick="updatePlayerStat(

'${playerId}',

'${madeKey}',

1

)"

>

M+

</button>


<!-- MADE - -->

<button

class="shooting-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'${madeKey}',

-1

)"

>

M−

</button>


</div>


<div class="shooting-buttons">


<!-- ATTEMPT + -->

<button

class="shooting-btn attempt"

onclick="updatePlayerStat(

'${playerId}',

'${attemptedKey}',

1

)"

>

A+

</button>


<!-- ATTEMPT - -->

<button

class="shooting-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'${attemptedKey}',

-1

)"

>

A−

</button>


</div>

`;

}


/* =========================================
   PLUS / MINUS CONTROL
========================================= */

function createPlusMinusStat(

value,

playerId

) {

value =
Number(value || 0);


let displayValue =
value > 0
? "+" + value
: value;


return `

<div class="plus-minus-value">

${displayValue}

</div>


<div class="stat-buttons">

<button

class="stat-btn"

onclick="updatePlayerStat(

'${playerId}',

'plus_minus',

1

)"

>

+

</button>


<button

class="stat-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'plus_minus',

-1

)"

>

−

</button>

</div>

`;

}
