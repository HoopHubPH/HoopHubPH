body{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
GLOBAL VARIABLES
========================================= */

let currentGame = null;

let playerStatsMap = {};

let playerDataMap = {};

let playerTeamMap = {};

let playerOnCourt = {};

let clockSeconds = 600;

let clockInterval = null;

let clockRunning = false;


/*
NEW CLOCK PERSISTENCE VARIABLES

clock_started_at stores the exact time
when the running clock was last started.

The value is saved in Supabase.
*/

let clockStartedAt = null;

let lastClockSave = 0;


/* =========================================
ESCAPE HTML
========================================= */

function escapeHTML(str){

if(!str) return "";

return String(str)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
PERCENTAGE
========================================= */

function calculatePercentage(
made,
attempted
){

if(!attempted || attempted <= 0)
return "0%";

return Math.round(
(Number(made)/Number(attempted))*100
)+"%";

}


/* =========================================
STATUS
========================================= */

function showStatus(message){

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.style.display =
"block";

setTimeout(()=>{

el.style.display =
"none";

},3000);

}


/* =========================================
CLOCK PERSISTENCE
========================================= */


/*
SAVE CURRENT CLOCK STATE

If the clock is running, we save:

clock_seconds
clock_running = true
clock_started_at = current timestamp

If paused, we save:

clock_seconds
clock_running = false
clock_started_at = null
*/

async function saveClockState(){

if(!currentGame)
return;

const updateData = {

clock_seconds:
Math.max(
0,
Math.floor(clockSeconds)
),

clock_running:
clockRunning,

clock_started_at:
clockRunning
? new Date().toISOString()
: null

};

const {

data,
error

} = await supabaseClient

.from("games")

.update(updateData)

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(
"Clock save error:",
error
);

return;

}

currentGame =
data;

clockStartedAt =
data.clock_started_at;

lastClockSave =
Date.now();

}


/*
SAVE CLOCK WITHOUT RESETTING
THE START TIMESTAMP

This function is used while the clock
is running.

It saves the current remaining time
and creates a new starting timestamp
for the remaining clock.

This keeps the clock accurate after
a page refresh.
*/

async function saveRunningClock(){

if(!currentGame ||
!clockRunning)
return;

const now =
Date.now();

const elapsed =
clockStartedAt
? Math.floor(
(now -
new Date(clockStartedAt).getTime())
/ 1000
)
: 0;

const calculatedSeconds =
Math.max(
0,
clockSeconds -
elapsed
);

clockSeconds =
calculatedSeconds;

clockStartedAt =
new Date().toISOString();

const {

data,
error

} = await supabaseClient

.from("games")

.update({

clock_seconds:
clockSeconds,

clock_running:
true,

clock_started_at:
clockStartedAt

})

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(
"Running clock save error:",
error
);

return;

}

currentGame =
data;

lastClockSave =
Date.now();

}


/*
LOAD SAVED CLOCK

If the saved clock was paused,
we use the saved clock_seconds.

If the saved clock was running,
we calculate the number of seconds
that passed since clock_started_at.

Example:

Saved:
9:09
clock_started_at:
10:00:00

Refresh:
10:00:15

Result:
8:54
*/

function loadSavedClock(){

if(!currentGame){

clockSeconds =
600;

clockRunning =
false;

clockStartedAt =
null;

updateClockDisplay();

return;

}

const savedSeconds =
Number(
currentGame.clock_seconds
);

if(
Number.isFinite(savedSeconds)
){

clockSeconds =
Math.max(
0,
Math.floor(savedSeconds)
);

}
else{

clockSeconds =
600;

}


clockRunning =
currentGame.clock_running === true;


clockStartedAt =
currentGame.clock_started_at ||
null;


/*
CLOCK WAS RUNNING BEFORE REFRESH
*/

if(
clockRunning &&
clockStartedAt
){

const startedTime =
new Date(
clockStartedAt
).getTime();

const now =
Date.now();

const elapsed =
Math.floor(
(now -
startedTime)
/ 1000
);

clockSeconds =
Math.max(
0,
clockSeconds -
elapsed
);

}


/*
IF TIME HAS ENDED
*/

if(
clockSeconds <= 0
){

clockSeconds =
0;

clockRunning =
false;

clockStartedAt =
null;

}


/*
IMPORTANT:

The clock is displayed immediately
using the calculated remaining time.
*/

updateClockDisplay();

}


/* =========================================
LOAD GAME
========================================= */

async function loadGame(){

const gameId =
Number(
document.getElementById(
"gameId"
).value
);

if(!gameId){

showStatus(
"Enter a valid Game ID."
);

return;

}

const {

data,

error

} = await supabaseClient

.from("games")

.select("*")

.eq("id",gameId)

.single();

if(error){

console.error(error);

showStatus(
"Error loading game: "+
error.message
);

return;

}

currentGame =
data;


/*
LOAD THE SAVED CLOCK BEFORE
LOADING THE PLAYER DATA
*/

loadSavedClock();


document.getElementById(
"homeTeam"
).textContent =
data.home_team ||
"Home Team";

document.getElementById(
"awayTeam"
).textContent =
data.away_team ||
"Away Team";

document.getElementById(
"homeScore"
).textContent =
data.home_score || 0;

document.getElementById(
"awayScore"
).textContent =
data.away_score || 0;

playerStatsMap = {};

playerDataMap = {};

playerTeamMap = {};

playerOnCourt = {};

await loadTeamPlayers();

showStatus(
"Game loaded successfully."
);

}


/* =========================================
UPDATE SCORE
========================================= */

async function updateScore(
team,
amount
){

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

const column =
team === "home"
? "home_score"
: "away_score";

const oldScore =
Number(
currentGame[column] || 0
);

const newScore =
Math.max(
0,
oldScore + amount
);

const {

data,
error

} = await supabaseClient

.from("games")

.update({

[column]:
newScore

})

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(error);

showStatus(
"Unable to update score."
);

return;

}

currentGame =
data;

document.getElementById(
team+"Score"
).textContent =
newScore;


/*
The +/- of players currently on court
is based on the score change.
*/

if(amount !== 0){

for(
const playerId in playerOnCourt
){

if(!playerOnCourt[playerId])
continue;

if(
playerTeamMap[playerId] !== team
)
continue;

const stats =
await getPlayerGameStats(
playerId
);

const currentPlusMinus =
Number(
stats.plus_minus || 0
);

await saveStatDirect(

playerId,

"plus_minus",

currentPlusMinus + amount

);

}

}

}


/* =========================================
UPDATE GAME
========================================= */

async function updateGame(
changes
){

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

const {

data,
error

} = await supabaseClient

.from("games")

.update(changes)

.eq(
"id",
currentGame.id
)

.select()
.single();

if(error){

console.error(error);

showStatus(
"Unable to update game."
);

return;

}

currentGame =
data;

showStatus(
"Game updated."
);

}


/* =========================================
LOAD TEAMS
========================================= */

async function loadTeamPlayers(){

const homeName =
String(
currentGame.home_team || ""
).trim();

const awayName =
String(
currentGame.away_team || ""
).trim();


const {

data:homeTeam

} = await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
homeName
)

.maybeSingle();


const {

data:awayTeam

} = await supabaseClient

.from("teams")

.select("id,name")

.ilike(
"name",
awayName
)

.maybeSingle();


if(homeTeam){

document.getElementById(
"homePlayersTitle"
).textContent =
homeTeam.name;

await loadPlayersForTeam(
homeTeam.id,
"homePlayersList",
"home"
);

}


if(awayTeam){

document.getElementById(
"awayPlayersTitle"
).textContent =
awayTeam.name;

await loadPlayersForTeam(
awayTeam.id,
"awayPlayersList",
"away"
);

}

}


/* =========================================
LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(

teamId,

containerId,

team

){

const container =
document.getElementById(
containerId
);

container.innerHTML =
"";

const {

data,
error

} = await supabaseClient

.from("players")

.select("*")

.eq(
"team_id",
teamId
)

.order(
"jersey_number",
{
ascending:true
}
);

if(error){

console.error(error);

container.innerHTML =
"<div class='no-players'>Unable to load players.</div>";

return;

}

if(!data || !data.length){

container.innerHTML =
"<div class='no-players'>No players assigned.</div>";

return;

}


/*
CREATE TABLE
*/

const table =
document.createElement(
"table"
);

table.className =
"player-table";


table.innerHTML = `

<thead>

<tr>

<th class="col-number">#</th>

<th class="col-player">PLAYER</th>

<th class="col-min">MIN</th>

<th class="col-stat">PTS</th>

<th class="col-stat">OREB</th>

<th class="col-stat">DREB</th>

<th class="col-stat">REB</th>

<th class="col-stat">AST</th>

<th class="col-stat">STL</th>

<th class="col-stat">BLK</th>

<th class="col-stat">TO</th>

<th class="col-stat">PF</th>

<th class="col-shot">2PT</th>

<th class="col-shot">3PT</th>

<th class="col-shot">FT</th>

<th class="col-plusminus">+/-</th>

</tr>

</thead>

<tbody></tbody>

`;


container.appendChild(
table
);

const tbody =
table.querySelector(
"tbody"
);


/*
Players are created once in fixed order.
Updating stats only changes cell contents.
*/

for(
const player of data
){

playerDataMap[player.id] =
player;

playerTeamMap[player.id] =
team;

if(
playerOnCourt[player.id] === undefined
){

playerOnCourt[player.id] =
false;

}

const row =
document.createElement(
"tr"
);

row.id =
"player-row-"+player.id;

tbody.appendChild(row);

await renderPlayerRow(
player,
row
);

}

}


/* =========================================
GET PLAYER STATS
========================================= */

async function getPlayerGameStats(
playerId
){

const defaults = {

points:0,

minutes_played:0,

offensive_rebounds:0,

defensive_rebounds:0,

rebounds:0,

assists:0,

steals:0,

blocks:0,

turnovers:0,

fouls:0,

two_pt_made:0,

two_pt_attempted:0,

three_pt_made:0,

three_pt_attempted:0,

ft_made:0,

ft_attempted:0,

plus_minus:0

};

if(
playerStatsMap[playerId]
){

return playerStatsMap[playerId];

}


if(!currentGame)
return defaults;


const {

data,
error

} = await supabaseClient

.from(
"player_game_stats"
)

.select("*")

.eq(
"game_id",
currentGame.id
)

.eq(
"player_id",
playerId
)

.maybeSingle();


if(error){

console.error(
"Stats error:",
error
);

}


playerStatsMap[playerId] = {

...defaults,

...(data || {})

};

return playerStatsMap[playerId];

}


/* =========================================
SAVE ONE STAT
========================================= */

async function saveStatDirect(

playerId,

statKey,

value

){

if(!currentGame)
return;

const stats =
await getPlayerGameStats(
playerId
);

const updateObj = {

player_id:
playerId,

game_id:
currentGame.id

};

updateObj[statKey] =
Math.max(
0,
Number(value || 0)
);


/*
REB IS AUTOMATIC
*/

if(
statKey ===
"offensive_rebounds"
||
statKey ===
"defensive_rebounds"
){

const oreb =
statKey ===
"offensive_rebounds"
? Number(value)
: Number(
stats.offensive_rebounds || 0
);

const dreb =
statKey ===
"defensive_rebounds"
? Number(value)
: Number(
stats.defensive_rebounds || 0
);

updateObj.rebounds =
Math.max(
0,
oreb + dreb
);

}


const {

data,
error

} = await supabaseClient

.from(
"player_game_stats"
)

.upsert(

updateObj,

{

onConflict:
"player_id,game_id"

}

)

.select()
.single();


if(error){

console.error(
error
);

showStatus(
"Unable to save player stats: "+
error.message
);

return;

}


playerStatsMap[playerId] = {

...stats,

...data

};

}


/* =========================================
UPDATE STAT
========================================= */

async function updatePlayerStat(

playerId,

statKey,

amount

){

const stats =
await getPlayerGameStats(
playerId
);

const currentValue =
Number(
stats[statKey] || 0
);

const newValue =
Math.max(
0,
currentValue + amount
);


/*
PTS IS NOT MANUALLY EDITABLE
*/

if(statKey === "points"){

return;

}


/*
MINUTES ARE NOT MANUALLY EDITABLE
*/

if(statKey === "minutes_played"){

return;

}


/*
PLUS MINUS IS NOT MANUALLY EDITABLE
*/

if(statKey === "plus_minus"){

return;

}


/*
MADE SHOTS

2PT MADE = +2 POINTS
3PT MADE = +3 POINTS
FT MADE = +1 POINT
*/

if(
statKey === "two_pt_made"
||
statKey === "three_pt_made"
||
statKey === "ft_made"
){

const pointsToAdd =
statKey === "two_pt_made"
? 2
: statKey === "three_pt_made"
? 3
: 1;


/*
When subtracting a made shot,
subtract the corresponding points.
*/

const newPoints =
Math.max(
0,
Number(stats.points || 0)
+
(amount * pointsToAdd)
);


await saveStatDirect(
playerId,
statKey,
newValue
);

await saveStatDirect(
playerId,
"points",
newPoints
);

await refreshPlayerRow(
playerId
);

return;

}


await saveStatDirect(

playerId,

statKey,

newValue

);


/*
REFRESH ONLY THE ROW
*/

await refreshPlayerRow(
playerId
);

}

/* =========================================
FORMAT MINUTES
========================================= */

function formatMinutes(
seconds
){

const totalSeconds =
Number(seconds || 0);

const minutes =
Math.floor(
totalSeconds / 60
);

const secs =
totalSeconds % 60;

return (

minutes+

":"+

String(secs)
.padStart(2,"0")

);

}


/* =========================================
SUBSTITUTION
========================================= */

async function toggleSubstitution(
playerId
){

if(!currentGame)
return;

const team =
playerTeamMap[playerId];

const currentlyOn =
playerOnCourt[playerId];


/*
SUB OUT
*/

if(currentlyOn){

playerOnCourt[playerId] =
false;

await refreshPlayerRow(
playerId
);

showStatus(
"Player SUB OUT."
);

return;

}


/*
COUNT PLAYERS ON COURT
*/

const activePlayers =
Object.keys(
playerOnCourt
).filter(

id =>

playerOnCourt[id] === true
&&
playerTeamMap[id] === team

).length;


/*
MAX 5
*/

if(activePlayers >= 5){

showStatus(
"Maximum 5 players can be on court."
);

return;

}


/*
SUB IN
*/

playerOnCourt[playerId] =
true;

await refreshPlayerRow(
playerId
);

showStatus(
"Player SUB IN."
);

}

/* =========================================
START CLOCK
========================================= */

async function startClock(){

if(clockRunning)
return;

if(!currentGame){

showStatus(
"Load a game first."
);

return;

}

if(clockSeconds <= 0){

showStatus(
"Clock is at 0:00. Reset the clock first."
);

return;

}


/*
START CLOCK PERSISTENTLY

The current clock value is saved
together with the exact timestamp.
*/

clockRunning =
true;

clockStartedAt =
new Date().toISOString();


const {

data,
error

} = await supabaseClient

.from("games")

.update({

clock_seconds:
clockSeconds,

clock_running:
true,

clock_started_at:
clockStartedAt

})

.eq(
"id",
currentGame.id
)

.select()
.single();


if(error){

console.error(
"Unable to start clock:",
error
);

clockRunning =
false;

clockStartedAt =
null;

showStatus(
"Unable to start game clock."
);

return;

}


currentGame =
data;

lastClockSave =
Date.now();


/*
LOCAL DISPLAY TIMER

The database timestamp remains
the source of truth after refresh.
*/

clockInterval =
setInterval(

async()=>{

if(!clockRunning)
return;


/*
Calculate elapsed time from the
last saved clock start timestamp.
*/

const elapsed =
Math.floor(

(
Date.now()
-
new Date(
clockStartedAt
).getTime()

)
/1000

);


/*
Calculate current clock.

This prevents the clock from
being affected by page refresh.
*/

const currentSeconds =
Math.max(

0,

Number(
currentGame.clock_seconds
)

-

elapsed

);


clockSeconds =
currentSeconds;

updateClockDisplay();


/*
When the clock reaches 0,
stop and save it.
*/

if(
clockSeconds <= 0
){

clockSeconds =
0;

clockRunning =
false;

clearInterval(
clockInterval
);

clockInterval =
null;

clockStartedAt =
null;


await supabaseClient

.from("games")

.update({

clock_seconds:
0,

clock_running:
false,

clock_started_at:
null

})

.eq(
"id",
currentGame.id
);

return;

}


/*
Save the running clock periodically.

This prevents the database from
falling too far behind if the page
is refreshed while the game is running.

Every 10 seconds, we save the
current remaining clock and create
a fresh timestamp.
*/

if(
Date.now() -
lastClockSave
>=
10000
){

await saveRunningClock();

}

},

250

);

}


/* =========================================
PAUSE CLOCK
========================================= */

async function pauseClock(){

if(!currentGame)
return;


/*
Calculate exact remaining time
before pausing.
*/

if(clockRunning &&
clockStartedAt){

const elapsed =
Math.floor(

(
Date.now()
-
new Date(
clockStartedAt
).getTime()

)
/1000

);

clockSeconds =
Math.max(

0,

Number(
currentGame.clock_seconds
)

-

elapsed

);

}


clockRunning =
false;

clockStartedAt =
null;


if(clockInterval){

clearInterval(
clockInterval
);

clockInterval =
null;

}


updateClockDisplay();


/*
SAVE PAUSED CLOCK

The exact remaining time is stored.
*/

const {

data,
error

} = await supabaseClient

.from("games")

.update({

clock_seconds:
clockSeconds,

clock_running:
false,

clock_started_at:
null

})

.eq(
"id",
currentGame.id
)

.select()
.single();


if(error){

console.error(
"Unable to pause clock:",
error
);

return;

}


currentGame =
data;

}


/* =========================================
RESET CLOCK
========================================= */

async function resetClock(){

if(!currentGame){

clockSeconds =
600;

clockRunning =
false;

clockStartedAt =
null;

updateClockDisplay();

return;

}


await pauseClock();


clockSeconds =
600;

clockRunning =
false;

clockStartedAt =
null;

updateClockDisplay();


/*
SAVE RESET CLOCK
*/

const {

data,
error

} = await supabaseClient

.from("games")

.update({

clock_seconds:
600,

clock_running:
false,

clock_started_at:
null

})

.eq(
"id",
currentGame.id
)

.select()
.single();


if(error){

console.error(
"Unable to reset clock:",
error
);

showStatus(
"Unable to reset clock."
);

return;

}


currentGame =
data;

showStatus(
"Clock reset to 10:00."
);

}


/* =========================================
SET PERIOD
========================================= */

async function setPeriod(
period
){

if(!currentGame)
return;


/*
Changing the period stops the
current clock and resets it to 10:00.
*/

await pauseClock();


clockSeconds =
600;

clockRunning =
false;

clockStartedAt =
null;

updateClockDisplay();


const {

data,
error

} = await supabaseClient

.from("games")

.update({

period:
period,

clock_seconds:
600,

clock_running:
false,

clock_started_at:
null

})

.eq(
"id",
currentGame.id
)

.select()
.single();


if(error){

console.error(
"Unable to change period:",
error
);

return;

}


currentGame =
data;

showStatus(
period+
" started. Clock reset to 10:00."
);

}
