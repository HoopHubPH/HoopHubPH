/* =========================================

function escapeHTML(str){

    if(!str)
        return "";

    return String(str)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function calculatePercentage(
    made,
    attempted
){

    if(
        !attempted ||
        attempted <= 0
    )
        return "0%";

    return Math.round(

        (
            Number(made) /
            Number(attempted)
        ) * 100

    ) + "%";

}

async function loadGame(){

    const gameId =
        Number(
            document.getElementById(
                "gameId"
            ).value
        );

    if(!gameId){

        showStatus(
            "Enter a valid Game ID."
        );

        error

    .from("games")

    .eq(

        gameId
    )

    .single();


    if(error){

        console.error(
            "Game loading error:",
            error
        );

        showStatus(
            "Error loading game: " +
            error.message
        );

        return;

    }


    currentGame =
        data;


    document.getElementById(
        "homeTeam"
    ).textContent =
        data.home_team ||
        "Home Team";


    document.getElementById(
        "awayTeam"
    ).textContent =
        data.away_team ||
        "Away Team";


    document.getElementById(
        "homeScore"
    ).textContent =
        data.home_score || 0;


    document.getElementById(
        "awayScore"
    ).textContent =
        data.away_score || 0;


    /*
    RESET LOCAL PLAYER MAPS
    */

    playerStatsMap = {};

    playerDataMap = {};

    playerTeamMap = {};

    playerOnCourt = {};

    playerCourtOrder = {};


    /*
    LOAD CLOCK

    /*
    LOAD PLAYERS
    */

    );

/* =========================================
   SCORE
========================================= */

async function updateScore(
    team,
    amount
){

    if(!currentGame){

        showStatus(
            "Load a game first."
        );

        return;

    }


    const column =
        team === "home"
        ? "home_score"
        : "away_score";


    const oldScore =
        Number(
            currentGame[column] || 0
        );


    const newScore =
        Math.max(
            0,
            oldScore + amount
        );


    const {
        data,
        error
    } = await supabaseClient

    .from("games")

    .update({

        [column]:
            newScore

    })

    .eq(
        "id",
        currentGame.id
    )

    .select()
    .single();


    if(error){

        console.error(error);

        showStatus(
            "Unable to update score."
        );

        return;

    }


    currentGame =
        data;


    document.getElementById(
        team+"Score"
    ).textContent =
        newScore;


    /*
    UPDATE +/- FOR PLAYERS ON COURT
    */

    if(amount !== 0){

        const playersToUpdate =
            Object.keys(
                playerOnCourt
            ).filter(

                playerId =>

                    playerOnCourt[playerId] === true

                    &&

                    playerTeamMap[playerId] === team

            );


        for(
            const playerId
            of playersToUpdate
        ){

            const stats =
                await getPlayerGameStats(
                    playerId
                );


            const currentPlusMinus =
                Number(
                    stats.plus_minus || 0
                );


            await saveStatDirect(

                playerId,

                "plus_minus",

                currentPlusMinus + amount

            );


            await refreshPlayerRow(
                playerId
            );

        }

    }

}

async function loadTeamPlayers(){

    const homeName =
        String(
            currentGame.home_team || ""
        ).trim();


    const awayName =
        String(
            currentGame.away_team || ""
        ).trim();


    /*
    FIND HOME TEAM
    */

    const {
        data:homeTeam,
        error:homeTeamError
    } = await supabaseClient

    .from("teams")

    .select(
        "id,name"
    )

    .ilike(
        "name",
        homeName
    )

    .maybeSingle();


    if(homeTeamError){

        console.error(
            "Home team error:",
            homeTeamError
        );

    }


    /*
    FIND AWAY TEAM
    */

    const {
        data:awayTeam,
        error:awayTeamError
    } = await supabaseClient

    .from("teams")

    .select(
        "id,name"
    )

    .ilike(
        "name",
        awayName
    )

    .maybeSingle();


    if(awayTeamError){

        console.error(
            "Away team error:",
            awayTeamError
        );

    }


    /*
    LOAD HOME PLAYERS
    */

    if(homeTeam){

        document.getElementById(
            "homePlayersTitle"
        ).textContent =
            homeTeam.name;


        await loadPlayersForTeam(

            homeTeam.id,

            "homePlayersList",

            "home"

        );

    }
    else{

        document.getElementById(
            "homePlayersList"
        ).innerHTML =
            "<div>No home team found.</div>";

    }


    /*
    LOAD AWAY PLAYERS
    */

    if(awayTeam){

        document.getElementById(
            "awayPlayersTitle"
        ).textContent =
            awayTeam.name;


        await loadPlayersForTeam(

            awayTeam.id,

            "awayPlayersList",

            "away"

        );

    }
    else{

        document.getElementById(
            "awayPlayersList"
        ).innerHTML =
            "<div>No away team found.</div>";

    }

}


async function loadPlayersForTeam(

    teamId,

    containerId,

    team

){

    const container =
        document.getElementById(
            containerId
        );


    container.innerHTML =
        "";


    const {
        data,
        error
    } = await supabaseClient

    .from("players")

    .select("*")

    .eq(
        "team_id",
        teamId
    )

    .order(
        "jersey_number",
        {
            ascending:true
        }
    );


    if(error){

        console.error(
            "Players loading error:",
            error
        );


        container.innerHTML =
            "<div>Unable to load players.</div>";


        return;

    }


    if(
        !data ||
        !data.length
    ){

        container.innerHTML =
            "<div>No players assigned.</div>";


        return;

    }


    const table =
        document.createElement(
            "table"
        );


    table.className =
        "player-table";


    table.innerHTML = `

<thead>

<tr>

<th class="col-number">#</th>

<th class="col-player">PLAYER</th>

<th class="col-min">MIN</th>

<th class="col-stat">PTS</th>

<th class="col-stat">OREB</th>

<th class="col-stat">DREB</th>

<th class="col-stat">REB</th>

<th class="col-stat">AST</th>

<th class="col-stat">STL</th>

<th class="col-stat">BLK</th>

<th class="col-stat">TO</th>

<th class="col-stat">PF</th>

<th class="col-shot">2PT</th>

<th class="col-shot">3PT</th>

<th class="col-shot">FT</th>

<th class="col-plusminus">+/-</th>

</tr>

</thead>

<tbody></tbody>

`;


    container.appendChild(
        table
    );


    const tbody =
        table.querySelector(
            "tbody"
        );


    /*
    LOAD ALL PLAYERS
    */

    for(
        const player
        of data
    ){

        playerDataMap[
            player.id
        ] =
            player;


        playerTeamMap[
            player.id
        ] =
            team;


        const stats =
            await getPlayerGameStats(
                player.id
            );


        playerOnCourt[
            player.id
        ] =
            stats.on_court === true;


        if(
            playerOnCourt[
                player.id
            ]
        ){

            if(
                !playerCourtOrder[
                    team
                ]
            ){

                playerCourtOrder[
                    team
                ] =
                    [];

            }


            playerCourtOrder[
                team
            ].push(
                player.id
            );

        }

    }


    /*
    ON-COURT PLAYERS FIRST
    */

    const orderedPlayers = [

        ...data.filter(

            p =>
                playerOnCourt[
                    p.id
                ]

        ),

        ...data.filter(

            p =>
                !playerOnCourt[
                    p.id
                ]

        )

    ];


    /*
    RENDER EVERY PLAYER
    */

    for(
        const player
        of orderedPlayers
    ){

        const row =
            document.createElement(
                "tr"
            );


        row.id =
            "player-row-"+player.id;


        tbody.appendChild(
            row
        );


        await renderPlayerRow(

            player,

            row

        );

    }

}


/* =========================================
   PLAYER STATS
========================================= */

async function getPlayerGameStats(
    playerId
){

    const defaults = {

        points:0,

        minutes_played:0,

        offensive_rebounds:0,

        defensive_rebounds:0,

        rebounds:0,

        assists:0,

        steals:0,

        blocks:0,

        turnovers:0,

        fouls:0,

        two_pt_made:0,

        two_pt_attempted:0,

        three_pt_made:0,

        three_pt_attempted:0,

        ft_made:0,

        ft_attempted:0,

        plus_minus:0,

        on_court:false

    };


    if(
        playerStatsMap[
            playerId
        ]
    ){

        return playerStatsMap[
            playerId
        ];

    }


    if(!currentGame)
        return defaults;


    const {
        data,
        error
    } = await supabaseClient

    .from(
        "player_game_stats"
    )

    .select("*")

    .eq(
        "game_id",
        currentGame.id
    )

    .eq(
        "player_id",
        playerId
    )

    .maybeSingle();


    if(error){

        console.error(
            "Stats error:",
            error
        );

    }


    playerStatsMap[
        playerId
    ] = {

        ...defaults,

        ...(data || {})

    };


    return playerStatsMap[
        playerId
    ];

}

    const stats =

    const updateObj = {

            currentGame.id

    };


    if(
        statKey ===
        "on_court"
    ){

        updateObj[
            statKey
        ] =
            Boolean(
                value
            );

    }
    else{

        updateObj[
            statKey
        ] =
            Math.max(
                0,
                Number(
                    value || 0
                )
            );

    }


    if(

        statKey ===
        "offensive_rebounds"

        ||

        statKey ===
        "defensive_rebounds"

    ){

        const oreb =

            statKey ===
            "offensive_rebounds"

            ?

            Number(
                value
            )

            :

            Number(
                stats.offensive_rebounds || 0
            );


        const dreb =

            statKey ===
            "defensive_rebounds"

            ?

            Number(
                value
            )

            :

            Number(
                stats.defensive_rebounds || 0
            );


        updateObj.rebounds =

            Math.max(
                0,
                oreb + dreb
            );

    }


    const {
        data,
        error
    } = await supabaseClient

    .from(
        "player_game_stats"
    )

    .upsert(

        updateObj,

        {

            onConflict:
                "player_id,game_id"

        }

    )

    .select()
    .single();


    if(error){

        console.error(
            error
        );


        showStatus(
            "Unable to save player stats: " +
            error.message
        );


        return;

    }


    playerStatsMap[
        playerId
    ] = {

        ...stats,

        ...data

    };

}


async function updatePlayerStat(

    playerId,

    statKey,

    amount

){

    const stats =
        await getPlayerGameStats(
            playerId
        );


    const currentValue =
        Number(
            stats[
                statKey
            ] || 0
        );


    const newValue =
        Math.max(
            0,
            currentValue + amount
        );


    if(
        statKey ===
        "points"
    ){

        return;

    }


    if(
        statKey ===
        "minutes_played"
    ){

        return;

    }


    if(
        statKey ===
        "plus_minus"
    ){

        return;

    }


    if(

        statKey ===
        "two_pt_made"

        ||

        statKey ===
        "three_pt_made"

        ||

        statKey ===
        "ft_made"

    ){

        const pointsToAdd =

            statKey ===
            "two_pt_made"

            ?

            2

            :

            statKey ===
            "three_pt_made"

            ?

            3

            :

            1;


        await saveStatDirect(

            playerId,

            statKey,

            newValue

        );


        const newPoints =

            Math.max(

                0,

                Number(
                    stats.points || 0
                )

                +

                (
                    amount *
                    pointsToAdd
                )

            );


        await saveStatDirect(

            playerId,

            "points",

            newPoints

        );


        const team =
            playerTeamMap[
                playerId
            ];


        if(
            team &&
            currentGame
        ){

            const column =

                team ===
                "home"

                ?

                "home_score"

                :

                "away_score";


            const oldTeamScore =
                Number(
                    currentGame[
                        column
                    ] || 0
                );


            const newTeamScore =

                Math.max(

                    0,

                    oldTeamScore

                    +

                    (
                        amount *
                        pointsToAdd
                    )

                );


            await updateScoreFromPlayer(

                team,

                newTeamScore

            );

        }


        await refreshPlayerRow(
            playerId
        );


        return;

    }


    await saveStatDirect(

        playerId,

        statKey,

        newValue

    );


    await refreshPlayerRow(
        playerId
    );

}


async function updateScoreFromPlayer(

    team,

    newScore

){

    if(!currentGame)
        return;


    const column =

        team ===
        "home"

        ?

        "home_score"

        :

        "away_score";


    const oldScore =
        Number(
            currentGame[
                column
            ] || 0
        );


    const amount =
        newScore -
        oldScore;


    if(amount === 0)
        return;


    const {
        data,
        error
    } = await supabaseClient

    .from("games")

    .update({

        [column]:
            newScore

    })

    .eq(
        "id",
        currentGame.id
    )

    .select()
    .single();


    if(error){

        console.error(
            error
        );


        showStatus(
            "Unable to sync team score."
        );


        return;

    }


    currentGame =
        data;


    document.getElementById(
        team+"Score"
    ).textContent =
        newScore;


    const playersToUpdate =

        Object.keys(
            playerOnCourt
        ).filter(

            playerId =>

                playerOnCourt[
                    playerId
                ] === true

                &&

                playerTeamMap[
                    playerId
                ] === team

        );


    for(
        const playerId
        of playersToUpdate
    ){

        const stats =
            await getPlayerGameStats(
                playerId
            );


        const currentPlusMinus =

            Number(
                stats.plus_minus || 0
            );


        await saveStatDirect(

            playerId,

            "plus_minus",

            currentPlusMinus + amount

        );


        await refreshPlayerRow(
            playerId
        );

    }

}

async function toggleSubstitution(
    playerId
){

    if(!currentGame)
        return;


    const team =
        playerTeamMap[
            playerId
        ];


    const currentlyOn =
        playerOnCourt[
            playerId
        ] === true;


    if(currentlyOn){

        playerOnCourt[
            playerId
        ] =
            false;


        await saveStatDirect(

            playerId,

            "on_court",

            false

        );


        if(
            playerCourtOrder[
                team
            ]
        ){

            playerCourtOrder[
                team
            ] =

                playerCourtOrder[
                    team
                ].filter(

                    id =>
                        id !== playerId

                );

        }


        await refreshPlayerRow(
            playerId
        );


        showStatus(
            "Player SUB OUT."
        );


        return;

    }


    const activePlayers =

        Object.keys(
            playerOnCourt
        ).filter(

            id =>

                playerOnCourt[
                    id
                ] === true

                &&

                playerTeamMap[
                    id
                ] === team

        ).length;


    if(
        activePlayers >= 5
    ){

        showStatus(

            "Maximum 5 players are on court. Sub out a player first."

        );


        return;

    }


    playerOnCourt[
        playerId
    ] =
        true;


    await saveStatDirect(

        playerId,

        "on_court",

        true

    );


    if(
        !playerCourtOrder[
            team
        ]
    ){

        playerCourtOrder[
            team
        ] =
            [];

    }


    playerCourtOrder[
        team
    ].push(
        playerId
    );


    await refreshPlayerRow(
        playerId
    );


    showStatus(
        "Player SUB IN."
    );

}


/* =========================================
   CLOCK
   FIXED PERSISTENT VERSION
========================================= */


/*
IMPORTANT:

clock_seconds stores the LAST KNOWN REMAINING TIME.

clock_started_at stores the exact time
the current running segment began.

When paused:
- Calculate remaining time
- Stop running
- Save remaining time

When started:
- Save the current remaining time
- Save a new started_at timestamp

When page reloads:
- If running, calculate elapsed time from started_at
- Subtract elapsed time ONCE
- Save the new remaining time
- Start a new timing segment

This prevents the clock from jumping
backward repeatedly after refresh.
*/


async function saveClockState(){

    if(!currentGame)
        return false;


    const updateData = {

        clock_seconds:
            Math.max(
                0,
                Math.floor(
                    Number(
                        clockSeconds || 0
                    )
                )
            ),

        clock_running:
            clockRunning,

        clock_started_at:

            clockRunning

            ?

            (
                clockStartedAt

                ?

                new Date(
                    clockStartedAt
                ).toISOString()

                :

                new Date().toISOString()
            )

            :

            null

    };


    const {
        data,
        error
    } = await supabaseClient

    .from("games")

    .update(
        updateData
    )

    .eq(
        "id",
        currentGame.id
    )

    .select("*")

    .single();


    if(error){

        console.error(
            "Clock save error:",
            error
        );


        return false;

    }


    if(data){

        currentGame =
            data;

    }


    return true;

}


async function loadPersistedClock(){

    if(!currentGame)
        return;


    const {
        data,
        error
    } = await supabaseClient

    .from("games")

    .select(
        "clock_seconds, clock_running, clock_started_at"
    )

    .eq(
        "id",
        currentGame.id
    )

    .single();


    if(error){

        console.error(
            "Clock load error:",
            error
        );


        /*
        If clock columns do not exist,
        keep default 10:00 instead of
        breaking the player loading.
        */

        clockSeconds = 600;

        clockRunning = false;

        clockStartedAt = null;

        updateClockDisplay();

        return;

    }


    /*
    RESTORE SAVED TIME
    */

    clockSeconds = Math.max(

        0,

        Number(
            data.clock_seconds ?? 600
        )

    );


    clockRunning =
        data.clock_running === true;


    clockStartedAt =

        data.clock_started_at

        ?

        new Date(
            data.clock_started_at
        ).getTime()

        :

        null;


    /*
    IF THE CLOCK WAS RUNNING
    BEFORE THE PAGE WAS REFRESHED
    */

    if(

        clockRunning

        &&

        clockStartedAt

    ){

        const now =
            Date.now();


        const elapsedSeconds =

            Math.floor(

                (
                    now -
                    clockStartedAt
                ) / 1000

            );


        /*
        SUBTRACT REAL ELAPSED TIME
        */

        clockSeconds =

            Math.max(

                0,

                clockSeconds -
                elapsedSeconds

            );


        /*
        CLOCK FINISHED
        */

        if(
            clockSeconds <= 0
        ){

            clockSeconds = 0;

            clockRunning = false;

            clockStartedAt = null;

            updateClockDisplay();

            await saveClockState();

            return;

        }


        /*
        CREATE NEW TIMING SEGMENT
        */

        clockStartedAt =
            Date.now();


        /*
        SAVE THE NEW SEGMENT
        */

        await saveClockState();

    }


    updateClockDisplay();


    /*
    RESUME LOCAL CLOCK
    */

    if(
        clockRunning
    ){

        startClockInternal();

    }

}


function getCurrentClockSeconds(){

    /*
    PAUSED CLOCK
    */

    if(

        !clockRunning

        ||

        !clockStartedAt

    ){

        return Math.max(

            0,

            Math.floor(

                Number(
                    clockSeconds || 0
                )

            )

        );

    }


    /*
    RUNNING CLOCK
    */

    const elapsedSeconds =

        Math.floor(

            (
                Date.now() -
                clockStartedAt

            ) / 1000

        );


    return Math.max(

        0,

        clockSeconds -
        elapsedSeconds

    );

}


function updateClockDisplay(){

    const currentSeconds =
        getCurrentClockSeconds();


    const minutes =

        Math.floor(

            currentSeconds / 60

        );


    const seconds =

        currentSeconds % 60;


    document.getElementById(
        "gameClock"
    ).textContent =

        String(
            minutes
        ).padStart(
            2,
            "0"
        )

        +

        ":"

        +

        String(
            seconds
        ).padStart(
            2,
            "0"
        );

}


async function startClock(){

    if(
        clockRunning
    )
        return;


    if(
        !currentGame
    ){

        showStatus(
            "Load a game first."
        );

        return;

    }


    /*
    GET CURRENT PAUSED VALUE
    */

    clockSeconds =
        getCurrentClockSeconds();


    if(
        clockSeconds <= 0
    ){

        clockSeconds = 0;

        updateClockDisplay();

        return;

    }


    /*
    START NEW SEGMENT
    */

    clockRunning = true;

    clockStartedAt =
        Date.now();


    /*
    SAVE START STATE
    */

    await saveClockState();


    /*
    START DISPLAY
    */

    startClockInternal();

}


function startClockInternal(){

    /*
    CLEAR OLD INTERVAL
    */

    if(
        clockInterval
    ){

        clearInterval(
            clockInterval
        );

    }


    updateClockDisplay();


    clockInterval =

        setInterval(

            async()=>{


                if(
                    !clockRunning
                ){

                    clearInterval(
                        clockInterval
                    );

                    clockInterval =
                        null;

                    return;

                }


                const currentSeconds =
                    getCurrentClockSeconds();


                /*
                CLOCK FINISHED
                */

                if(
                    currentSeconds <= 0
                ){

                    clockSeconds = 0;

                    clockRunning = false;

                    clockStartedAt = null;


                    if(
                        clockInterval
                    ){

                        clearInterval(
                            clockInterval
                        );

                        clockInterval =
                            null;

                    }


                    updateClockDisplay();


                    await saveClockState();


                    return;

                }


                /*
                UPDATE DISPLAY
                */

                updateClockDisplay();


                /*
                UPDATE PLAYER MINUTES
                ONLY EVERY FULL MINUTE
                */

                const previousWholeMinute =

                    Math.floor(
                        clockSeconds / 60
                    );


                const currentWholeMinute =

                    Math.floor(
                        currentSeconds / 60
                    );


                /*
                Update stored clock value
                in memory so minute transitions
                can be detected correctly.
                */

                if(

                    currentWholeMinute
                    <

                    previousWholeMinute

                ){

                    const playersToUpdate =

                        Object.keys(
                            playerOnCourt
                        ).filter(

                            playerId =>

                                playerOnCourt[
                                    playerId
                                ] === true

                        );


                    for(
                        const playerId
                        of playersToUpdate
                    ){

                        const stats =

                            await getPlayerGameStats(
                                playerId
                            );


                        const newMinutes =

                            Number(
                                stats.minutes_played || 0
                            )

                            +

                            60;


                        await saveStatDirect(

                            playerId,

                            "minutes_played",

                            newMinutes

                        );


                        await refreshPlayerRow(
                            playerId
                        );

                    }

                }


                /*
                Update in-memory remaining time
                */

                clockSeconds =
                    currentSeconds;


                /*
                SAVE EVERY 5 SECONDS
                */

                if(

                    Math.floor(
                        Date.now() / 1000
                    ) % 5 === 0

                ){

                    /*
                    Freeze current remaining value
                    */

                    clockSeconds =
                        getCurrentClockSeconds();


                    /*
                    Start a fresh timing segment
                    */

                    clockStartedAt =
                        Date.now();


                    /*
                    Save
                    */

                    await saveClockState();

                }

            },

            1000

        );

}


async function pauseClock(){

    if(
        !currentGame
    )
        return;


    /*
    SAVE EXACT CURRENT TIME
    */

    clockSeconds =
        getCurrentClockSeconds();


    /*
    STOP
    */

    clockRunning = false;


    /*
    CLEAR INTERVAL
    */

    if(
        clockInterval
    ){

        clearInterval(
            clockInterval
        );

        clockInterval =
            null;

    }


    /*
    CLEAR START TIME
    */

    clockStartedAt =
        null;


    updateClockDisplay();


    /*
    SAVE PAUSED STATE
    */

    await saveClockState();

}


async function resetClock(){

    if(
        !currentGame
    )
        return;


    /*
    STOP
    */

    clockRunning = false;


    /*
    CLEAR INTERVAL
    */

    if(
        clockInterval
    ){

        clearInterval(
            clockInterval
        );

        clockInterval =
            null;

    }


    /*
    RESET TO 10 MINUTES
    */

    clockSeconds =
        600;


    clockStartedAt =
        null;


    updateClockDisplay();


    /*
    SAVE
    */

    await saveClockState();

}


/* =========================================
   PERIOD
========================================= */

async function setPeriod(
    period
){

    if(
        !currentGame
    )
        return;


    /*
    STOP CLOCK FIRST
    */

    clockRunning = false;


    if(
        clockInterval
    ){

        clearInterval(
            clockInterval
        );

        clockInterval =
            null;

    }


    clockStartedAt =
        null;


    /*
