<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scorekeeper | Hoop Hub PH</title>

<style>

/* =========================================
   RESET & BASE
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}


/* =========================================
   HEADER
========================================= */

header {
    background: #111;
    color: white;
    padding: 10px 2%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 18px;
    font-weight: bold;
    color: white;
    text-decoration: none;
}

.logo span {
    color: #ff6b00;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 12px;
    font-weight: bold;
    font-size: 12px;
}

nav a:hover {
    color: #ff6b00;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    width: 100%;
    max-width: 100%;
    margin: 10px auto;
    padding: 0 10px;
}


/* =========================================
   GAME SELECTOR
========================================= */

.game-selector {
    background: white;
    padding: 10px 15px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    margin-bottom: 10px;

    display: flex;
    align-items: center;
    gap: 10px;
}

.game-selector h2 {
    font-size: 14px;
    white-space: nowrap;
}

.game-selector input {
    width: 100px;
    padding: 5px 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 13px;
}

.load-button {
    background: #ff6b00;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
}

.load-button:hover {
    background: #111;
}


/* =========================================
   STATUS
========================================= */

#statusMessage {
    text-align: center;
    padding: 7px;
    background: #e8f5e9;
    color: #2e7d32;
    border-radius: 5px;
    margin-bottom: 10px;
    display: none;
    font-size: 12px;
}


/* =========================================
   SCOREBOARD
========================================= */

.scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
}

.team-control {
    background: white;
    padding: 10px;
    border-radius: 6px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.team-control h2 {
    font-size: 16px;
    margin-bottom: 2px;
}

.score {
    font-size: 34px;
    font-weight: bold;
    color: #ff6b00;
    margin-bottom: 5px;
}

.button-row {
    display: flex;
    justify-content: center;
    gap: 4px;
}

.score-button {
    background: #111;
    color: white;
    border: none;
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.score-button:hover {
    background: #ff6b00;
}


/* =========================================
   PLAYER STATS SECTION
========================================= */

.controls {
    background: white;
    padding: 10px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    margin-bottom: 10px;
}

.controls > h2 {
    font-size: 16px;
    text-align: center;
    margin-bottom: 8px;
}


/* =========================================
   HOME / AWAY COLUMNS
========================================= */

.stats-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat-control {
    background: #fafafa;
    border: 1px solid #ddd;
    padding: 7px;
    border-radius: 6px;

    max-height: 70vh;
    overflow-y: auto;
}

.stat-control > h2 {
    text-align: center;
    font-size: 13px;
    margin-bottom: 7px;

    position: sticky;
    top: 0;

    background: #fafafa;
    padding: 4px 0;

    z-index: 2;

    border-bottom: 2px solid #ff6b00;
}


/* =========================================
   SMALL PLAYER CARD
========================================= */

.player-card {
    background: white;
    border: 1px solid #ddd;

    padding: 5px;

    margin-bottom: 5px;

    border-radius: 5px;

    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}


/* =========================================
   PLAYER HEADER
========================================= */

.player-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 4px;
    padding-bottom: 3px;

    border-bottom: 1px solid #eee;
}

.player-name {
    font-size: 12px;
    font-weight: bold;
    line-height: 1.1;
}

.player-info {
    font-size: 9px;
    color: #777;
}

.player-number {
    background: #111;
    color: white;

    padding: 2px 5px;

    border-radius: 3px;

    font-size: 10px;
    font-weight: bold;
}


/* =========================================
   STAT ROW
========================================= */

.stat-row {
    display: flex;
    flex-wrap: wrap;

    gap: 2px;

    margin-bottom: 3px;
}


/* =========================================
   SMALL STAT BOX
========================================= */

.compact-stat-box {
    flex: 1;

    min-width: 38px;

    background: #f8f9fa;

    border: 1px solid #e5e5e5;

    border-radius: 3px;

    padding: 2px;

    text-align: center;
}

.compact-label {
    font-size: 7px;
    color: #666;

    font-weight: bold;

    text-transform: uppercase;
}

.compact-value {
    font-size: 11px;

    font-weight: bold;

    color: #ff6b00;

    line-height: 1;

    margin: 2px 0;
}


/* =========================================
   STAT BUTTONS
========================================= */

.stat-buttons {
    display: flex;
    justify-content: center;
    gap: 2px;
}

.stat-btn {
    width: 17px;
    height: 17px;

    border: none;

    border-radius: 3px;

    background: #111;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 10px;

    line-height: 17px;

    padding: 0;
}

.stat-btn:hover {
    background: #ff6b00;
}

.stat-btn.minus {
    background: #888;
}

.stat-btn.minus:hover {
    background: #333;
}


/* =========================================
   SHOOTING STATS
========================================= */

.shooting-compact-group {
    display: flex;

    gap: 3px;

    background: #fff8f5;

    border: 1px solid #ffe8dd;

    border-radius: 3px;

    padding: 3px;

    margin-top: 3px;
}

.shooting-item {
    flex: 1;

    text-align: center;
}

.shooting-sub-val {
    font-size: 9px;

    font-weight: bold;

    margin-bottom: 2px;
}

.pct-tag {
    font-size: 8px;

    color: #ff6b00;

    font-weight: bold;

    margin-top: 2px;
}


/* =========================================
   NO PLAYERS
========================================= */

.no-players {
    text-align: center;

    color: #777;

    padding: 10px;

    font-size: 11px;
}


/* =========================================
   GAME FOOTER CONTROLS
========================================= */

.game-footer-controls {
    display: flex;

    gap: 10px;

    justify-content: space-around;

    background: white;

    padding: 8px;

    border-radius: 6px;

    font-size: 11px;
}

.control-button {
    background: #ff6b00;

    color: white;

    border: none;

    padding: 5px 9px;

    border-radius: 4px;

    font-weight: bold;

    cursor: pointer;

    font-size: 10px;
}

.control-button:hover {
    background: #111;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    header {
        flex-direction: column;
        gap: 8px;
    }

    nav a {
        margin: 0 5px;
        font-size: 10px;
    }

    .scoreboard {
        grid-template-columns: 1fr 1fr;
    }

    .stats-controls {
        grid-template-columns: 1fr;
    }

    .stat-control {
        max-height: 500px;
    }

    .player-card {
        padding: 6px;
    }

    .compact-stat-box {
        min-width: 42px;
    }

    .game-footer-controls {
        flex-direction: column;
        align-items: center;
    }

}

</style>

</head>


<body>

     HEADER
========================================= -->

<header>

<a href="index.html" class="logo">
HOOP <span>HUB PH</span>
</a>

<nav>

<div class="container">

type="number"

<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
"https://tkrsyiwffqkgfyooewsf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   CURRENT GAME
========================================= */

let currentGame = null;


/* =========================================
   PLAYER DATA
========================================= */

let playerStatsMap = {};

let playerDataMap = {};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str) {

if (!str) return "";

return String(str)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
   CALCULATE PERCENTAGE
========================================= */

function calculatePercentage(
made,
attempted
) {

if (!attempted || attempted === 0) {

return "0%";

}

return Math.round(
(made / attempted) * 100
) + "%";

}


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(
message
) {

const el =
document.getElementById(
"statusMessage"
);

el.textContent =
message;

el.style.display =
"block";

setTimeout(

() => {

el.style.display =
"none";

},

3000

);

}


/* =========================================
   LOAD GAME
========================================= */

async function loadGame() {

const gameId =
Number(
document.getElementById(
"gameId"
).value
);


if (!gameId) {

showStatus(
"Please enter a valid Game ID."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.select("*")

.eq(
"id",
gameId
)

.single();


if (error) {

console.error(error);

showStatus(
"Error loading game: " +
error.message
);

return;

}


currentGame =
data;


/* TEAM NAMES */

document.getElementById(
"homeTeam"
).textContent =
data.home_team ||
"Home Team";


document.getElementById(
"awayTeam"
).textContent =
data.away_team ||
"Away Team";


/* CLEAR OLD PLAYER DATA */

playerStatsMap = {};

playerDataMap = {};


/* REFRESH SCORE */

refreshDisplay();


/* LOAD PLAYERS */

await loadTeamPlayers();


showStatus(
"Game loaded successfully."
);

}


/* =========================================
   REFRESH SCOREBOARD
========================================= */

function refreshDisplay() {

if (!currentGame)
return;


document.getElementById(
"homeScore"
).textContent =
currentGame.home_score ??
0;


document.getElementById(
"awayScore"
).textContent =
currentGame.away_score ??
0;

}


/* =========================================
   UPDATE SCORE
========================================= */

async function updateScore(
team,
amount
) {

if (!currentGame) {

showStatus(
"Please load a game first."
);

return;

}


const column =
team === "home"
? "home_score"
: "away_score";


let newScore =

Math.max(

0,

Number(
currentGame[column] || 0
)

+ amount

);


const {

data,

error

} = await supabaseClient

.from("games")

.update({

[column]:
newScore

})

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

showStatus(
"Error updating score."
);

console.error(error);

return;

}


currentGame =
data;


refreshDisplay();

}


/* =========================================
   UPDATE GAME
========================================= */

async function updateGame(
changes
) {

if (!currentGame) {

showStatus(
"Load a game first."
);

return;

}


const {

data,

error

} = await supabaseClient

.from("games")

.update(changes)

.eq(
"id",
currentGame.id
)

.select()

.single();


if (error) {

showStatus(
"Error updating game."
);

console.error(error);

return;

}


currentGame =
data;


refreshDisplay();


showStatus(
"Game updated."
);

}


/* =========================================
   LOAD BOTH TEAMS
========================================= */

async function loadTeamPlayers() {

if (!currentGame)
return;


const homeName =
String(
currentGame.home_team || ""
).trim();


const awayName =
String(
currentGame.away_team || ""
).trim();


/* HOME TEAM */

const {

data: homeTeam,

error: homeError

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.ilike(
"name",
homeName
)

.maybeSingle();


if (homeError) {

console.error(
"Home team error:",
homeError
);

}


if (homeTeam) {

document.getElementById(
"homePlayersTitle"
).textContent =
homeTeam.name +
" Players";


await loadPlayersForTeam(

homeTeam.id,

"homePlayersList"

);

}

else {

document.getElementById(
"homePlayersList"
).innerHTML =

`<div class="no-players">
Team not found: ${escapeHTML(homeName)}
</div>`;

}


/* AWAY TEAM */

const {

data: awayTeam,

error: awayError

} = await supabaseClient

.from("teams")

.select(
"id,name"
)

.ilike(
"name",
awayName
)

.maybeSingle();


if (awayError) {

console.error(
"Away team error:",
awayError
);

}


if (awayTeam) {

document.getElementById(
"awayPlayersTitle"
).textContent =
awayTeam.name +
" Players";


await loadPlayersForTeam(

awayTeam.id,

"awayPlayersList"

);

}

else {

document.getElementById(
"awayPlayersList"
).innerHTML =

`<div class="no-players">
Team not found: ${escapeHTML(awayName)}
</div>`;

}

}


/* =========================================
   LOAD PLAYERS
========================================= */

async function loadPlayersForTeam(

teamId,

containerId

) {

const container =
document.getElementById(
containerId
);


container.innerHTML =

`<div class="no-players">
Loading players...
</div>`;


const {

data,

error

} = await supabaseClient

.from("players")

.select("*")

.eq(
"team_id",
teamId
)

.order(

"jersey_number",

{

ascending:
true

}

);


if (error) {

console.error(
"Player loading error:",
error
);

container.innerHTML =

`<div class="no-players">
Unable to load players.
</div>`;

return;

}


if (!data ||
data.length === 0) {

container.innerHTML =

`<div class="no-players">
No players assigned.
</div>`;

return;

}


container.innerHTML =
"";


for (
const player
of data
) {


/* SAVE PLAYER DATA */

playerDataMap[
player.id
] =
player;


/* CREATE CARD */

await createPlayerCard(

player,

container

);

}

}


/* =========================================
   GET PLAYER GAME STATS
========================================= */

async function getPlayerGameStats(

playerId

) {

const defaults = {

points: 0,

rebounds: 0,

assists: 0,

blocks: 0,

steals: 0,

turnovers: 0,

fouls: 0,

two_pt_made: 0,

two_pt_attempted: 0,

three_pt_made: 0,

three_pt_attempted: 0,

ft_made: 0,

ft_attempted: 0

};


if (!currentGame)
return defaults;


const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.select("*")

.eq(
"game_id",
currentGame.id
)

.eq(
"player_id",
playerId
)

.maybeSingle();


if (error) {

console.error(
"Stats loading error:",
error
);

}


playerStatsMap[
playerId
] =
data ||
{

...defaults,

player_id:
playerId,

game_id:
currentGame.id

};


return playerStatsMap[
playerId
];

}


/* =========================================
   UPDATE PLAYER STAT
========================================= */

async function updatePlayerStat(

playerId,

statKey,

amount

) {

if (!currentGame) {

showStatus(
"Please load a game first."
);

return;

}


/* GET CURRENT STATS */

let stats =
await getPlayerGameStats(
playerId
);


let currentValue =
Number(
stats[statKey] || 0
);


let newValue =

Math.max(

0,

currentValue +
amount

);


/* UPDATE ONLY THE REQUIRED FIELD */

const updateObj = {

player_id:
playerId,

game_id:
currentGame.id

};


updateObj[
statKey
] =
newValue;


/* UPSERT */

const {

data,

error

} = await supabaseClient

.from(
"player_game_stats"
)

.upsert(

updateObj,

{

onConflict:
"player_id,game_id"

}

)

.select()

.single();


if (error) {

console.error(
"Player stats update error:",
error
);

showStatus(
"Unable to update player stats: " +
error.message
);

return;

}


/* SAVE UPDATED DATA */

playerStatsMap[
playerId
] =
{

...stats,

...data

};


/* GET PLAYER */

const player =
playerDataMap[
playerId
];


if (!player)
return;


/* FIND CARD */

const card =
document.getElementById(

`player-card-${playerId}`

);


if (card) {

const parent =
card.parentElement;


/* REMOVE OLD CARD */

card.remove();


/* CREATE UPDATED CARD */

await createPlayerCard(

player,

parent

);

}

}


/* =========================================
   CREATE STAT BOX
========================================= */

function createStatBox(

label,

value,

playerId,

statKey

) {

return `

<div class="compact-stat-box">

<div class="compact-label">

${label}

</div>


<div class="compact-value">

${value || 0}

</div>


<div class="stat-buttons">

<button

class="stat-btn"

onclick="updatePlayerStat(

'${playerId}',

'${statKey}',

1

)"

>

+

</button>


<button

class="stat-btn minus"

onclick="updatePlayerStat(

'${playerId}',

'${statKey}',

-1

)"

>

−

</button>

</div>

</div>

`;

}


/* =========================================
   CREATE PLAYER CARD
========================================= */

async function createPlayerCard(

player,

container

) {

const s =
await getPlayerGameStats(
player.id
);


const card =
document.createElement(
"div"
);


card.className =
"player-card";


card.id =

`player-card-${player.id}`;


card.innerHTML = `


<div class="player-card-header">


<div>

<span class="player-name">

${escapeHTML(
player.first_name
)}

${escapeHTML(
player.last_name
)}

</span>


<span class="player-info">

${escapeHTML(
player.position ||
"N/A"
)}

</span>

</div>


<div class="player-number">

#${escapeHTML(

String(

player.jersey_number ||
""

)

)}

</div>


</div>



<!-- MAIN STATS -->


<div class="stat-row">


${createStatBox(

"PTS",

s.points,
