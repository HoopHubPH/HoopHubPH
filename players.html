<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Players | Hoop Hub PH</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
}

header span{
    color:#ff6b00;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

h2{
    margin-bottom:30px;
}

#playersList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.player-card{

    background:white;

    border-radius:12px;

    padding:20px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.player-card h3{

    margin-bottom:10px;

}

.player-card p{

    margin:6px 0;

}

</style>

</head>

<body>

<header>

<h1>HOOP HUB <span>PH</span></h1>

</header>

<div class="container">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">

    <h2>Players Directory</h2>

    <a href="add-player.html"
       style="
       background:#ff6b00;
       color:white;
       padding:12px 20px;
       text-decoration:none;
       border-radius:8px;
       font-weight:bold;">
       + Add Player
    </a>

</div>

<div id="playersList">

Loading players...

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://tkrsyiwffqkgfyooewsf.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function loadPlayers() {

    const playersList = document.getElementById("playersList");

    playersList.innerHTML = "Loading players...";

    const { data, error } = await supabaseClient
        .from("players")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {

        playersList.innerHTML =
            "<h3>Unable to load players.</h3>";

        console.error(error);

        return;
    }

    if (data.length === 0) {

        playersList.innerHTML =
            "<h3>No players have been added yet.</h3>";

        return;

    }

    playersList.innerHTML = "";

    data.forEach(player => {

        playersList.innerHTML += `

        <div class="player-card">

            <h3>${player.first_name} ${player.last_name}</h3>

            <p><strong>Position:</strong> ${player.position}</p>

            <p><strong>Jersey:</strong> #${player.jersey_number}</p>

            <p><strong>Height:</strong> ${player.height}</p>

        </div>

        `;

    });

}

loadPlayers();

</script>
</body>

</html>
