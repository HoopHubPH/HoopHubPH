<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Player | Hoop Hub PH</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        header span {
            color: #ff6b00;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .container h2 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ff6b00;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row .form-group {
            flex: 1;
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .save-btn:hover {
            background: #e65f00;
        }

        .back-btn {
    display: inline-block;
    margin-bottom: 25px;
    padding: 10px 16px;
    background: #111;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

.back-btn:hover {
    background: #333;
}

        @media (max-width: 600px) {

            .container {
                margin: 20px;
                padding: 25px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>HOOP HUB <span>PH</span></h1>

</header>


<div class="container">

    <a href="players.html" class="back-btn">
    ← Back to Players Directory
</a>

    <h2>Add New Player</h2>

    <p class="subtitle">
        Enter the player's information below.
    </p>


    <form id="playerForm">


        <div class="row">


            <div class="form-group">

                <label for="firstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    placeholder="Juan"
                    required
                >

            </div>


            <div class="form-group">

                <label for="lastName">
                    Last Name
                </label>

                <input
                    type="text"
                    id="lastName"
                    placeholder="Dela Cruz"
                    required
                >

            </div>


        </div>


        <div class="form-group">

            <label for="position">
                Position
            </label>

            <select id="position" required>

                <option value="">
                    Select Position
                </option>

                <option value="Point Guard">
                    Point Guard
                </option>

                <option value="Shooting Guard">
                    Shooting Guard
                </option>

                <option value="Small Forward">
                    Small Forward
                </option>

                <option value="Power Forward">
                    Power Forward
                </option>

                <option value="Center">
                    Center
                </option>

            </select>

        </div>


        <div class="row">


            <div class="form-group">

                <label for="jerseyNumber">
                    Jersey Number
                </label>

                <input
                    type="number"
                    id="jerseyNumber"
                    placeholder="10"
                    min="0"
                    max="99"
                    required
                >

            </div>


            <div class="form-group">

                <label for="height">
                    Height
                </label>

                <input
                    type="text"
                    id="height"
                    placeholder="5'9"
                >

            </div>


        </div>


        <button
            type="submit"
            class="save-btn"
        >
            SAVE PLAYER
        </button>


    </form>


</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const SUPABASE_URL = "https://tkrsyiwffqkgfyooewsf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const playerForm = document.getElementById("playerForm");

    playerForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const position = document.getElementById("position").value;
        const jerseyNumber = document.getElementById("jerseyNumber").value;
        const height = document.getElementById("height").value.trim();

        const { data, error } = await supabaseClient
            .from("players")
            .insert([
                {
                    first_name: firstName,
                    last_name: lastName,
                    position: position,
                    jersey_number: Number(jerseyNumber),
                    height: height
                }
            ])
            .select();

        if (error) {
            console.error(error);
            alert("ERROR: " + error.message);
            return;
        }

        alert("Player successfully added to Hoop Hub PH!");

        console.log(data);

        playerForm.reset();

    });



</script>
    
</body>

</html>
