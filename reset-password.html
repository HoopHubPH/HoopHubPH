<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your HoopHub PH account password.">
  <title>Reset Password | HoopHub PH</title>
  <style>
    :root {
      --orange: #ff6b00;
      --orange-dark: #db5c00;
      --ink: #171717;
      --muted: #6b7280;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --success: #067647;
      --success-bg: #ecfdf3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 107, 0, 0.09), transparent 30%),
        #f4f5f7;
    }

    .site-header {
      height: 64px;
      padding: 0 clamp(20px, 6vw, 90px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111111;
      color: #ffffff;
    }

    .brand,
    .home-link { color: #ffffff; text-decoration: none; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
    .brand span { color: var(--orange); }
    .home-link { font-size: 14px; font-weight: 700; }
    .home-link:hover { color: var(--orange); }

    main {
      min-height: calc(100vh - 64px);
      padding: 36px 18px;
      display: grid;
      place-items: center;
    }

    .reset-card {
      width: min(430px, 100%);
      padding: 44px 40px;
      background: #ffffff;
      border: 1px solid rgba(17, 17, 17, 0.08);
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(17, 24, 39, 0.12);
    }

    h1 { font-size: 29px; letter-spacing: -0.6px; }
    .intro { margin: 9px 0 26px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 750; }

    .password-wrap { position: relative; }
    input {
      width: 100%;
      height: 48px;
      padding: 0 70px 0 14px;
      color: var(--ink);
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.13); }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 5px;
      color: #4b5563;
      background: transparent;
      border: 0;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-bottom: 17px;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
    }
    .message.error { display: block; color: var(--danger); background: var(--danger-bg); border-color: #fecdca; }
    .message.success { display: block; color: var(--success); background: var(--success-bg); border-color: #abefc6; }

    .submit-button {
      width: 100%;
      height: 49px;
      margin-top: 3px;
      color: #ffffff;
      background: var(--orange);
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .submit-button:hover:not(:disabled) { background: var(--orange-dark); }
    .submit-button:disabled { cursor: wait; opacity: 0.72; }

    .back-link {
      display: block;
      margin-top: 18px;
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      main { padding: 22px 14px; align-items: start; }
      .reset-card { padding: 36px 24px; }
      .site-header { padding: 0 17px; }
      .brand { font-size: 19px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">HOOP <span>HUB PH</span></a>
    <a class="home-link" href="index.html">Back to Home</a>
  </header>

  <main>
    <section class="reset-card" aria-labelledby="resetTitle">
      <h1 id="resetTitle">Set a new password</h1>
      <p class="intro">Use at least eight characters and choose a password you do not use elsewhere.</p>
      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="password-wrap">
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required disabled>
            <button class="show-password" type="button" data-target="newPassword">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <div class="password-wrap">
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required disabled>
            <button class="show-password" type="button" data-target="confirmPassword">Show</button>
          </div>
        </div>

        <button id="submitButton" class="submit-button" type="submit" disabled>Update Password</button>
      </form>

      <a class="back-link" href="login.html">Back to Sign In</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://tkrsyiwffqkgfyooewsf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ij3LxeO764v43F3VgIDE-g_Ow4Wkhjt";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const resetForm = document.getElementById("resetForm");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("submitButton");
    const messageBox = document.getElementById("message");
    let recoverySessionReady = false;

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
    }

    function enableResetForm() {
      recoverySessionReady = true;
      newPasswordInput.disabled = false;
      confirmPasswordInput.disabled = false;
      submitButton.disabled = false;
      showMessage("Reset link verified. Enter your new password.", "success");
    }

    function setLoading(isLoading) {
      newPasswordInput.disabled = isLoading || !recoverySessionReady;
      confirmPasswordInput.disabled = isLoading || !recoverySessionReady;
      submitButton.disabled = isLoading || !recoverySessionReady;
      submitButton.textContent = isLoading ? "Updating Password..." : "Update Password";
    }

    document.querySelectorAll(".show-password").forEach((button) => {
      button.addEventListener("click", function () {
        const input = document.getElementById(button.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";
      });
    });

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        enableResetForm();
      }
    });

    async function initializeRecovery() {
      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (!error && data.session) {
          enableResetForm();
          return;
        }
      } catch (error) {
        console.error("Unable to verify recovery session:", error);
      }

      window.setTimeout(() => {
        if (!recoverySessionReady) {
          showMessage("This password-reset link is invalid or has expired. Request a new link from the sign-in page.");
        }
      }, 2500);
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!recoverySessionReady) {
        showMessage("Open this page using the password-reset link sent to your email.");
        return;
      }

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword.length < 8) {
        showMessage("Your password must contain at least 8 characters.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("The passwords do not match.");
        return;
      }

      setLoading(true);

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

        if (error) {
          showMessage(error.message || "Unable to update the password.");
          setLoading(false);
          return;
        }

        await supabaseClient.auth.signOut();
        recoverySessionReady = false;
        resetForm.reset();
        showMessage("Password updated successfully. You can now sign in with your new password.", "success");
        submitButton.disabled = true;
      } catch (error) {
        console.error("Password update failed:", error);
        showMessage("Unable to connect. Check your internet connection and try again.");
        setLoading(false);
      }
    });

    initializeRecovery();
  </script>
</body>
</html>
